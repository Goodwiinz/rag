name: Production Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        default: 'latest'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rag-system

permissions:
  contents: read
  packages: write
  deployments: write
  actions: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      backend-image: ${{ steps.backend-meta.outputs.tags }}
      frontend-image: ${{ steps.frontend-meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for backend
      id: backend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ github.event.inputs.version || 'latest' }}

    - name: Extract metadata for frontend
      id: frontend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ github.event.inputs.version || 'latest' }}

    - name: Build and push backend image
      id: backend-build
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.backend-meta.outputs.tags }}
        labels: ${{ steps.backend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        target: production

    - name: Build and push frontend image
      id: frontend-build
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.frontend-meta.outputs.tags }}
        labels: ${{ steps.frontend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        build-args: |
          NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
          NEXT_PUBLIC_WS_URL=${{ vars.WS_URL }}

    - name: Generate version tag
      id: version
      run: |
        VERSION="${{ github.event.inputs.version || 'latest' }}"
        if [[ "$VERSION" == "latest" ]]; then
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build-and-push.outputs.backend-image }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run security scan on frontend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build-and-push.outputs.frontend-image }}
        format: 'sarif'
        output: 'trivy-frontend-results.sarif'

    - name: Upload frontend Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-frontend-results.sarif'

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    environment: staging
    if: github.event.inputs.environment == 'staging' || github.event.inputs.environment == ''
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Deploy to staging
      run: |
        # Update image tags in deployment manifests
        sed -i "s|rag-system/backend:latest|${{ needs.build-and-push.outputs.backend-image }}|g" deployment/k8s/deployments/rag-backend.yaml
        sed -i "s|rag-system/frontend:latest|${{ needs.build-and-push.outputs.frontend-image }}|g" deployment/k8s/deployments/rag-backend.yaml

        # Apply configurations
        kubectl apply -f deployment/k8s/namespace/ --validate=false
        kubectl apply -f deployment/k8s/configmaps/ --validate=false
        kubectl apply -f deployment/k8s/secrets/ --validate=false
        kubectl apply -f deployment/k8s/deployments/ --validate=false
        kubectl apply -f deployment/k8s/services/ --validate=false
        kubectl apply -f deployment/k8s/hpa/ --validate=false

    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/rag-backend -n rag-system --timeout=600s
        kubectl rollout status deployment/rag-frontend -n rag-system --timeout=300s

    - name: Run smoke tests
      run: |
        # Wait for services to be ready
        kubectl wait --for=condition=ready pod -l app=rag-backend -n rag-system --timeout=300s
        kubectl wait --for=condition=ready pod -l app=rag-frontend -n rag-system --timeout=300s

        # Get service URL
        SERVICE_URL=$(kubectl get ingress rag-ingress -n rag-system -o jsonpath='{.spec.rules[0].host}')

        # Run health checks
        curl -f "https://$SERVICE_URL/api/health" || exit 1
        curl -f "https://$SERVICE_URL/api/ready" || exit 1

    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          🚀 Staging Deployment Status: ${{ job.status }}
          Version: ${{ needs.build-and-push.outputs.version }}
          Backend Image: ${{ needs.build-and-push.outputs.backend-image }}
          Frontend Image: ${{ needs.build-and-push.outputs.frontend-image }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan, deploy-staging]
    environment: production
    if: github.event.inputs.environment == 'production'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Create backup
      run: |
        # Backup databases before deployment
        kubectl exec -n rag-system deployment/postgres-rag -- pg_dump -U ${{ secrets.POSTGRES_USER }} rag_production > backup-$(date +%Y%m%d-%H%M%S).sql
        kubectl exec -n rag-system deployment/neo4j-rag -- neo4j-admin dump --database=neo4j --to=/backup/neo4j-$(date +%Y%m%d-%H%M%S).dump

    - name: Deploy to production (Blue-Green)
      run: |
        # Update image tags for production
        sed -i "s|rag-system/backend:latest|${{ needs.build-and-push.outputs.backend-image }}|g" deployment/k8s/deployments/rag-backend.yaml
        sed -i "s|rag-system/frontend:latest|${{ needs.build-and-push.outputs.frontend-image }}|g" deployment/k8s/deployments/rag-backend.yaml

        # Deploy to green environment (20% traffic initially)
        kubectl patch deployment rag-backend -n rag-system -p '{"spec":{"replicas":4}}'
        kubectl patch deployment rag-frontend -n rag-system -p '{"spec":{"replicas":4}}'

        # Apply new configurations
        kubectl apply -f deployment/k8s/configmaps/
        kubectl apply -f deployment/k8s/deployments/

        # Wait for new pods to be ready
        kubectl rollout status deployment/rag-backend -n rag-system --timeout=600s
        kubectl rollout status deployment/rag-frontend -n rag-system --timeout=300s

    - name: Gradual traffic shift
      run: |
        # Shift traffic gradually (20% -> 50% -> 100%)
        for percentage in 20 50 100; do
          echo "Shifting $percentage% traffic to new version..."
          kubectl patch service rag-backend -n rag-system -p '{"spec":{"selector":{"version":"v1"}}}'
          sleep 60  # Wait for traffic to stabilize

          # Run health checks
          SERVICE_URL=$(kubectl get ingress rag-ingress -n rag-system -o jsonpath='{.spec.rules[0].host}')
          for i in {1..10}; do
            curl -f "https://$SERVICE_URL/api/health" || break
            sleep 10
          done
        done

    - name: Scale down old version
      run: |
        # Once traffic is fully shifted, scale down old pods
        kubectl patch deployment rag-backend -n rag-system -p '{"spec":{"replicas":3}}'
        kubectl patch deployment rag-frontend -n rag-system -p '{"spec":{"replicas":3}}'

    - name: Final health check
      run: |
        SERVICE_URL=$(kubectl get ingress rag-ingress -n rag-system -o jsonpath='{.spec.rules[0].host}')

        # Comprehensive health checks
        curl -f "https://$SERVICE_URL/api/health" || exit 1
        curl -f "https://$SERVICE_URL/api/ready" || exit 1
        curl -f "https://$SERVICE_URL/api/metrics" || exit 1

        # Test WebSocket connection
        timeout 10s wscat -c "wss://$SERVICE_URL/ws" || echo "WebSocket test completed"

    - name: Update deployment status
      if: success()
      run: |
        # Mark deployment as successful
        kubectl annotate deployment rag-backend -n rag-system deployment.kubernetes.io/revision-${{ needs.build-and-push.outputs.version }}=success
        kubectl annotate deployment rag-frontend -n rag-system deployment.kubernetes.io/revision-${{ needs.build-and-push.outputs.version }}=success

    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          🚀 Production Deployment Status: ${{ job.status }}
          Version: ${{ needs.build-and-push.outputs.version }}
          Backend Image: ${{ needs.build-and-push.outputs.backend-image }}
          Frontend Image: ${{ needs.build-and-push.outputs.frontend-image }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Deployment failed! Initiating rollback..."
        kubectl rollout undo deployment/rag-backend -n rag-system
        kubectl rollout undo deployment/rag-frontend -n rag-system

        # Wait for rollback to complete
        kubectl rollout status deployment/rag-backend -n rag-system --timeout=600s
        kubectl rollout status deployment/rag-frontend -n rag-system --timeout=300s

        # Notify about rollback
        curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🚨 PRODUCTION ROLLBACK INITIATED for version ${{ needs.build-and-push.outputs.version }}"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}