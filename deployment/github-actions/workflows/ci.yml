name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "curl -f http://localhost:7474/dbms/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.7.3
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
        test-type: [unit, integration, e2e]
        exclude:
          - python-version: 3.9
            test-type: e2e
          - python-version: 3.10
            test-type: e2e

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-build-isolation openai-whisper==20231117
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r requirements-test.txt

    - name: Run code formatting checks
      run: |
        black --check --diff src/ tests/
        isort --check-only --diff src/ tests/
        flake8 src/ tests/

    - name: Run type checking
      run: |
        mypy src/ --ignore-missing-imports --strict

    - name: Run security scanning
      run: |
        bandit -r src/ -f json -o security-report.json
        safety check --json --output safety-report.json

    - name: Run tests
      run: |
        if [ "${{ matrix.test-type }}" = "unit" ]; then
          pytest tests/unit/ --cov=src --cov-report=xml --cov-report=html --cov-fail-under=80
        elif [ "${{ matrix.test-type }}" = "integration" ]; then
          pytest tests/integration/ --cov=src --cov-report=xml --cov-report=html --cov-fail-under=70
        else
          pytest tests/e2e/ --cov=src --cov-report=xml --cov-report=html --cov-fail-under=60
        fi

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: ${{ matrix.test-type }}
        name: ${{ matrix.test-type }}-coverage

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports-${{ matrix.python-version }}-${{ matrix.test-type }}
        path: |
          security-report.json
          safety-report.json

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    outputs:
      backend-image: ${{ steps.meta.outputs.tags-backend }}
      ui-image: ${{ steps.meta.outputs.tags-ui }}
      api-server-image: ${{ steps.meta.outputs.tags-api-server }}
      ingestion-service-image: ${{ steps.meta.outputs.tags-ingestion-service }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags-backend }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build UI image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/ui/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags-ui }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build API server image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/api_server/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags-api-server }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build ingestion service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/ingestion_service/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags-ingestion-service }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download security reports
      uses: actions/download-artifact@v3
      with:
        name: security-reports-*

    - name: Check security issues
      run: |
        python scripts/check-security-issues.py

    - name: Check test coverage
      run: |
        python scripts/check-coverage.py

    - name: Run SonarQube scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    name: Package Helm Charts
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Package Helm chart
      run: |
        helm package deployment/helm/rag-system/
        helm package deployment/helm/rag-system/monitoring/
        helm package deployment/helm/rag-system/logging/

    - name: Upload Helm charts
      uses: actions/upload-artifact@v3
      with:
        name: helm-charts
        path: |
          *.tgz
        retention-days: 30
