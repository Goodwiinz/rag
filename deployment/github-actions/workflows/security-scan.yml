name: Security Scan

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        scan-type: [container, dependencies, infrastructure, secrets]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Trivy vulnerability scanner (containers)
      if: matrix.scan-type == 'container'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        format: 'sarif'
        output: 'trivy-results.sarif'
        image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'

    - name: Run Trivy filesystem scanner (dependencies)
      if: matrix.scan-type == 'dependencies'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'

    - name: Run Grype vulnerability scanner
      if: matrix.scan-type == 'dependencies'
      uses: anchore/scan-action@v3
      with:
        image: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
        fail-build: true
        severity-cutoff: 'high'

    - name: Run Snyk security scan
      if: matrix.scan-type == 'dependencies'
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --all-projects

    - name: Run tfsec for infrastructure security
      if: matrix.scan-type == 'infrastructure'
      uses: aquasecurity/tfsec-action@master
      with:
        working-directory: './terraform'
        format: 'sarif'
        output: 'tfsec-results.sarif'

    - name: Run Checkov for infrastructure security
      if: matrix.scan-type == 'infrastructure'
      uses: bridgecrewio/checkov-action@master
      with:
        directory: './terraform'
        soft-fail: false
        framework: terraform
        output_format: sarif
        output_file_path: 'checkov-results.sarif'

    - name: Run Gitleaks for secrets detection
      if: matrix.scan-type == 'secrets'
      uses: gitleaks/gitleaks-action@master
      with:
        config-path: '.gitleaks.toml'
        redact: true
        verbose: true

    - name: Run Semgrep for security scanning
      if: matrix.scan-type == 'dependencies'
      uses: returntocorp/semgrep-action@v1
      with:
        config: 'p/ci'
        options: '--json --sarif --output=semgrep-results.sarif'

    - name: Upload SARIF to GitHub
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
        category: trivy-${{ matrix.scan-type }}

    - name: Upload SARIF to GitHub
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'tfsec-results.sarif'
        category: tfsec-${{ matrix.scan-type }}

    - name: Upload SARIF to GitHub
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'checkov-results.sarif'
        category: checkov-${{ matrix.scan-type }}

    - name: Upload SARIF to GitHub
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'semgrep-results.sarif'
        category: semgrep-${{ matrix.scan-type }}

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit pip-audit

    - name: Run pip audit
      run: |
        pip-audit --desc --output pip-audit-report.json
        cat pip-audit-report.json

    - name: Run safety check
      run: |
        safety check --json --output safety-report.json
        cat safety-report.json

    - name: Run pip check
      run: |
        pip check --dry-run

    - name: Generate SBOM
      run: |
        pip install cyclonedx-python-lib
        pip-compile --generate-hashes requirements.in
        pip-compile --generate-hashes requirements-dev.in
        pip-compile --generate-hashes requirements-test.in

    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom-results
        path: |
          pip-audit-report.json
          safety-report.json
          requirements.txt
          requirements-dev.txt
          requirements-test.txt
        retention-days: 30

  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit mypy black isort flake8 pylint

    - name: Run bandit security scanner
      run: |
        bandit -r src/ -f json -o bandit-report.json
        bandit -r src/ -f sarif -o bandit-report.sarif

    - name: Run mypy type checker
      run: |
        mypy src/ --ignore-missing-imports --strict --show-error-codes --non-interactive

    - name: Run black formatter
      run: |
        black --check --diff src/ tests/

    - name: Run isort import sorter
      run: |
        isort --check-only --diff src/ tests/

    - name: Run flake8 linter
      run: |
        flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503

    - name: Run pylint linter
      run: |
        pylint src/ tests/ --disable=C0103,C0114,C0115,C0116,C0301,C0326,W0511

    - name: Upload reports
      uses: actions/upload-artifact@v3
      with:
        name: code-analysis-results
        path: |
          bandit-report.json
          bandit-report.sarif
        retention-days: 30

  infrastructure-security:
    name: Infrastructure Security
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.6.0'

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Install Kubescape
      run: |
        curl -sL https://github.com/kubescape/kubescape/releases/latest/download/kubescape-cli-linux-amd64.tar.gz | tar xvz
        sudo mv kubescape /usr/local/bin/

    - name: Run Terraform security scan
      run: |
        cd terraform/
        terraform init
        terraform plan -out=tfplan

    - name: Check Terraform security
      run: |
        cd terraform/
        checkov --directory . --output-format sarif --output-file checkov-results.sarif

    - name: Check Kubernetes security
      run: |
        kubaseline scan config --config .kubescape.yaml --output kubescape-results.json

    - name: Check AWS security
      if: env.AWS_ACCESS_KEY_ID != ''
      run: |
        echo "${{ secrets.AWS_ACCESS_KEY_ID }}" > /tmp/aws-key
        echo "${{ secrets.AWS_SECRET_ACCESS_KEY }}" > /tmp/aws-secret
        tfsec --out=tfsec-results.json .

    - name: Upload infrastructure security reports
      uses: actions/upload-artifact@v3
      with:
        name: infrastructure-security-results
        path: |
          checkov-results.sarif
          kubescape-results.json
          tfsec-results.json
        retention-days: 30

  compliance-check:
    name: Compliance Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install compliance tools
      run: |
        python -m pip install --upgrade pip
        pip install compliance-checker git-secrets

    - name: Run OpenAPI compliance check
      run: |
        compliance-check -f api-compliance.yaml -o api-compliance-report.json

    - name: Run git-secrets
      run: |
        git secrets --scan --all
        git secrets --scan-branches

    - name: Check GDPR compliance
      run: |
        python scripts/check-gdpr-compliance.py

    - name: Check SOC2 compliance
      run: |
        python scripts/check-soc2-compliance.py

    - name: Check ISO27001 compliance
      run: |
        python scripts/check-iso27001-compliance.py

    - name: Upload compliance reports
      uses: actions/upload-artifact@v3
      with:
        name: compliance-results
        path: |
          api-compliance-report.json
          gdpr-compliance-report.json
          soc2-compliance-report.json
          iso27001-compliance-report.json
        retention-days: 30

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [vulnerability-scan, dependency-check, code-analysis, infrastructure-security, compliance-check]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all security reports
      uses: actions/download-artifact@v3
      with:
        path: ./security-reports/

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install markdown pyyaml

    - name: Generate security report
      run: |
        python scripts/generate-security-report.py

    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: ./security-report.md
        retention-days: 30

    - name: Upload security summary
      uses: actions/upload-artifact@v3
      with:
        name: security-summary
        path: ./security-summary.json
        retention-days: 30

    - name: Notify security team
      if: needs.vulnerability-scan.result == 'failure'
      run: |
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Security scan failed. Please review the security report. Run ID: ${{ github.run_id }}\"}" \
          ${{ secrets.SECURITY_TEAM_WEBHOOK }}