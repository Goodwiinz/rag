# Priority classes
priorityClasses:
  high:
    name: high-priority
    value: 1000000
    description: "High priority workloads"
  medium:
    name: medium-priority
    value: 500000
    description: "Medium priority workloads"
  low:
    name: low-priority
    value: 100000
    description: "Low priority workloads"

# Feature flags
featureFlags:
  enableCanaryDeployments: false
  enableAIBackend: true
  enableMultimodalProcessing: true
  enableKnowledgeGraph: true
  enableVectorSearch: true
  enableHybridSearch: true
  enableEvaluationMetrics: true
  enableMonitoring: true
  enableLogging: true
  enableSecurityScanning: true
  enableAutoScaling: true
  enableBackup: true
  enableDisasterRecovery: true

# Backup and disaster recovery
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30d"
  destination: "s3://rag-backups/"
  encryption: true
  compression: true
  databases:
    - neo4j
    - qdrant
    - redis
    - elasticsearch
  applications:
    - rag-backend
    - rag-ui
    - rag-api-server
    - rag-ingestion-service

disasterRecovery:
  enabled: true
  drSite: "secondary-region"
  replication:
    enabled: true
    interval: "5m"
    rto: "1h"
    rpo: "15m"
  failover:
    enabled: true
    automatic: false
    manualApproval: true
  backup:
    enabled: true
    interval: "1h"
    retention: "7d"
    destination: "s3://rag-dr-backups/"

# Security configurations
security:
  enabled: true
  tls:
    enabled: true
    auto: true
    issuer: "letsencrypt-prod"
  network:
    enabled: true
    firewalls: true
    waf: true
    ddosProtection: true
  secrets:
    enabled: true
    vault: true
    rotation: "30d"
  compliance:
    enabled: true
    standards: ["SOC2", "ISO27001", "GDPR"]
    scanning: true
    monitoring: true

# Observability
observability:
  enabled: true
  tracing:
    enabled: true
    jaeger: true
    sampleRate: "0.1"
  metrics:
    enabled: true
    prometheus: true
    grafana: true
    alerting: true
  logging:
    enabled: true
    elasticsearch: true
    kibana: true
    retention: "30d"
  dashboards:
    enabled: true
    grafana: true
    prometheus: true
    alerts: true

# Storage classes
storageClasses:
  fast-ssd:
    provisioner: "kubernetes.io/aws-ebs"
    parameters:
      type: "gp3"
      iops: "3000"
      throughput: "125"
    reclaimPolicy: "Delete"
    volumeBindingMode: "WaitForFirstConsumer"
    allowVolumeExpansion: true
    mountOptions:
      - debug
  standard-hdd:
    provisioner: "kubernetes.io/aws-ebs"
    parameters:
      type: "gp2"
    reclaimPolicy: "Delete"
    volumeBindingMode: "WaitForFirstConsumer"
    allowVolumeExpansion: true
  cold-storage:
    provisioner: "kubernetes.io/aws-ebs"
    parameters:
      type: "sc1"
    reclaimPolicy: "Delete"
    volumeBindingMode: "WaitForFirstConsumer"
    allowVolumeExpansion: true
