{{- if and .Values.qdrant.enabled .Values.qdrant.persistence.enabled }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "rag-system.fullname" . }}-qdrant-pvc
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    {{- include "rag-system.labels" . | set "app" "qdrant" | set "version" "v1.0.0" | nindent 4 }}
spec:
  accessModes:
  - {{ .Values.qdrant.persistence.accessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.qdrant.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.qdrant.persistence.size }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "rag-system.fullname" . }}-qdrant-snapshots-pvc
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    {{- include "rag-system.labels" . | set "app" "qdrant" | set "version" "v1.0.0" | nindent 4 }}
spec:
  accessModes:
  - {{ .Values.qdrant.persistence.snapshotsAccessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.qdrant.persistence.snapshotsStorageClass | default .Values.qdrant.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.qdrant.persistence.snapshotsSize }}
{{- end }}