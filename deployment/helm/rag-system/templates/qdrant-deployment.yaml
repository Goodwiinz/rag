{{- if .Values.qdrant.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-system.fullname" . }}-qdrant
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    {{- include "rag-system.labels" . | set "app" "qdrant" | set "version" "v1.0.0" | nindent 4 }}
  {{- if .Values.qdrant.deployment.annotations }}
  annotations:
    {{- toYaml .Values.qdrant.deployment.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.qdrant.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        version: v1.0.0
      {{- if .Values.qdrant.template.annotations }}
      annotations:
        {{- toYaml .Values.qdrant.template.annotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rag-system.fullname" . }}-qdrant-sa
      {{- include "rag-system.securityContext" . | set "Values" .Values.qdrant | nindent 6 }}
      {{- include "rag-system.nodeAffinity" . | set "Values" (dict "nodeAffinity" (dict "enabled" true "key" "node-role" "operator" "In" "values" ["database"])) | nindent 6 }}
      {{- include "rag-system.tolerations" . | set "Values" (dict "tolerations" (list (dict "key" "dedicated" "operator" "Equal" "value" "database" "effect" "NoSchedule"))) | nindent 6 }}
      containers:
      - name: qdrant
        image: {{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}
        imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
        {{- include "rag-system.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: 6333
          name: http
        env:
        - name: QDRANT__SERVICE__HTTP_PORT
          value: {{ .Values.qdrant.env.QDRANT__SERVICE__HTTP_PORT }}
        - name: QDRANT__SERVICE__API_KEY
          value: {{ .Values.qdrant.env.QDRANT__SERVICE__API_KEY }}
        - name: QDRANT__SERVICE__ENABLE_CORS
          value: {{ .Values.qdrant.env.QDRANT__SERVICE__ENABLE_CORS }}
        - name: QDRANT__LOG_LEVEL
          value: {{ .Values.qdrant.env.QDRANT__LOG_LEVEL }}
        - name: QDRANT__STORAGE__STORAGE_PATH
          value: {{ .Values.qdrant.env.QDRANT__STORAGE__STORAGE_PATH }}
        - name: QDRANT__STORAGE__SNAPSHOTS_PATH
          value: {{ .Values.qdrant.env.QDRANT__STORAGE__SNAPSHOTS_PATH }}
        {{- if .Values.qdrant.persistence.enabled }}
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
        - name: qdrant-snapshots
          mountPath: /qdrant/snapshots
        {{- end }}
        resources:
          requests:
            memory: {{ .Values.qdrant.resources.requests.memory }}
            cpu: {{ .Values.qdrant.resources.requests.cpu }}
          limits:
            memory: {{ .Values.qdrant.resources.limits.memory }}
            cpu: {{ .Values.qdrant.resources.limits.cpu }}
      {{- if .Values.qdrant.persistence.enabled }}
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: {{ include "rag-system.fullname" . }}-qdrant-pvc
      - name: qdrant-snapshots
        persistentVolumeClaim:
          claimName: {{ include "rag-system.fullname" . }}-qdrant-snapshots-pvc
      {{- end }}
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecrets }}
{{- end }}