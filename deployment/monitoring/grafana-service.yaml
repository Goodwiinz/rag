apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: rag-monitoring
  labels:
    app: grafana
    component: monitoring
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3000'
    prometheus.io/path: '/metrics'
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 3000
    targetPort: 4000
    protocol: TCP
  selector:
    app: grafana