apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: rag-monitoring
  labels:
    app: alertmanager
    component: monitoring
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9093'
    prometheus.io/path: '/metrics'
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9093
    targetPort: 9093
    protocol: TCP
  - name: cluster
    port: 6783
    targetPort: 6783
    protocol: TCP
  selector:
    app: alertmanager