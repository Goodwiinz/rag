apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rag-monitoring
  labels:
    app: prometheus
    component: monitoring
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9090'
    prometheus.io/path: '/metrics'
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: web
    port: 9091
    targetPort: 9091
    protocol: TCP
  selector:
    app: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-headless
  namespace: rag-monitoring
  labels:
    app: prometheus
    component: monitoring
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: web
    port: 9091
    targetPort: 9091
    protocol: TCP
  selector:
    app: prometheus