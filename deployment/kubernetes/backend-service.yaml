apiVersion: v1
kind: Service
metadata:
  name: rag-backend
  namespace: rag-system
  labels:
    app: rag-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    name: http
    protocol: TCP
  - port: 8080
    targetPort: 8001
    name: metrics
    protocol: TCP
  selector:
    app: rag-backend
  sessionAffinity: None
  externalTrafficPolicy: Local
  publishNotReadyAddresses: false
---