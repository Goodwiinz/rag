apiVersion: v1
kind: Service
metadata:
  name: rag-ingestion-service
  namespace: rag-system
  labels:
    app: rag-ingestion
    component: backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 9090
    protocol: TCP
  selector:
    app: rag-ingestion
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: rag-ingestion-headless
  namespace: rag-system
  labels:
    app: rag-ingestion
    component: backend
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: rag-ingestion
    component: backend