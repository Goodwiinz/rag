apiVersion: v1
kind: Service
metadata:
  name: rag-ui
  namespace: rag-system
  labels:
    app: rag-ui
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8501"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8501
    name: http
    protocol: TCP
  selector:
    app: rag-ui
---