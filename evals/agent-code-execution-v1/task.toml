schema_version = "1.2"
source = "git+https://github.com/Goodwiinz/rag.git@92678fc4692c8d5cb7025b7ad446209b0fa63590"
artifacts = ["/logs/agent/evidence.json", "/logs/agent/trajectory.json"]

[task]
name = "goodwiinz/agent-code-execution-v1"
description = "Use Python to find a SHA-256 digest in an E2B-protocol sandbox double behind one HITL approval and report the genuinely computed result."
authors = [{ name = "Goodwiinz" }]
keywords = ["langgraph", "e2b", "code-execution", "hitl", "tools", "intent-routing"]

[metadata]
benchmark_id = "agent-code-execution-v1"
source_revision = "92678fc4692c8d5cb7025b7ad446209b0fa63590"
agent_revision = "92678fc4692c8d5cb7025b7ad446209b0fa63590"
harbor_version = "0.6.6"
base_image_digest = "sha256:75b224f86a60c02e9343ca085fb4f195251a2554119b78e0972c3e09966c0e34"

[verifier]
timeout_sec = 120.0

[verifier.env]

[agent]
timeout_sec = 360.0

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
# Harbor's network_mode:none would also sever the private database and
# mock-services network. Compose supplies the stricter useful boundary: main
# is attached only to an internal network, while Squid is the sole public
# bridge and allowlists the configured Azure model host.
allow_internet = true
mcp_servers = []
workdir = "/app"

[environment.env]
AZURE_OPENAI_CHAT_ENDPOINT = "${AZURE_OPENAI_CHAT_ENDPOINT}"
AZURE_OPENAI_CHAT_API_KEY = "${AZURE_OPENAI_CHAT_API_KEY}"
AZURE_OPENAI_CHAT_DEPLOYMENT_NAME = "${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}"
AZURE_OPENAI_CHAT_API_VERSION = "${AZURE_OPENAI_CHAT_API_VERSION}"
AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT = "${AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT}"
AZURE_OPENAI_SYNTHESIS_DEPLOYMENT = "${AZURE_OPENAI_SYNTHESIS_DEPLOYMENT:-}"

[solution.env]
