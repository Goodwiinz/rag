services:
  main:
    build:
      context: ../../..
      dockerfile: evals/agent-tenant-isolation-v1/environment/Dockerfile
    platform: linux/amd64
    environment:
      DATABASE_URL: postgresql://benchmark:benchmark-local-only@postgres:5432/benchmark
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: benchmark-local-only
      ENVIRONMENT: benchmark
      SECRET_KEY: benchmark-secret-key-only-000000000000000000000000
      JWT_SECRET_KEY: benchmark-jwt-key-only-000000000000000000000000000
      ENCRYPTION_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AZURE_OPENAI_CHAT_ENDPOINT: ${AZURE_OPENAI_CHAT_ENDPOINT}
      AZURE_OPENAI_CHAT_API_KEY: ${AZURE_OPENAI_CHAT_API_KEY}
      AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}
      AZURE_OPENAI_CHAT_API_VERSION: ${AZURE_OPENAI_CHAT_API_VERSION}
      AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT: ${AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT}
      AZURE_OPENAI_SYNTHESIS_DEPLOYMENT: ${AZURE_OPENAI_SYNTHESIS_DEPLOYMENT:-}
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: postgres,redis,neo4j,egress-proxy,localhost,127.0.0.1
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      LANGSMITH_API_KEY: ""
      LANGCHAIN_API_KEY: ""
      DO_KB_ENABLED: "false"
      DO_KB_PRIMARY_READ: "false"
      DO_API_TOKEN: ""
      COHERE_API_KEY: ""
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /tmp/nous-benchmark-storage
      ALLOW_MEMORY_FALLBACK: "false"
      AGENT_FAST_PATH_ENABLED: "false"
      AGENT_CANONICAL_PERSISTENCE: "true"
      AGENT_SERVER_SIDE_HISTORY: "false"
      AGENT_USE_RESPONSES_API: "false"
      AGENT_PARALLEL_TOOL_CALLS: "false"
      PROJECT_SKILL_CATALOG_ENABLED: "true"
      PROJECT_SKILL_RUNTIME_ENABLED: "true"
      AGENT_DISPATCH_BACKEND: background
      AGENT_LLM_MAX_RETRIES: "1"
      AGENT_LLM_REQUEST_TIMEOUT: "45"
      AGENT_LIGHTWEIGHT_REQUEST_TIMEOUT: "30"
      DB_ASYNC_POOL_SIZE: "3"
      DB_ASYNC_MAX_OVERFLOW: "2"
      DB_SYNC_POOL_SIZE: "1"
      DB_SYNC_MAX_OVERFLOW: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    networks:
      - benchmark-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import fastapi, langgraph, redis, sqlalchemy, neo4j"]
      interval: 5s
      timeout: 20s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark-local-only
    networks:
      - benchmark-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - benchmark-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/benchmark-local-only
      NEO4J_dbms_memory_pagecache_size: 128M
      NEO4J_dbms_memory_heap_max__size: 256M
    networks:
      - benchmark-internal
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p benchmark-local-only 'RETURN 1'"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 15s

  egress-proxy:
    build:
      context: ./proxy
    environment:
      AZURE_OPENAI_CHAT_ENDPOINT: ${AZURE_OPENAI_CHAT_ENDPOINT}
    networks:
      - benchmark-internal
      - egress-public
    healthcheck:
      test: ["CMD-SHELL", "squid -k check"]
      interval: 3s
      timeout: 5s
      retries: 20

networks:
  benchmark-internal:
    internal: true
  egress-public: {}
