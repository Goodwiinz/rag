services:
  main:
    build:
      context: ../../..
      dockerfile: evals/agent-stream-cancel-durability-v1/environment/Dockerfile
    platform: linux/amd64
    environment:
      DATABASE_URL: postgresql://benchmark:benchmark-local-only@postgres:5432/benchmark
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: benchmark
      SECRET_KEY: benchmark-secret-key-only-000000000000000000000000
      JWT_SECRET_KEY: benchmark-jwt-key-only-000000000000000000000000000
      ENCRYPTION_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AZURE_OPENAI_CHAT_ENDPOINT: ${AZURE_OPENAI_CHAT_ENDPOINT}
      AZURE_OPENAI_CHAT_API_KEY: ${AZURE_OPENAI_CHAT_API_KEY}
      AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}
      AZURE_OPENAI_CHAT_API_VERSION: ${AZURE_OPENAI_CHAT_API_VERSION}
      AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT: ${AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT}
      AZURE_OPENAI_SYNTHESIS_DEPLOYMENT: ${AZURE_OPENAI_SYNTHESIS_DEPLOYMENT:-}
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: postgres,redis,egress-proxy,localhost,127.0.0.1
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      LANGSMITH_API_KEY: ""
      LANGCHAIN_API_KEY: ""
      DO_KB_ENABLED: "false"
      DO_KB_PRIMARY_READ: "false"
      DO_API_TOKEN: ""
      COHERE_API_KEY: ""
      # Satisfy the URI validator without providing a graph service. The
      # approved request does not require KG access and localhost:1 is closed.
      NEO4J_URI: bolt://127.0.0.1:1
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /tmp/nous-benchmark-storage
      ALLOW_MEMORY_FALLBACK: "false"
      AGENT_FAST_PATH_ENABLED: "true"
      AGENT_CANONICAL_PERSISTENCE: "true"
      AGENT_SERVER_SIDE_HISTORY: "false"
      AGENT_USE_RESPONSES_API: "false"
      AGENT_PARALLEL_TOOL_CALLS: "false"
      AGENT_LLM_MAX_RETRIES: "1"
      AGENT_LLM_REQUEST_TIMEOUT: "45"
      AGENT_LIGHTWEIGHT_REQUEST_TIMEOUT: "30"
      DB_ASYNC_POOL_SIZE: "3"
      DB_ASYNC_MAX_OVERFLOW: "2"
      DB_SYNC_POOL_SIZE: "1"
      DB_SYNC_MAX_OVERFLOW: "1"
      GIT_SHA: 92678fc4692c8d5cb7025b7ad446209b0fa63590
      IMAGE_TAG: harbor-agent-stream-cancel-durability-v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    networks:
      - benchmark-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import fastapi, uvicorn, langgraph, redis, sqlalchemy"]
      interval: 5s
      timeout: 20s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark-local-only
    networks:
      - benchmark-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - benchmark-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  egress-proxy:
    build:
      context: ./proxy
    environment:
      AZURE_OPENAI_CHAT_ENDPOINT: ${AZURE_OPENAI_CHAT_ENDPOINT}
    networks:
      - benchmark-internal
      - egress-public
    healthcheck:
      test: ["CMD-SHELL", "squid -k check"]
      interval: 3s
      timeout: 5s
      retries: 20

networks:
  benchmark-internal:
    internal: true
  egress-public: {}
