schema_version = "1.2"
source = "git+https://github.com/Goodwiinz/rag.git@70efbb5d3ff22dabff7104c55d5afdb53d315f48"
artifacts = [
  "/logs/agent/evidence.json",
  "/logs/agent/trajectory.json",
  "/logs/agent/app.log",
]

[task]
name = "goodwiinz/agent-stream-cancel-durability-v1"
description = "Cancel an accepted production agent stream after its first response token and preserve a durable stopped partial turn."
authors = [{ name = "Goodwiinz" }]
keywords = ["fastapi", "langgraph", "sse", "cancellation", "durability", "redis"]

[metadata]
benchmark_id = "agent-stream-cancel-durability-v1"
source_revision = "70efbb5d3ff22dabff7104c55d5afdb53d315f48"
agent_revision = "70efbb5d3ff22dabff7104c55d5afdb53d315f48"
harbor_version = "0.6.6"
base_image_digest = "sha256:75b224f86a60c02e9343ca085fb4f195251a2554119b78e0972c3e09966c0e34"

[verifier]
timeout_sec = 120.0

[verifier.env]

[agent]
timeout_sec = 360.0

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
# Harbor's network_mode:none would also sever the private database and Redis
# network. Compose supplies the stricter useful boundary: main is attached only
# to an internal network, while Squid is the sole public bridge and allowlists
# the configured Azure model host.
allow_internet = true
mcp_servers = []
workdir = "/app"

[environment.env]
AZURE_OPENAI_CHAT_ENDPOINT = "${AZURE_OPENAI_CHAT_ENDPOINT}"
AZURE_OPENAI_CHAT_API_KEY = "${AZURE_OPENAI_CHAT_API_KEY}"
AZURE_OPENAI_CHAT_DEPLOYMENT_NAME = "${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}"
AZURE_OPENAI_CHAT_API_VERSION = "${AZURE_OPENAI_CHAT_API_VERSION}"
AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT = "${AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT}"
AZURE_OPENAI_SYNTHESIS_DEPLOYMENT = "${AZURE_OPENAI_SYNTHESIS_DEPLOYMENT:-}"

[solution.env]
