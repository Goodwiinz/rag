schema_version = "1.2"
source = "git+https://github.com/Goodwiinz/rag.git@bd9388ec19225813e5b99aba2c4042ba5b84d5db"
artifacts = ["/logs/agent/evidence.json", "/logs/agent/trajectory.json"]

[task]
name = "goodwiinz/agent-memory-roundtrip-v1"
description = "State a durable fact, recall it next turn, then forget it with one HITL approval, proving the store roundtrip and the redaction/no-bleed boundaries."
authors = [{ name = "Goodwiinz" }]
keywords = ["langgraph", "memory", "hitl", "postgres-store", "tools"]

[metadata]
benchmark_id = "agent-memory-roundtrip-v1"
source_revision = "bd9388ec19225813e5b99aba2c4042ba5b84d5db"
agent_revision = "bd9388ec19225813e5b99aba2c4042ba5b84d5db"
harbor_version = "0.6.6"
base_image_digest = "sha256:75b224f86a60c02e9343ca085fb4f195251a2554119b78e0972c3e09966c0e34"

[verifier]
timeout_sec = 120.0

[verifier.env]

[agent]
timeout_sec = 360.0

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
# Harbor's network_mode:none would also sever the private database network.
# Compose supplies the stricter useful boundary: main is attached only to an
# internal network, while Squid is the sole public bridge and allowlists the
# configured Azure model host.
allow_internet = true
mcp_servers = []
workdir = "/app"

[environment.env]
AZURE_OPENAI_CHAT_ENDPOINT = "${AZURE_OPENAI_CHAT_ENDPOINT}"
AZURE_OPENAI_CHAT_API_KEY = "${AZURE_OPENAI_CHAT_API_KEY}"
AZURE_OPENAI_CHAT_DEPLOYMENT_NAME = "${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}"
AZURE_OPENAI_CHAT_API_VERSION = "${AZURE_OPENAI_CHAT_API_VERSION}"
AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT = "${AZURE_OPENAI_LIGHTWEIGHT_DEPLOYMENT}"
AZURE_OPENAI_SYNTHESIS_DEPLOYMENT = "${AZURE_OPENAI_SYNTHESIS_DEPLOYMENT:-}"
# Store choice (landmine 6): Cohere unset -> AsyncPostgresStore builds without
# an index -> asearch returns score=None for every item -> forget_memory takes
# the substring-match fallback (memory.py:247-260), not the 0.6 threshold.
COHERE_API_KEY = ""
ALLOW_MEMORY_FALLBACK = "false"

[solution.env]
