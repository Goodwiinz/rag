name: implement-reflection-gate
description: |
  Implement a reflection gate that evaluates agent response quality and routes
  back for revision on major issues. Max 2 rounds, only for research/writing intents.
repo: .
commit: "6af5432"
files:
  - backend/src/services/agent/reflection.py
context:
  - docs/plans/2026-03-25-agent-v2-design.md
  - docs/plans/2026-03-25-agent-v2-plan.md
  - backend/src/services/agent/state.py
prompt: |
  Read the design doc section 6 (Reflection Gate) and implementation plan Task 8.

  Create backend/src/services/agent/reflection.py with:
  1. ReflectionResult (Pydantic): passed, issues, severity (none/minor/major)
  2. _build_reflection_llm() — gpt-4o-mini, temperature=0
  3. reflect_on_response(last_ai_message, original_user_message, plan, intent) -> ReflectionResult
  4. make_reflection_gate(intent_filter={"research", "writing"}) -> (node_fn, routing_fn)

  Routing logic:
  - passed or severity=="minor" -> "proceed"
  - severity=="major" and reflection_count < 2 -> "revise"
  - reflection_count >= 2 -> "proceed" (max rounds)
  - intent not in intent_filter -> skip (return "proceed")

  The tests at backend/tests/unit/services/test_agent_reflection.py must all pass.
judge:
  - type: pytest
    command: >
      cd backend &&
      mkdir -p .agent-eval-tmp &&
      git show 98a17bb:backend/tests/unit/services/test_agent_reflection.py > .agent-eval-tmp/test_agent_reflection.py &&
      .venv/bin/python -m pytest .agent-eval-tmp/test_agent_reflection.py -v
  - type: grep
    pattern: "make_reflection_gate"
    files: backend/src/services/agent/reflection.py
