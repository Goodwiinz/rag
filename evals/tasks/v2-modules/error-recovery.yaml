name: implement-error-recovery
description: |
  Implement a structured error recovery module for the NOUS agent system.
  The module should classify tool errors into categories (transient, recoverable,
  user_fixable, fatal), provide per-tool suggestions, and retry transient errors
  with exponential backoff.
repo: .
commit: "6af5432"
files:
  - backend/src/services/agent/error_recovery.py
context:
  - docs/plans/2026-03-25-agent-v2-design.md
  - docs/plans/2026-03-25-agent-v2-plan.md
  - backend/src/services/agent/state.py
  - backend/src/services/agent/graph.py
prompt: |
  Read the design doc at docs/plans/2026-03-25-agent-v2-design.md section 3 (Structured Error Recovery)
  and the implementation plan at docs/plans/2026-03-25-agent-v2-plan.md Task 2.

  Create backend/src/services/agent/error_recovery.py with:
  1. ErrorCategory type: Literal["transient", "recoverable", "user_fixable", "fatal"]
  2. TOOL_ERROR_HINTS dict mapping (tool_name, keyword) -> (category, suggestion)
  3. ToolError frozen dataclass with category, message, suggestion, to_tool_message_content(), to_state_info()
  4. classify_error(tool_name, exc) -> ToolError — classify exceptions by type
  5. classify_error_from_payload(tool_name, payload) -> ToolError — classify error payloads
  6. retry_transient(fn, max_attempts=3, base_delay=1.0) -> Any — async retry with exponential backoff

  Key requirements:
  - PermissionError is a subclass of OSError — check user_fixable BEFORE transient
  - Transient exceptions: TimeoutError, CancelledError, ConnectionError, OSError
  - TOOL_ERROR_HINTS should include: add_document_to_project/not found, ingest_arxiv_papers/timed out,
    search_arxiv/no results, search_documents/no results

  The tests are already written at backend/tests/unit/services/test_agent_error_recovery.py.
  Your implementation must pass all 10 tests.
judge:
  - type: pytest
    command: >
      cd backend &&
      mkdir -p .agent-eval-tmp &&
      git show 98a17bb:backend/tests/unit/services/test_agent_error_recovery.py > .agent-eval-tmp/test_agent_error_recovery.py &&
      .venv/bin/python -m pytest .agent-eval-tmp/test_agent_error_recovery.py -v
  - type: grep
    pattern: "class ToolError"
    files: backend/src/services/agent/error_recovery.py
  - type: grep
    pattern: "async def retry_transient"
    files: backend/src/services/agent/error_recovery.py
