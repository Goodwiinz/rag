name: implement-context-compactor
description: |
  Implement a context compactor that reduces token usage in long agent sessions
  by summarizing old tool messages while preserving critical IDs (UUIDs, arXiv IDs).
repo: .
commit: "6af5432"
files:
  - backend/src/services/agent/compactor.py
context:
  - docs/plans/2026-03-25-agent-v2-design.md
  - docs/plans/2026-03-25-agent-v2-plan.md
  - backend/src/services/agent/state.py
prompt: |
  Read the design doc section 5 (Context Compactor) and implementation plan Task 6.

  Create backend/src/services/agent/compactor.py with:
  1. estimate_tool_message_tokens(messages) -> int — len(content) // 4
  2. extract_ids(text) -> tuple[set, set] — regex for UUIDs and arXiv IDs
  3. should_compact(messages, compaction_count, threshold=8000) -> bool
  4. find_compaction_candidates(messages) — protect latest tool batch, skip [Compacted]
  5. validate_and_fix_compacted(compacted, original_ids) — append missing IDs
  6. compact_messages(candidates, config) — gpt-4o-mini summarization with ID preservation
  7. make_compactor_node() — returns graph node function

  Key requirements:
  - UUID regex: [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
  - arXiv ID regex: \d{4}\.\d{4,5}(v\d+)?
  - Compacted messages get [Compacted] prefix
  - Latest AIMessage+ToolMessage batch is always protected

  The tests at backend/tests/unit/services/test_agent_compactor.py must all pass.
judge:
  - type: pytest
    command: >
      cd backend &&
      mkdir -p .agent-eval-tmp &&
      git show 98a17bb:backend/tests/unit/services/test_agent_compactor.py > .agent-eval-tmp/test_agent_compactor.py &&
      .venv/bin/python -m pytest .agent-eval-tmp/test_agent_compactor.py -v
  - type: grep
    pattern: "make_compactor_node"
    files: backend/src/services/agent/compactor.py
