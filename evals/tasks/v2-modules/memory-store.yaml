name: implement-memory-store
description: |
  Implement a persistent memory store using PostgreSQL + Qdrant for cross-conversation
  agent memory. Must gracefully degrade when Qdrant is unavailable.
repo: .
commit: "6af5432"
files:
  - backend/src/services/agent/memory_store.py
context:
  - docs/plans/2026-03-25-agent-v2-design.md
  - docs/plans/2026-03-25-agent-v2-plan.md
  - backend/src/services/embedding/embedding_service.py
  - backend/src/services/search/vector_service.py
  - backend/src/core/config.py
prompt: |
  Read the design doc section 7 (Persistent Memory) and implementation plan Tasks 13-14.

  Create backend/src/services/agent/memory_store.py with:
  1. agent_memories table definition (SQLAlchemy Table, mirrors the Alembic migration)
  2. _get_embedding_service() — returns EmbeddingService or None
  3. _get_qdrant_client() — returns QdrantClient or None
  4. _build_insights_llm() — gpt-4o-mini for insight extraction
  5. save_memory(db, user_id, org_id, content, memory_type, metadata) — PG + Qdrant, graceful degradation
  6. search_memories(db, user_id, query, limit=5) — embed query, Qdrant search, PG hydration
  7. update_access(db, memory_id) — bump last_accessed_at and access_count
  8. cleanup_stale_memories(db, days=90) — soft-delete old memories
  9. extract_insights(messages, config) — LLM-based insight extraction

  Key requirements:
  - Qdrant failure must NOT prevent PostgreSQL persistence
  - search_memories returns empty list if Qdrant unavailable
  - extract_insights returns empty list on LLM failure
  - Use the project's EmbeddingService pattern for embeddings

  The tests at backend/tests/unit/services/test_agent_memory_store.py must all pass.
judge:
  - type: pytest
    command: >
      cd backend &&
      mkdir -p .agent-eval-tmp &&
      git show 98a17bb:backend/tests/unit/services/test_agent_memory_store.py > .agent-eval-tmp/test_agent_memory_store.py &&
      .venv/bin/python -m pytest .agent-eval-tmp/test_agent_memory_store.py -v
  - type: grep
    pattern: "async def save_memory"
    files: backend/src/services/agent/memory_store.py
  - type: grep
    pattern: "async def search_memories"
    files: backend/src/services/agent/memory_store.py
