name: add-intent-category
description: |
  Add a new "code" intent category to the classifier for code-related queries.
  Tests whether an agent can extend the classification system without breaking
  existing intent routing.
repo: .
commit: "98a17bb"
files:
  - backend/src/services/agent/classifier.py
  - backend/src/services/agent/graph.py
  - backend/tests/unit/services/test_agent_classifier.py
context:
  - backend/src/services/agent/classifier.py
  - backend/src/services/agent/graph.py
  - backend/src/services/agent/state.py
  - backend/tests/unit/services/test_agent_classifier.py
prompt: |
  Add a new "code" intent category to the agent's intent classifier:

  1. Update IntentType to include "code" as a valid intent
  2. Add code-related keywords to INTENT_KEYWORDS in graph.py:
     ("execute", 3), ("run code", 3), ("python", 2), ("script", 2), ("code", 2)
  3. Update the LLM classifier system prompt with a "code" category description and examples:
     - "run this python script" -> code
     - "execute the data analysis code" -> code
  4. Add the "code" intent to route_by_intent in graph.py (route to "llm_node" like "general")
  5. Add parametrized tests for code intent in test_agent_classifier.py

  All existing classifier tests must still pass. The new "code" intent must not
  interfere with existing research/writing/knowledge_graph/general classification.
judge:
  - type: pytest
    command: cd backend && .venv/bin/python -m pytest tests/unit/services/test_agent_classifier.py -v
  - type: pytest
    command: cd backend && .venv/bin/python -m pytest tests/unit/services/test_agent_integration.py -v
  - type: grep
    pattern: '"code"'
    files: backend/src/services/agent/classifier.py
