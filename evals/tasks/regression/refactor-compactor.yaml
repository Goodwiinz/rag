name: refactor-compactor-threshold
description: |
  Make the compaction threshold configurable via environment variable and add
  a max_compactions_per_turn limit. Tests safe refactoring of the compactor.
repo: .
commit: "98a17bb"
files:
  - backend/src/services/agent/compactor.py
  - backend/tests/unit/services/test_agent_compactor.py
context:
  - backend/src/services/agent/compactor.py
  - backend/tests/unit/services/test_agent_compactor.py
  - backend/src/core/config.py
prompt: |
  Refactor the compactor module with two changes:

  1. Make the default compaction threshold configurable:
     - Read AGENT_COMPACTION_THRESHOLD from environment (via get_settings or os.environ)
     - Default to 8000 if not set
     - Update should_compact() to use this configurable default
     - Existing tests that pass explicit threshold should still work

  2. Add a max_compactions_per_turn guard:
     - Add a MAX_COMPACTIONS_PER_TURN = 3 constant
     - In make_compactor_node(), skip compaction if compaction_count >= MAX_COMPACTIONS_PER_TURN
     - Add a test that verifies compaction is skipped when limit is reached

  All existing compactor tests must still pass. Add new tests for:
  - Configurable threshold from environment
  - Max compactions per turn limit
judge:
  - type: pytest
    command: cd backend && .venv/bin/python -m pytest tests/unit/services/test_agent_compactor.py -v
  - type: grep
    pattern: "MAX_COMPACTIONS_PER_TURN"
    files: backend/src/services/agent/compactor.py
  - type: grep
    pattern: "AGENT_COMPACTION_THRESHOLD"
    files: backend/src/services/agent/compactor.py
