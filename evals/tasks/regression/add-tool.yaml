name: add-new-agent-tool
description: |
  Add a new "summarize_thread" agent tool that summarizes the current conversation
  thread. This tests whether an agent can extend the tool system without breaking
  existing functionality.
repo: .
commit: "98a17bb"
files:
  - backend/src/api/agent/tools_impl.py
  - backend/src/services/agent/tools.py
  - backend/tests/unit/services/test_agent_tools.py
context:
  - backend/src/api/agent/tools_impl.py
  - backend/src/services/agent/tools.py
  - backend/src/services/agent/graph.py
  - backend/tests/unit/services/test_agent_tools.py
prompt: |
  Add a new agent tool called "summarize_thread" that:
  1. Takes a thread_id (string) as input
  2. Returns a summary of the conversation (for now, return a mock summary)
  3. Is NOT a destructive tool (no HITL confirmation needed)
  4. Is available in the general tool path via ALL_TOOLS

  Steps:
  1. Add the tool schema to AGENT_TOOLS in tools_impl.py (follow existing patterns)
  2. Add _tool_summarize_thread() implementation in tools_impl.py
  3. Add "summarize_thread" case to execute_tool dispatcher
  4. Add "summarize_thread" to ALL_TOOLS in tools.py
  5. Add a test in test_agent_tools.py that verifies the tool works

  All 145 existing tests must still pass after your changes.
judge:
  - type: pytest
    command: >
      cd backend && .venv/bin/python -m pytest
      tests/unit/services/test_agent_state.py
      tests/unit/services/test_agent_error_recovery.py
      tests/unit/services/test_agent_error_wiring.py
      tests/unit/services/test_agent_classifier.py
      tests/unit/services/test_agent_compactor.py
      tests/unit/services/test_agent_planner.py
      tests/unit/services/test_agent_reflection.py
      tests/unit/services/test_agent_memory_store.py
      tests/unit/services/test_agent_integration.py
      tests/unit/services/test_agent_tools.py
      tests/unit/services/test_agent_v2_integration.py -v
  - type: grep
    pattern: "summarize_thread"
    files: backend/src/api/agent/tools_impl.py
