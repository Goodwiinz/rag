[tool:pytest]
# Pytest Configuration for Integration Tests

# Test Discovery
testpaths = tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output Configuration
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10

# Custom Markers
markers =
    integration: marks tests as integration tests
    api_contract: marks tests as API contract validation tests
    websocket: marks tests as WebSocket communication tests
    auth: marks tests as authentication and authorization tests
    performance: marks tests as performance and load tests
    multitenant: marks tests as multi-tenant isolation tests

# Test Session Configuration
timeout = 300
timeout_method = thread

# Asyncio Configuration
asyncio_mode = auto

# Coverage Configuration (when used with --cov)
addopts = --cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=80

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum Version
minversion = 6.0

# Filter Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:websockets.*

# Test Parallelization (when pytest-xdist is available)
# addopts = -n auto

# Performance Testing Configuration
# Use environment variable to control performance test intensity
# PERFORMANCE_TEST_LEVEL=basic|standard|comprehensive