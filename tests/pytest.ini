[tool:pytest]
# Pytest configuration for Multimodal Enterprise RAG System

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --capture=no
    --showlocals
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=70
    --junit-xml=test-results/pytest-results.xml
    --maxfail=10
    --durations=10
    --color=yes

# Markers
markers =
    # Test types
    unit: Unit tests
    integration: Integration tests
    contract: API contract tests
    performance: Performance tests
    load: Load tests
    security: Security tests
    e2e: End-to-end tests
    summary: Summary test reporting
    slow: Tests that take longer to run
    external: Tests that require external services

    # API endpoint categories
    auth: Authentication API tests
    documents: Document management API tests
    search: Search API tests
    knowledge_graph: Knowledge graph API tests
    websocket: WebSocket API tests

    # Test characteristics
    flaky: Tests that are known to be flaky
    network: Tests that require network access
    database: Tests that require database access

    # Test environments
    local: Tests that run locally
    ci: Tests that run in CI/CD
    staging: Tests that run against staging environment

    # Performance test types
    latency: Latency-focused performance tests
    throughput: Throughput-focused performance tests
    memory: Memory usage tests

    # Security test types
    injection: SQL injection and code injection tests
    authentication: Authentication and authorization tests
    authorization: Permission and access control tests
    input_validation: Input sanitization and validation tests

    # Document types
    text: Text document tests
    pdf: PDF document tests
    image: Image document tests
    audio: Audio document tests
    video: Video document tests

    # Search types
    hybrid: Hybrid search tests
    vector: Vector search tests
    fulltext: Full-text search tests
    graph: Graph search tests

# Minimum version
minversion = 6.0

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:websockets.*
    error::ResourceWarning

# Timeout (if pytest-timeout is installed)
timeout = 300
timeout_method = thread

# Parallel execution (if pytest-xdist is installed)
# Use -n auto for automatic CPU detection
# Example: pytest -n auto

# Benchmark configuration (if pytest-benchmark is installed)
benchmark-autosave = true
benchmark-storage = file://.benchmarks
benchmark-only = false
benchmark-sort = mean