# Redis optimization configuration for Multimodal Enterprise RAG System
# Place these settings in redis.conf for optimal performance

# 1. Memory Management
# Set max memory based on available system resources
maxmemory 1gb
maxmemory-policy allkeys-lru

# Memory optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# 2. Persistence Configuration
# For better performance, consider using only AOF or RDB, not both
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB configuration (if used)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

# 3. Network Performance
# Increase TCP backlog for high concurrency
tcp-backlog 511
timeout 300
tcp-keepalive 300

# 4. Client Connections
# Increase max clients for concurrent operations
maxclients 10000

# 5. Threading and Performance (Redis 6.0+)
# Enable I/O threads for better performance
io-threads 4
io-threads-do-reads yes

# 6. Database Configuration
# Use multiple databases for different data types
databases 16

# 7. Logging
# Reduce log verbosity for better performance
loglevel notice
syslog-enabled no

# 8. Slow Log Configuration
# Monitor slow queries
slowlog-log-slower-than 10000
slowlog-max-len 128

# 9. Latency Monitoring
# Enable latency monitoring
latency-monitor-threshold 100

# 10. Memory Usage Optimization
# Disable expensive commands in production
#
# Uncomment these if you don't need these features:
# save ""  # Disable RDB snapshots
# appendonly no  # Disable AOF persistence
# # Disable keyspace events if not needed
# notify-keyspace-events ""

# 11. Security Configuration
# Add password authentication
# requirepass your-secure-password

# Rename dangerous commands
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG "CONFIG_b835c3f8a5d2e7n4c6d9e1f3a7b5c8d2"

# 12. Cluster Configuration (if using Redis Cluster)
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000
# cluster-migration-barrier 1

# 13. Performance Monitoring Commands
# Add these to monitoring scripts:

# Monitor memory usage:
# redis-cli info memory

# Monitor CPU usage:
# redis-cli info cpu

# Monitor connections:
# redis-cli info clients

# Monitor slow operations:
# redis-cli slowlog get 10

# Monitor latency:
# redis-cli --latency

# Memory analysis:
# redis-cli --bigkeys

# 14. Lua Script Optimization
# Cache frequently used Lua scripts
# script cache is automatically managed

# 15. Pub/Sub Performance
# Configure for high-throughput pub/sub if needed
# notify-keyspace-events "KEA"

# 16. Client Output Buffer Limits
# Prevent clients from consuming too much memory
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# 17. TCP Settings
# Enable TCP keepalive
tcp-keepalive 300

# 18. Active Rehashing
# Rehash main hash table incrementally
activerehashing yes

# 19. Huge Pages
# Disable huge pages for better performance
# This should be set at the system level:
# echo never > /sys/kernel/mm/transparent_hugepage/enabled

# 20. NUMA Support
# For NUMA systems, consider:
# numactl --interleave=all redis-server /path/to/redis.conf

# 21. Swap Settings
# Disable swap for Redis
# This should be configured at the system level:
# swapoff -a

# 22. File System Optimization
# Use ext4 or xfs with noatime option
# Mount filesystem with: noatime,nodiratime

# 23. CPU Affinity
# Pin Redis to specific CPU cores for better performance
# taskset -c 0-3 redis-server /path/to/redis.conf

# 24. Network Optimization
# Use larger network buffers for high throughput
# tcp-window-size 65536

# 25. Connection Pooling
# Configure connection pools in application:
# - Reuse connections
# - Set appropriate pool sizes
# - Implement connection health checks