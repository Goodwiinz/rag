# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
#
# Fixes "Review skipped — Draft detected": by default CodeRabbit skips draft
# PRs, so review never ran on them. We open PRs as drafts routinely, so enable
# draft review. (You can still force a one-off any time with `@coderabbitai
# review`.)
language: en-US

reviews:
  # Keep the existing, lighter-touch profile (matches the prior Repository-UI
  # setting). Switch to "assertive" for stricter, more numerous comments.
  profile: chill
  # Don't gate merges on CodeRabbit — it's advisory; GitHub Actions is the gate.
  request_changes_workflow: false
  auto_review:
    enabled: true
    # The fix: review draft PRs instead of skipping them.
    drafts: true
    base_branches:
      - develop
      - main

chat:
  auto_reply: true
