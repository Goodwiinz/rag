# Serena Docker Configuration
# This file contains Docker-specific settings for running Serena in containers

# Disable GUI log window (not supported in Docker containers)
gui_log_window: false

# Allow external dashboard access (required for Docker)
web_dashboard_listen_address: 0.0.0.0

# Don't auto-open browser in Docker (no display available)
web_dashboard_open_on_launch: false

# MCP Server settings
mcp_server:
  # Port for the MCP server (matches docker-compose port mapping)
  port: 9121
  # Transport mode: stdio (default) or streamable-http
  transport: streamable-http

# Dashboard settings
dashboard:
  # Port for the web dashboard (matches docker-compose port mapping)
  port: 24282
  # Enable the web dashboard
  enabled: true

# Project paths in Docker container
# Note: Projects are mounted at /workspaces/projects/ in the container
# The host path is mapped via docker-compose volumes
projects:
- /workspaces/projects/RAG_system
logging:
  level: INFO
  # Log to stdout for Docker log aggregation
  format: json

# Performance settings
performance:
  # Max concurrent language server requests
  max_concurrent_requests: 10
  # Cache settings
  cache_enabled: true
  cache_ttl_seconds: 300
excluded_tools: []
included_optional_tools: []
fixed_tools: []
log_level: 20
trace_lsp_communication: false
web_dashboard: true
jetbrains_plugin_server_address: 127.0.0.1
tool_timeout: 240
token_count_estimator: CHAR_COUNT
default_max_tool_answer_chars: 150000
ls_specific_settings: {}
language_backend: LSP
