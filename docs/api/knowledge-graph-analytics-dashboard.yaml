  - BearerAuth: []
  - ApiKeyAuth: []

# Example WebSocket message definitions
x-websocket-messages:
  RealtimeUpdate:
    type: object
    properties:
      type:
        type: string
        enum: [metric_update, alert_triggered, dashboard_change]
      timestamp:
        type: string
        format: date-time
      organization_id:
        type: string
        format: uuid
      data:
        type: object
        additionalProperties: true

  ConnectionStatus:
    type: object
    properties:
      type:
        type: string
        enum: [connected, disconnected, error]
      connection_id:
        type: string
      timestamp:
        type: string
        format: date-time
      message:
        type: string