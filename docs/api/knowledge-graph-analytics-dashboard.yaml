openapi: 3.0.3
info:
  title: Knowledge Graph Analytics Dashboard API
  description: |
    Comprehensive analytics API for the Knowledge Graph Analytics Dashboard.
    Provides real-time metrics, graph analytics, dashboard management, and reporting capabilities.
  version: 1.0.0
  contact:
    name: Analytics Team
    email: analytics@company.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.company.com/analytics/v1
    description: Production server
  - url: https://staging-api.company.com/analytics/v1
    description: Staging server
  - url: http://localhost:8000/api/v1/analytics
    description: Development server

tags:
  - name: Real-time Analytics
    description: Real-time metrics and WebSocket connections
  - name: Graph Analytics
    description: Graph algorithms and network analysis
  - name: Dashboard Management
    description: Dashboard configuration and widget management
  - name: Reports
    description: Report generation and scheduling
  - name: Alerts
    description: Alert management and notifications
  - name: Metrics Aggregation
    description: Time-series metrics and aggregations

paths:
  /realtime/metrics:
    get:
      tags:
        - Real-time Analytics
      summary: Get real-time dashboard metrics
      description: Retrieves current real-time metrics for an organization's dashboard
      operationId: getRealtimeMetrics
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Organization ID
        - name: refresh_interval
          in: query
          required: false
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 300
          description: Refresh interval in seconds
      responses:
        '200':
          description: Successful response with real-time metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeMetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /realtime/subscribe:
    post:
      tags:
        - Real-time Analytics
      summary: Subscribe to real-time updates
      description: Establish WebSocket connection for real-time dashboard updates
      operationId: subscribeToRealtimeUpdates
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: WebSocket connection established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketConnectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /graph/analytics/centrality:
    get:
      tags:
        - Graph Analytics
      summary: Calculate graph centrality metrics
      description: Computes centrality measures (degree, betweenness, closeness, PageRank) for entities
      operationId: getGraphCentrality
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: algorithm
          in: query
          required: true
          schema:
            type: string
            enum: [degree, betweenness, closeness, pagerank, eigenvector]
        - name: entity_types
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: time_range_start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: time_range_end
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Centrality metrics calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphCentralityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /graph/analytics/clustering:
    post:
      tags:
        - Graph Analytics
      summary: Perform graph clustering analysis
      description: Identifies communities and clusters within the knowledge graph
      operationId: performGraphClustering
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusteringRequest'
      responses:
        '200':
          description: Clustering analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusteringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /graph/analytics/paths:
    post:
      tags:
        - Graph Analytics
      summary: Find paths between entities
      description: Calculates shortest paths and connections between entities
      operationId: findGraphPaths
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathAnalysisRequest'
      responses:
        '200':
          description: Path analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/configurations:
    get:
      tags:
        - Dashboard Management
      summary: List dashboard configurations
      description: Retrieves all dashboard configurations for an organization
      operationId: listDashboardConfigurations
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: config_type
          in: query
          required: false
          schema:
            type: string
            enum: [user, role, organization]
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Dashboard configurations retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardConfigurationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Dashboard Management
      summary: Create dashboard configuration
      description: Creates a new dashboard configuration
      operationId: createDashboardConfiguration
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardConfigurationRequest'
      responses:
        '201':
          description: Dashboard configuration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/configurations/{config_id}:
    get:
      tags:
        - Dashboard Management
      summary: Get dashboard configuration
      description: Retrieves a specific dashboard configuration
      operationId: getDashboardConfiguration
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dashboard configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Dashboard Management
      summary: Update dashboard configuration
      description: Updates an existing dashboard configuration
      operationId: updateDashboardConfiguration
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardConfigurationRequest'
      responses:
        '200':
          description: Dashboard configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Dashboard Management
      summary: Delete dashboard configuration
      description: Deletes a dashboard configuration
      operationId: deleteDashboardConfiguration
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Dashboard configuration deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard/widgets:
    get:
      tags:
        - Dashboard Management
      summary: List available widgets
      description: Retrieves all available widget definitions
      operationId: listWidgets
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: widget_category
          in: query
          required: false
          schema:
            type: string
            enum: [entity, relationship, document, user, system, graph]
        - name: widget_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Widgets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports:
    get:
      tags:
        - Reports
      summary: List reports
      description: Retrieves all reports for an organization
      operationId: listReports
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: report_category
          in: query
          required: false
          schema:
            type: string
        - name: is_template
          in: query
          required: false
          schema:
            type: boolean
        - name: created_by
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Reports
      summary: Create report
      description: Creates a new custom analytics report
      operationId: createReport
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Report created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/{report_id}/execute:
    post:
      tags:
        - Reports
      summary: Execute report
      description: Executes a report and generates results
      operationId: executeReport
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteReportRequest'
      responses:
        '200':
          description: Report execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /reports/{report_id}/executions:
    get:
      tags:
        - Reports
      summary: List report executions
      description: Retrieves execution history for a report
      operationId: listReportExecutions
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [running, completed, failed, cancelled]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Report executions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /alerts:
    get:
      tags:
        - Alerts
      summary: List alerts
      description: Retrieves all alerts for an organization
      operationId: listAlerts
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, triggered, acknowledged, resolved, suppressed]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [info, warning, critical, emergency]
        - name: alert_type
          in: query
          required: false
          schema:
            type: string
            enum: [metric_threshold, data_quality, performance, capacity]
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Alerts
      summary: Create alert
      description: Creates a new analytics alert
      operationId: createAlert
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
      responses:
        '201':
          description: Alert created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts/{alert_id}/acknowledge:
    post:
      tags:
        - Alerts
      summary: Acknowledge alert
      description: Acknowledges an alert
      operationId: acknowledgeAlert
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeAlertRequest'
      responses:
        '200':
          description: Alert acknowledged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /metrics/aggregations:
    get:
      tags:
        - Metrics Aggregation
      summary: Get metrics aggregations
      description: Retrieves aggregated metrics for specified time periods
      operationId: getMetricsAggregations
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: metric_type
          in: query
          required: true
          schema:
            type: string
            enum: [entity, relationship, document, user_interaction, graph_metrics]
        - name: time_bucket
          in: query
          required: true
          schema:
            type: string
            enum: [hour, day, week, month]
        - name: start_time
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: aggregations
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [sum, avg, min, max, count, distinct_count]
            default: [sum, avg, count]
      responses:
        '200':
          description: Metrics aggregations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsAggregationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    RealtimeMetricsResponse:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        metrics:
          type: object
          properties:
            total_entities:
              type: integer
            new_entities_today:
              type: integer
            avg_entity_confidence:
              type: number
              format: float
            total_relationships:
              type: integer
            new_relationships_today:
              type: integer
            total_documents:
              type: integer
            documents_processed_today:
              type: integer
            avg_document_quality:
              type: number
              format: float
            processing_success_rate:
              type: number
              format: float
            active_users_today:
              type: integer
            total_searches_today:
              type: integer
            avg_search_response_time:
              type: number
              format: float
            system_health_score:
              type: number
              format: float
            total_storage_used:
              type: number
              format: float
        last_updated:
          type: string
          format: date-time

    WebSocketConnectionResponse:
      type: object
      properties:
        connection_id:
          type: string
        websocket_url:
          type: string
        auth_token:
          type: string
        expires_at:
          type: string
          format: date-time

    GraphCentralityResponse:
      type: object
      properties:
        algorithm:
          type: string
        computed_at:
          type: string
          format: date-time
        computation_time_ms:
          type: integer
        total_entities_analyzed:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              entity_id:
                type: string
                format: uuid
              entity_name:
                type: string
              entity_type:
                type: string
              centrality_score:
                type: number
                format: float
              rank:
                type: integer
        metadata:
          type: object
          properties:
            min_score:
              type: number
              format: float
            max_score:
              type: number
              format: float
            avg_score:
              type: number
              format: float
            distribution:
              type: object
              additionalProperties: true

    ClusteringRequest:
      type: object
      required:
        - algorithm
      properties:
        algorithm:
          type: string
          enum: [louvain, leiden, infomap, label_propagation]
        entity_types:
          type: array
          items:
            type: string
        relationship_types:
          type: array
          items:
            type: string
        min_cluster_size:
          type: integer
          default: 5
        max_clusters:
          type: integer
          default: 100
        resolution:
          type: number
          format: float
          default: 1.0
        time_range_start:
          type: string
          format: date-time
        time_range_end:
          type: string
          format: date-time

    ClusteringResponse:
      type: object
      properties:
        algorithm:
          type: string
        computed_at:
          type: string
          format: date-time
        computation_time_ms:
          type: integer
        total_communities:
          type: integer
        modularity_score:
          type: number
          format: float
        communities:
          type: array
          items:
            type: object
            properties:
              community_id:
                type: integer
              size:
                type: integer
              entities:
                type: array
                items:
                  type: object
                  properties:
                    entity_id:
                      type: string
                      format: uuid
                    entity_name:
                      type: string
                    entity_type:
                      type: string
              internal_density:
                type: number
                format: float
        summary_stats:
          type: object
          properties:
            avg_community_size:
              type: number
              format: float
            largest_community_size:
              type: integer
            smallest_community_size:
              type: integer
            isolated_entities:
              type: integer

    PathAnalysisRequest:
      type: object
      required:
        - source_entity_id
        - target_entity_id
      properties:
        source_entity_id:
          type: string
          format: uuid
        target_entity_id:
          type: string
          format: uuid
        algorithm:
          type: string
          enum: [dijkstra, bfs, astar, floyd_warshall]
          default: dijkstra
        max_path_length:
          type: integer
          default: 10
        max_paths:
          type: integer
          default: 5
        include_path_weights:
          type: boolean
          default: true
        entity_types_filter:
          type: array
          items:
            type: string
        relationship_types_filter:
          type: array
          items:
            type: string

    PathAnalysisResponse:
      type: object
      properties:
        computed_at:
          type: string
          format: date-time
        computation_time_ms:
          type: integer
        source_entity:
          type: object
          properties:
            entity_id:
              type: string
              format: uuid
            entity_name:
              type: string
            entity_type:
              type: string
        target_entity:
          type: object
          properties:
            entity_id:
              type: string
              format: uuid
            entity_name:
              type: string
            entity_type:
              type: string
        paths:
          type: array
          items:
            type: object
            properties:
              path_id:
                type: string
              length:
                type: integer
              weight:
                type: number
                format: float
              entities:
                type: array
                items:
                  type: object
                  properties:
                    entity_id:
                      type: string
                      format: uuid
                    entity_name:
                      type: string
                    entity_type:
                      type: string
              relationships:
                type: array
                items:
                  type: object
                  properties:
                    relationship_type:
                      type: string
                    source_id:
                      type: string
                      format: uuid
                    target_id:
                      type: string
                      format: uuid
                    weight:
                      type: number
                      format: float
        shortest_path:
          $ref: '#/components/schemas/PathAnalysisResponse/properties/paths/items'

    DashboardConfigurationsResponse:
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/DashboardConfiguration'
        total_count:
          type: integer
        page_info:
          type: object
          properties:
            has_next_page:
              type: boolean
            has_previous_page:
              type: boolean
            start_cursor:
              type: string
            end_cursor:
              type: string

    DashboardConfiguration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        config_name:
          type: string
        config_type:
          type: string
          enum: [user, role, organization]
