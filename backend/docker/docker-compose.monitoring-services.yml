# Monitoring Services Docker Compose Configuration
# Comprehensive monitoring and observability stack for RAG System

version: '3.8'

services:
  # Main Monitoring Service
  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-monitoring-service
    ports:
      - "8001:8000"
    environment:
      - MONITORING_SERVICE_NAME=rag-monitoring
      - MONITORING_ENVIRONMENT=production
      - MONITORING_DEBUG=false
      - DATABASE_URL=postgresql://raguser:${DB_PASSWORD}@postgres:5432/ragdb
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_URL=http://qdrant:6333
      - SENTRY_DSN=${SENTRY_DSN}
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=8000
      - JAEGER_ENABLED=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./monitoring/config:/app/config
    networks:
      - rag-network
    depends_on:
      - postgres
      - redis
      - neo4j
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Metrics Collection Service
  metrics-collector:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-metrics-collector
    command: ["python", "-m", "src.monitoring.services.metrics_collector"]
    environment:
      - MONITORING_SERVICE_NAME=rag-metrics-collector
      - MONITORING_ENVIRONMENT=production
      - DATABASE_URL=postgresql://raguser:${DB_PASSWORD}@postgres:5432/ragdb
      - REDIS_URL=redis://redis:6379
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=9090
      - METRICS_COLLECTION_INTERVAL=30
    volumes:
      - ./logs:/app/logs
    networks:
      - rag-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tracing Collector Service
  tracing-collector:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-tracing-collector
    command: ["python", "-m", "src.monitoring.services.tracing_collector"]
    environment:
      - MONITORING_SERVICE_NAME=rag-tracing-collector
      - MONITORING_ENVIRONMENT=production
      - JAEGER_ENABLED=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTLP_ENABLED=true
      - OTLP_ENDPOINT=http://tempo:4317
      - TRACING_SAMPLING_RATIO=0.1
      - AUTO_INSTRUMENTATION=true
    volumes:
      - ./logs:/app/logs
    networks:
      - rag-network
    depends_on:
      - jaeger
      - tempo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Log Aggregation Service
  log-aggregator:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-log-aggregator
    command: ["python", "-m", "src.monitoring.services.log_aggregator"]
    environment:
      - MONITORING_SERVICE_NAME=rag-log-aggregator
      - MONITORING_ENVIRONMENT=production
      - DATABASE_URL=postgresql://raguser:${DB_PASSWORD}@postgres:5432/ragdb
      - ELASTICSEARCH_ENABLED=true
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - LOG_LEVEL=INFO
      - STRUCTURED_LOGGING=true
    volumes:
      - ./logs:/app/logs
      - /var/log/containers:/var/log/containers:ro
    networks:
      - rag-network
    depends_on:
      - postgres
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alert Handler Service
  alert-handler:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-alert-handler
    command: ["python", "-m", "src.monitoring.services.alert_handler"]
    environment:
      - MONITORING_SERVICE_NAME=rag-alert-handler
      - MONITORING_ENVIRONMENT=production
      - DATABASE_URL=postgresql://raguser:${DB_PASSWORD}@postgres:5432/ragdb
      - ALERTING_ENABLED=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - ALERT_COOLDOWN_MINUTES=5
    volumes:
      - ./logs:/app/logs
    networks:
      - rag-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Health Check Hub Service
  health-check-hub:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-health-check-hub
    command: ["python", "-m", "src.monitoring.services.health_check_hub"]
    environment:
      - MONITORING_SERVICE_NAME=rag-health-check-hub
      - MONITORING_ENVIRONMENT=production
      - DATABASE_URL=postgresql://raguser:${DB_PASSWORD}@postgres:5432/ragdb
      - HEALTH_CHECK_ENABLED=true
      - HEALTH_CHECK_INTERVAL=30
      - CHECK_DATABASE=true
      - CHECK_REDIS=true
      - CHECK_NEO4J=true
      - CHECK_QDRANT=true
    volumes:
      - ./logs:/app/logs
    networks:
      - rag-network
    depends_on:
      - postgres
      - redis
      - neo4j
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring API Gateway (Nginx)
  monitoring-gateway:
    image: nginx:1.24-alpine
    container_name: rag-monitoring-gateway
    ports:
      - "8090:80"
      - "8443:443"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./monitoring/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - rag-network
    depends_on:
      - monitoring-service
      - metrics-collector
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Task Queue (Celery Worker)
  monitoring-worker:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-monitoring-worker
    command: ["celery", "-A", "src.monitoring.tasks.celery_app", "worker", "--loglevel=info"]
    environment:
      - MONITORING_SERVICE_NAME=rag-monitoring-worker
      - MONITORING_ENVIRONMENT=production
      - DATABASE_URL=postgresql://raguser:${DB_PASSWORD}@postgres:5432/ragdb
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    networks:
      - rag-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Beat (Celery Scheduler)
  monitoring-beat:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-monitoring-beat
    command: ["celery", "-A", "src.monitoring.tasks.celery_app", "beat", "--loglevel=info"]
    environment:
      - MONITORING_SERVICE_NAME=rag-monitoring-beat
      - MONITORING_ENVIRONMENT=production
      - DATABASE_URL=postgresql://raguser:${DB_PASSWORD}@postgres:5432/ragdb
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./monitoring/celerybeat-schedule:/app/celerybeat-schedule
    networks:
      - rag-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Flower (Celery Monitor)
  monitoring-flower:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: rag-monitoring-flower
    command: ["celery", "-A", "src.monitoring.tasks.celery_app", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    environment:
      - MONITORING_SERVICE_NAME=rag-monitoring-flower
      - MONITORING_ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER}:${FLOWER_PASSWORD}
    volumes:
      - ./logs:/app/logs
    networks:
      - rag-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  rag-network:
    external: true

volumes:
  celerybeat-schedule:
    driver: local