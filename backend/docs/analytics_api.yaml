## Overview
The RAG Analytics API provides comprehensive analytics and monitoring capabilities for the RAG system, including:

- **Quality Metrics**: Document quality assessments and recommendations
- **User Behavior Analytics**: User interaction patterns and engagement metrics
- **Performance Monitoring**: System performance tracking and health indicators
- **Custom Recommendations**: AI-powered recommendations for system optimization

## Authentication
All API endpoints require authentication using Bearer tokens. Include the token in the Authorization header:

```
Authorization: Bearer <your-jwt-token>
```

## Rate Limiting
API requests are rate-limited based on user role:
- **Admin**: 1000 requests per hour
- **Premium**: 500 requests per hour
- **Standard**: 100 requests per hour

## Pagination
List endpoints support pagination using these query parameters:
- `page`: Page number (default: 1)
- `size`: Items per page (default: 20, max: 100)
- `sort`: Sort field (default: created_at)
- `order`: Sort order (asc/desc, default: desc)

## Error Handling
The API uses standard HTTP status codes with detailed error responses:

```json
{
  "error": {
    "code": "ANALYTICS_ACCESS_DENIED",
    "message": "Insufficient permissions for analytics access",
    "details": "User role 'standard' requires 'analytics:read' permission"
  }
}
```
