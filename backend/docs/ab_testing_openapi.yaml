        performance_comparison:
          type: object
        statistical_significance:
          type: object
        recommendations:
          type: array
          items:
            type: string
        confidence_level:
          type: number
        data_quality:
          type: object

    # User Segment Schemas
    UserSegmentCreateRequest:
      type: object
      required:
