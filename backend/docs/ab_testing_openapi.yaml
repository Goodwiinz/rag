          type: string
        variant_name:
          type: string
        participant_count:
          type: integer
        percentage:
          type: number
        is_control:
          type: boolean

    # Assignment Schemas
    QueryRoutingResponse:
      type: object
      properties:
        experiment_id:
          type: string
          format: uuid
          nullable: true
        variant_id:
          type: string
          format: uuid
          nullable: true
        assignment_type:
          type: string
          enum: ["consistent_hash", "random", "weighted_random", "bandit", "none", "error_fallback"]
        routing_reason:
          type: string
          example: "user_meets_criteria"
        variant_config:
          type: object
          nullable: true

    # Metrics Schemas
    MetricSubmissionRequest:
      type: object
      required:
        - experiment_id
        - variant_id
        - metric_type
        - metric_value
      properties:
        experiment_id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        metric_type:
          $ref: '#/components/schemas/MetricType'
        metric_value:
          type: number
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
        query_id:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    BulkMetricSubmissionRequest:
      type: object
      required:
        - metrics
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricSubmissionRequest'
          maxItems: 10000

    # Analysis Schemas
    StatisticalAnalysisRequest:
      type: object
      properties:
        confidence_level:
          type: number
          minimum: 0.8
          maximum: 0.99
          default: 0.95
        include_secondary_metrics:
          type: boolean
          default: true
        metrics_to_analyze:
          type: array
          items:
            $ref: '#/components/schemas/MetricType'
        comparison_groups:
          type: array
          items:
            type: object
            properties:
              control:
                type: string
              treatment:
                type: string
        time_range:
          type: object
          properties:
            start_date:
              type: string
              format: date-time
            end_date:
              type: string
              format: date-time

    StatisticalAnalysisResponse:
      type: object
      properties:
        experiment_id:
          type: string
          format: uuid
        analysis_id:
          type: string
        confidence_level:
          type: number
        analysis_date:
          type: string
          format: date-time
        total_participants:
          type: integer
        comparisons:
          type: array
          items:
            type: object
            properties:
              control_variant:
                type: string
              treatment_variant:
                type: string
              metric_name:
                type: string
              control_mean:
                type: number
              treatment_mean:
                type: number
              absolute_difference:
                type: number
              relative_difference:
                type: number
              statistical_result:
                type: object
                properties:
                  test_name:
                    type: string
                  statistic:
                    type: number
                  p_value:
                    type: number
                  is_significant:
                    type: boolean
                  confidence_interval:
                    type: object
                    properties:
                      lower:
                        type: number
                      upper:
                        type: number
                  effect_size:
                    type: number
                  power:
                    type: number
                  interpretation:
                    type: string
              recommendation:
                type: string
        overall_recommendation:
          type: string
        business_impact:
          type: object
        data_quality_metrics:
          type: object

    ExperimentSummaryResponse:
      type: object
      properties:
