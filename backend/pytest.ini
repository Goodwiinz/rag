[pytest]
# =============================================================================
# Pytest Configuration for Feature-Driven Development
# =============================================================================

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude directories from test collection
# - templates/: Scaffolding templates with placeholder names, not actual tests
# - standalone/: Manual test scripts requiring external services/credentials
# - scaffolding/: Tests written ahead of implementations, need fixes
norecursedirs =
    templates
    standalone
    performance
    scaffolding
    integration
    __pycache__
    .git
    .tox
    *.egg

# Async mode
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests - fast, isolated, no external dependencies
    integration: Integration tests - may use external services (mocked or real)
    e2e: End-to-end tests - full system tests
    slow: Slow tests - skipped unless --run-slow is provided
    resilience: Tests for resilience patterns (retry, circuit breaker, bulkhead)
    scalability: Tests for scalability patterns (caching, pooling)
    feature: Feature-specific tests
    regression: Regression tests for previously fixed bugs
    smoke: Quick smoke tests for basic validation
    chat: Chat API and messaging tests
    database: Database connection and operation tests
    t2_001: T2-001 Vector Database Setup
    t2_002: T2-002 Knowledge Graph Construction
    t2_003: T2-003 Full-Text Search Implementation
    t2_004: T2-004 Hybrid Search Engine
    t2_005: T2-005 Search API Implementation
    t2_006: T2-006 Multi-Agent Search Orchestration
    t2_007: T2-007 Search Quality Evaluation

# Default options
addopts = 
    -v
    --strict-markers
    --tb=short
    -ra
    --color=yes

# Coverage settings (when running with --cov)
# Use: pytest --cov=src --cov-report=html --cov-report=term-missing

# Timeout for individual tests (requires pytest-timeout)
timeout = 300

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sqlalchemy

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Console output
console_output_style = progress

# Parallel execution (requires pytest-xdist)
# Use: pytest -n auto
