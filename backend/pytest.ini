[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may use containers)
    e2e: End-to-end tests
    performance: Performance tests
    ai: AI-specific tests (mocked or real)
    openai: Tests requiring OpenAI API
    anthropic: Tests requiring Anthropic API
    azure: Tests requiring Azure OpenAI API
    slow: Tests that take longer to run
    auth: Authentication tests
    search: Search functionality tests
    documents: Document processing tests

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Logging
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout
timeout = 300

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*utcnow.*:DeprecationWarning
