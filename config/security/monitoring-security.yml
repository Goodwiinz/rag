# Secure Monitoring Configuration Template
# Production-ready security settings for monitoring infrastructure

version: '3.8'

services:
  # Secure Prometheus Configuration
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.external-url=https://prometheus.company.com'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--storage.remote.write-buffer-shards=200'
    ports:
      - "127.0.0.1:9090:9090"  # Bind to localhost only
    volumes:
      - ./prometheus-security.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-web-config.yml:/etc/prometheus/web.yml:ro
      - ./security-rules:/etc/prometheus/rules:ro
      - prometheus_secure_data:/prometheus
    environment:
      - PROMETHEUS_RETENTION=30d
    networks:
      - monitoring-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "65534:65534"  # Run as non-root user
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Secure Grafana Configuration
  grafana:
    image: grafana/grafana-oss:11.1.0
    ports:
      - "127.0.0.1:3001:3000"  # Bind to localhost only
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_OAUTH_AUTO_LOGIN=false
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_CONTENT_TYPE_PROTECTION=true
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=nosniff
      - GF_SECURITY_X_XSS_PROTECTION=true
      - GF_LOG_LEVEL=warn
      - GF_EXPLORE_ENABLED=true
      - GF_METRICS_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_PROTOCOL=http
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_SSL_MODE=require
      - GF_SESSION_PROVIDER=redis
      - GF_SESSION_PROVIDER_CONFIG=addr=redis:6379,pool_size=100,password=${REDIS_PASSWORD}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SECURITY_VIEWERS_CAN_EDIT=false
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    volumes:
      - grafana_secure_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-internal
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "472:472"  # Run as non-root user
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Secure Redis with Authentication
  redis:
    image: redis:7.2.5-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tls-port 6380
      --port 0
      --tls-cert-file /etc/redis/tls/redis.crt
      --tls-key-file /etc/redis/tls/redis.key
      --tls-ca-cert-file /etc/redis/tls/ca.crt
      --tls-auth-clients yes
      --tls-replication yes
    ports:
      - "127.0.0.1:6379:6379"  # Only bind to localhost
    volumes:
      - redis_secure_data:/data
      - ./redis/tls:/etc/redis/tls:ro
    networks:
      - monitoring-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "999:999"  # Run as non-root user
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Secure AlertManager
  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"  # Bind to localhost only
    volumes:
      - ./alertmanager-security.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager-tls:/etc/alertmanager/tls:ro
      - alertmanager_secure_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alertmanager.company.com'
      - '--web.listen-address=0.0.0.0:9093'
      - '--web.tls.config=/etc/alertmanager/tls/tls-config.yml'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--cluster.peer=alertmanager:9094'
    networks:
      - monitoring-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "65534:65534"  # Run as non-root user
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Loki with Authentication
  loki:
    image: grafana/loki:2.9.10
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki-security-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_secure_data:/loki
    environment:
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
    networks:
      - monitoring-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "10001:10001"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Promtail with Authentication
  promtail:
    image: grafana/promtail:2.9.10
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-security-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../logs:/logs:ro
    networks:
      - monitoring-internal
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "10001:10001"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Node Exporter with Security
  node-exporter:
    image: prom/node-exporter:v1.8.1
    command:
      - '--path.rootfs=/host'
      - '--collector.cpu'
      - '--collector.diskstats'
      - '--collector.filesystem'
      - '--collector.meminfo'
      - '--collector.netdev'
      - '--collector.time'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--no-collector.ipvs'
      - '--no-collector.netdev.arp'
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "65534:65534"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'

  # cAdvisor with Security Hardening
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    command:
      - '--port=8080'
      - '--housekeeping_interval=30s'
      - '--max_housekeeping_interval=300s'
      - '--docker_only=true'
      - '--storage_duration=2m0s'
      - '--disable_metrics=advtcp,udp,reference,cpu_topology,sched,tcp,udp'
      - '--enable_metrics=cpu,cpuLoad,disk,diskIO,memory,network,process'
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "65534:65534"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# Secure Network Configuration
networks:
  monitoring-internal:
    driver: bridge
    internal: true  # Isolated from external network
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

# Secure Volume Configuration
volumes:
  prometheus_secure_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/monitoring/prometheus
  grafana_secure_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/monitoring/grafana
  redis_secure_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/monitoring/redis
  alertmanager_secure_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/monitoring/alertmanager
  loki_secure_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/monitoring/loki