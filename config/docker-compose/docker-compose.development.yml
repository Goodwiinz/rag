version: "3.8"

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.simple
    ports:
      - "8000:8000"
      - "8002:8002"
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password

      # Vector Database Configuration (supports both local and cloud)
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

      # Application Configuration
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # WARNING: Set JWT_SECRET_KEY in .env for production! Default is for development only.
      # Generate with: openssl rand -base64 32
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-persistent-secret-key-32chars!}
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=100MB
      - ENABLE_VIRUS_SCANNING=false
      - ENABLE_AI_PROCESSING=true

      # AI Service Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # DeepEval / Confident AI Configuration
      - CONFIDENT_API_KEY=${CONFIDENT_API_KEY:-}

      # Azure OpenAI Configuration
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_CHAT_DEPLOYMENT_NAME=${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME:-}

      # Azure OpenAI Multi-Endpoint Configuration
      - AZURE_OPENAI_CHAT_ENDPOINT=${AZURE_OPENAI_CHAT_ENDPOINT:-}
      - AZURE_OPENAI_EMBEDDING_ENDPOINT=${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}
      - AZURE_OPENAI_CHAT_API_VERSION=${AZURE_OPENAI_CHAT_API_VERSION:-2024-06-01}
      - AZURE_OPENAI_EMBEDDING_API_VERSION=${AZURE_OPENAI_EMBEDDING_API_VERSION:-2023-05-15}

      # Separate API Keys Support
      - AZURE_OPENAI_CHAT_API_KEY=${AZURE_OPENAI_CHAT_API_KEY:-}
      - AZURE_OPENAI_EMBEDDING_API_KEY=${AZURE_OPENAI_EMBEDDING_API_KEY:-}

      # Cohere Reranking Configuration
      - COHERE_RERANK_ENDPOINT=${COHERE_RERANK_ENDPOINT:-}
      - COHERE_RERANK_API_KEY=${COHERE_RERANK_API_KEY:-}
      - COHERE_RERANK_MODEL=${COHERE_RERANK_MODEL:-}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

      # Performance Configuration
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-5}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - ENABLE_CACHING=${ENABLE_CACHING:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      # Backend URL for Next.js server-side rewrites (uses Docker service name)
      - BACKEND_URL=http://backend:8000
      # Public API URL for client-side requests (uses localhost for browser access)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_ENVIRONMENT=development
      - REACT_APP_ENABLE_DEBUG=true
      - CHOKIDAR_USEPOLLING=true
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g

  # PostgreSQL Database — COMMENTED OUT: Supabase CLI now manages PostgreSQL.
  # To revert, uncomment this block and update DATABASE_URL back to postgres:5432.
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     - POSTGRES_DB=multimodal_rag_dev
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
  #   volumes:
  #     - postgres_dev_data:/var/lib/postgresql/data
  #     # Disabled - using alembic migrations instead
  #     # - ../../database/init.sql:/docker-entrypoint-initdb.d/init.sql
  #     # - ../../database/dev-seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - multimodal-rag-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --timeout 300 --tcp-keepalive 60
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Neo4j Knowledge Graph
  neo4j:
    image: neo4j:latest
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_default__database=neo4j
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_dbms_logs_debug_level=INFO
    volumes:
      - a4d0855b278438a535a13759f3f1b65be6373d04ec7ff6e2e4c6ba4ef61745ed:/data
      - 04f8f69dbb0f8558b9e34bf135c287fb8da7004918669eb028533bd242b24277:/logs
      - neo4j_dev_import:/var/lib/neo4j/import
      - neo4j_dev_plugins:/plugins
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_dev_data:/qdrant/storage
    ports:
      - "6333:6333" # HTTP
      - "6334:6334" # gRPC
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    # healthcheck:
  #   test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
  #   interval: 10s
  #   timeout: 5s
  #   retries: 3
  #   start_period: 40s
  # Note: Health check disabled due to minimal container tools

  # Celery Worker
  celery-worker:
    container_name: rag-celery-worker-dev
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.simple
    command: celery -A src.tasks.celery_app worker --loglevel=debug --concurrency=${WORKER_CONCURRENCY:-4} --hostname=worker@rag-celery-worker-dev --queues=celery,document_processing,text_processing,vector_processing,entity_processing,graph_processing
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password

      # Vector Database Configuration (supports both local and cloud)
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

      # Application Configuration
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-persistent-secret-key-32chars!}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - UPLOAD_DIR=/app/uploads

      # AI Service Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # DeepEval / Confident AI Configuration
      - CONFIDENT_API_KEY=${CONFIDENT_API_KEY:-}

      # Azure OpenAI Configuration
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_CHAT_DEPLOYMENT_NAME=${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME:-}

      # Azure OpenAI Multi-Endpoint Configuration
      - AZURE_OPENAI_CHAT_ENDPOINT=${AZURE_OPENAI_CHAT_ENDPOINT:-}
      - AZURE_OPENAI_EMBEDDING_ENDPOINT=${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}
      - AZURE_OPENAI_CHAT_API_VERSION=${AZURE_OPENAI_CHAT_API_VERSION:-2024-06-01}
      - AZURE_OPENAI_EMBEDDING_API_VERSION=${AZURE_OPENAI_EMBEDDING_API_VERSION:-2023-05-15}

      # Separate API Keys Support
      - AZURE_OPENAI_CHAT_API_KEY=${AZURE_OPENAI_CHAT_API_KEY:-}
      - AZURE_OPENAI_EMBEDDING_API_KEY=${AZURE_OPENAI_EMBEDDING_API_KEY:-}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

      # Performance Configuration
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-5}
      - ENABLE_CACHING=${ENABLE_CACHING:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.simple
    command: celery -A src.tasks.celery_app beat --loglevel=debug
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-persistent-secret-key-32chars!}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app
      - celerybeat_dev_data:/app/celerybeat
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  # Flower for Celery Monitoring
  flower:
    container_name: rag-flower-dev
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.simple
    command: python -m celery --broker=redis://redis:6379/0 -A src.tasks.celery_app flower --port=5555 --max_tasks=10000 --purge_offline_workers=60
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-persistent-secret-key-32chars!}
      - ENVIRONMENT=development
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_UNAUTHENTICATED_API=true
    volumes:
      - flower_data:/data
    depends_on:
      - redis
      - celery-worker
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioREDACTED
    volumes:
      - minio_dev_data:/data
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Serena MCP Server (Semantic Code Analysis)
  serena:
    image: ghcr.io/oraios/serena:latest
    container_name: rag-serena-dev
    ports:
      - "9121:9121"      # MCP server port
      - "24282:24282"    # Web dashboard port
    environment:
      - SERENA_DOCKER=1
      - SERENA_PORT=9121
      - SERENA_DASHBOARD_PORT=24282
    volumes:
      # Mount the entire project for code analysis
      - ../../:/workspaces/projects/RAG_system
      # Persist Serena configuration and memories
      - ../../.serena:/workspaces/serena/config
    command: >
      serena start-mcp-server
      --transport streamable-http
      --host 0.0.0.0
      --port 9121
      --project /workspaces/projects/RAG_system
      --enable-web-dashboard true
      --open-web-dashboard false
      --enable-gui-log-window false
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    # Note: Serena doesn't require other services to start

  # Development Tools
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=host.docker.internal
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - multimodal-rag-network
    restart: unless-stopped

volumes:
  # postgres_dev_data:  # Commented out — Supabase manages PostgreSQL now
  redis_dev_data:
  serena_dev_data:
  a4d0855b278438a535a13759f3f1b65be6373d04ec7ff6e2e4c6ba4ef61745ed:
    external: true
  04f8f69dbb0f8558b9e34bf135c287fb8da7004918669eb028533bd242b24277:
    external: true
  neo4j_dev_import:
  neo4j_dev_plugins:
  qdrant_dev_data:
  celerybeat_dev_data:
  minio_dev_data:
  flower_data:

networks:
  multimodal-rag-network:
    driver: bridge
