# CI stand-in for Supabase's Kong gateway, auth routes only.
#
# supabase-js always calls {SUPABASE_URL}/auth/v1/<route>; in the hosted stack
# Kong strips the /auth/v1 prefix before forwarding to GoTrue, which serves at
# its root (/token, /signup, ...). Bare GoTrue has no such prefix, so browser
# logins died with "Failed to fetch" (trace: POST /auth/v1/token -> status -1).
# This nginx does the two things Kong did: answer CORS preflight for the
# cross-origin browser fetch (localhost:3000 -> this) and strip the prefix.

server {
    listen 80;

    # Browser-facing CORS. supabase-js sends apikey/authorization headers but
    # no cookies, so a wildcard-by-echo origin with no credentials is enough.
    set $cors_headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version";

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 3600 always;
            return 204;
        }

        # Trailing slash on proxy_pass strips the matched /auth/v1/ prefix.
        proxy_pass http://gotrue:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # GoTrue sets its own (sometimes absent) CORS headers; replace them so
        # the browser always sees exactly one consistent set.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers $cors_headers always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    }

    # Host-side bootstrap probe.
    location /health {
        return 200 "ok";
    }
}
