version: '3.8'

services:
  # WebSocket Load Balancer (Nginx)
  websocket-lb:
    image: nginx:alpine
    ports:
      - "8080:80"  # WebSocket endpoint
      - "8443:443" # Secure WebSocket endpoint
    volumes:
      - ./nginx/websocket.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - websocket-node-1
      - websocket-node-2
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket Service Nodes
  websocket-node-1:
    build:
      context: ./backend
      dockerfile: Dockerfile.websocket
    environment:
      # WebSocket Configuration
      - WS_NODE_ID=ws-node-1
      - WS_MAX_CONNECTIONS=5000
      - WS_HEARTBEAT_INTERVAL=30
      - WS_CONNECTION_TTL=3600
      - WS_RATE_LIMIT_PER_MINUTE=60
      - WS_MAX_CONCURRENT_SESSIONS=10

      # Redis Configuration
      - REDIS_URL=redis://redis-cluster:6379/0
      - REDIS_POOL_SIZE=50
      - REDIS_HEALTH_CHECK_INTERVAL=30

      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/multimodal_rag_dev
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - QDRANT_URL=http://qdrant:6333

      # Application Configuration
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DEBUG=true

      # Authentication Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24
      - JWT_REFRESH_THRESHOLD=300

      # Performance Configuration
      - WORKER_CONCURRENCY=8
      - MAX_CONCURRENT_JOBS=10
      - ENABLE_CACHING=true
      - CACHE_TTL_SECONDS=3600
      - ENABLE_METRICS=true

      # AI Service Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  websocket-node-2:
    build:
      context: ./backend
      dockerfile: Dockerfile.websocket
    environment:
      # WebSocket Configuration
      - WS_NODE_ID=ws-node-2
      - WS_MAX_CONNECTIONS=5000
      - WS_HEARTBEAT_INTERVAL=30
      - WS_CONNECTION_TTL=3600
      - WS_RATE_LIMIT_PER_MINUTE=60
      - WS_MAX_CONCURRENT_SESSIONS=10

      # Redis Configuration
      - REDIS_URL=redis://redis-cluster:6379/0
      - REDIS_POOL_SIZE=50
      - REDIS_HEALTH_CHECK_INTERVAL=30

      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/multimodal_rag_dev
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - QDRANT_URL=http://qdrant:6333

      # Application Configuration
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DEBUG=true

      # Authentication Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24
      - JWT_REFRESH_THRESHOLD=300

      # Performance Configuration
      - WORKER_CONCURRENCY=8
      - MAX_CONCURRENT_JOBS=10
      - ENABLE_CACHING=true
      - CACHE_TTL_SECONDS=3600
      - ENABLE_METRICS=true

      # AI Service Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # High-Performance Redis Cluster for WebSocket
  redis-cluster:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --timeout 300
      --tcp-keepalive 60
      --tcp-backlog 511
      --save 900 1
      --save 300 10
      --save 60 10000
      --rdbcompression yes
      --rdbchecksum yes
      --notify-keyspace-events "Ex"
      --slowlog-log-slower-than 10000
      --slowlog-max-len 128
    volumes:
      - redis_cluster_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Document Processing Workers (scaled)
  doc-worker-1:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    command: >
      python -m src.websocket.document_processor
      --worker-id=doc-worker-1
      --max-concurrent-jobs=5
      --queue-name=document_processing
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/multimodal_rag_dev
      - REDIS_URL=redis://redis-cluster:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  doc-worker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    command: >
      python -m src.websocket.document_processor
      --worker-id=doc-worker-2
      --max-concurrent-jobs=5
      --queue-name=document_processing
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/multimodal_rag_dev
      - REDIS_URL=redis://redis-cluster:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # WebSocket Monitoring and Metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=REDACTED
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  # Log Aggregation
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - multimodal-rag-network
    restart: unless-stopped

  # WebSocket Health Monitor
  ws-health-monitor:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    command: python -m src.websocket.health_monitor
    environment:
      - REDIS_URL=redis://redis-cluster:6379/0
      - WS_NODES=ws-node-1:8001,ws-node-2:8001
      - HEALTH_CHECK_INTERVAL=30
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    depends_on:
      - redis-cluster
      - websocket-node-1
      - websocket-node-2
    networks:
      - multimodal-rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  redis_cluster_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  multimodal-rag-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16