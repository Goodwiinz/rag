# CI/CD Docker Compose Configuration
# Minimal setup for running E2E tests in GitHub Actions
# Usage: docker-compose -f docker-compose.ci.yml up -d

version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    networks:
      - ci-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    ports:
      - "6379:6379"
    networks:
      - ci-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
      args:
        PYTHON_VERSION: "3.11"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://test:test@postgres:5432/test_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: testing
      SECRET_KEY: ci-test-secret-key-32-characters!
      JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars!
      DEBUG: "false"
      LOG_LEVEL: WARNING
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      ENABLE_AI_PROCESSING: "false"
      # Disable features that require external services
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ci-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ci-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # E2E Test Runner (Playwright)
  e2e-tests:
    image: mcr.microsoft.com/playwright:v1.47.2-jammy
    working_dir: /app/tests/e2e
    volumes:
      - ./tests/e2e:/app/tests/e2e
      - e2e-results:/app/tests/e2e/test-results
    environment:
      CI: "true"
      BASE_URL: http://frontend:3000
      API_URL: http://backend:8000
      HEADLESS: "true"
      # Shard configuration for parallel runs
      CI_SHARD_INDEX: ${CI_SHARD_INDEX:-1}
      CI_SHARD_TOTAL: ${CI_SHARD_TOTAL:-1}
    command: >
      sh -c "
        npm ci &&
        npx playwright test --reporter=html,github
      "
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ci-network
    profiles:
      - e2e

  # Smoke Test Runner (subset of E2E for PRs)
  smoke-tests:
    image: mcr.microsoft.com/playwright:v1.47.2-jammy
    working_dir: /app/tests/e2e
    volumes:
      - ./tests/e2e:/app/tests/e2e
      - smoke-results:/app/tests/e2e/test-results
    environment:
      CI: "true"
      BASE_URL: http://frontend:3000
      API_URL: http://backend:8000
      HEADLESS: "true"
    command: >
      sh -c "
        npm ci &&
        npx playwright test --grep @smoke --reporter=html,github --project=chromium
      "
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ci-network
    profiles:
      - smoke

networks:
  ci-network:
    driver: bridge

volumes:
  e2e-results:
  smoke-results:
