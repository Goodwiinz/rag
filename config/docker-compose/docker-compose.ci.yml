# CI/CD Docker Compose Configuration
# Minimal setup for running E2E tests in GitHub Actions
# Usage: docker-compose -f docker-compose.ci.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    networks:
      - ci-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # Pre-create the `auth` schema so GoTrue migrations (which CREATE TABLE
      # auth.* without CREATE SCHEMA) succeed. initdb runs these on every fresh
      # CI start because the data dir is tmpfs. Path is relative to the repo root
      # (where `docker compose -f docker-compose.ci.yml` is invoked).
      - ./database/ci-init:/docker-entrypoint-initdb.d:ro

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    ports:
      - "6379:6379"
    networks:
      - ci-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Neo4j Graph Database (knowledge graph tests)
  # Auth disabled for CI to skip the password-rotation handshake.
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: none
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - ci-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    tmpfs:
      - /data
      - /logs

  # Qdrant Vector Database (embedding/vector-search tests)
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - ci-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    tmpfs:
      - /qdrant/storage

  # Supabase GoTrue (Auth)
  # Stands in for the local supabase-cli stack devs run via `supabase start`.
  # The frontend's signInWithPassword call hits this; the JWTs it issues are
  # validated by the backend with the same shared HS256 secret.
  gotrue:
    image: supabase/gotrue:v2.151.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://gotrue:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://test:test@postgres:5432/test_db?sslmode=disable
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000,http://frontend:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ci-test-supabase-jwt-secret-not-for-prod-use
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_LOG_LEVEL: info
    ports:
      - "9999:9999"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ci-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.prod
      args:
        PYTHON_VERSION: "3.11"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://test:test@postgres:5432/test_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: testing
      SECRET_KEY: ci-test-secret-key-32-characters!
      JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars!
      # Shared HS256 secret with gotrue — backend's verify_token decodes
      # Supabase-issued JWTs with this and binds them to local users via sub.
      SUPABASE_URL: http://gotrue:9999
      SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret-not-for-prod-use
      DEBUG: "false"
      LOG_LEVEL: WARNING
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      ENABLE_AI_PROCESSING: "false"
      # Disable features that require external services
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotrue:
        condition: service_healthy
    networks:
      - ci-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        # Browser inside the Playwright container reaches gotrue via docker DNS.
        # The anon JWT is signed with SUPABASE_JWT_SECRET — gotrue accepts it
        # as the apikey on /auth/v1/* endpoints.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://gotrue:9999}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-JWT_REDACTED}
        NEXT_PUBLIC_STATSIG_CLIENT_KEY: ${NEXT_PUBLIC_STATSIG_CLIENT_KEY:-client-SEfCB81zQnvSAqRxfVi1nJNRmpJtrmOrvDKQPQm4UBx}
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ci-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # E2E Test Runner (Playwright)
  # Image tag MUST match @playwright/test version in tests/e2e/package.json.
  # Mismatched browsers in the bundled cache cause cryptic launch errors
  # (e.g. "spawn /bin/sh ENOENT") because newer Playwright expects headless
  # shell binaries that older base images don't ship.
  e2e-tests:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app/tests/e2e
    volumes:
      - ./tests/e2e:/app/tests/e2e
      - e2e-results:/app/tests/e2e/test-results
    environment:
      CI: "true"
      BASE_URL: http://frontend:3000
      API_URL: http://backend:8000
      HEADLESS: "true"
      # Shard configuration for parallel runs
      CI_SHARD_INDEX: ${CI_SHARD_INDEX:-1}
      CI_SHARD_TOTAL: ${CI_SHARD_TOTAL:-1}
    command: >
      sh -c "
        npm ci &&
        npx playwright test --reporter=html,github
      "
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ci-network
    profiles:
      - e2e

  # Smoke Test Runner (subset of E2E for PRs)
  smoke-tests:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app/tests/e2e
    volumes:
      - ./tests/e2e:/app/tests/e2e
      - smoke-results:/app/tests/e2e/test-results
    environment:
      CI: "true"
      BASE_URL: http://frontend:3000
      API_URL: http://backend:8000
      HEADLESS: "true"
    command: >
      sh -c "
        npm ci &&
        npx playwright test --grep @smoke --reporter=html,github --project=chromium
      "
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ci-network
    profiles:
      - smoke

networks:
  ci-network:
    driver: bridge

volumes:
  e2e-results:
  smoke-results:
