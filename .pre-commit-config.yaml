# Pre-commit invokes the SAME repository-owned commands CI runs — never
# its own pinned mirror copies (those drifted years behind the CI pins:
# black 23.11 vs 26.5, flake8 vs ruff, eslint 8 vs 9).
# scripts/ci/check_tool_versions.py fails CI if a mirror hook returns.
#
# The Python hooks expect the backend virtualenv's tools on PATH
# (ruff/black/isort — the same pins CI installs). MyPy is CI-owned:
# it blocks added files only, so a staged-file hook would be stricter
# than the gate and stall commits on legacy debt. Staged-file
# scoping mirrors CI's blocking changed-file quality gate; full-tree
# debt stays in CI's advisory lanes until it reaches zero.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff
        name: ruff on staged backend files (same command as CI)
        entry: python3 -m ruff check
        language: system
        files: ^backend/.*\.py$
      - id: black
        name: black --check on staged backend files (same command as CI)
        entry: python3 -m black --check
        language: system
        files: ^backend/.*\.py$
      - id: isort
        name: isort --check-only on staged backend files (same command as CI)
        entry: python3 -m isort --check-only
        language: system
        files: ^backend/.*\.py$
      - id: eslint
        name: eslint on staged frontend files (same config as CI)
        entry: bash -c 'cd frontend && pnpm exec eslint "${@#frontend/}"' --
        language: system
        files: ^frontend/(app|src)/.*\.(ts|tsx|js|jsx)$
      - id: gitleaks
        name: gitleaks secret scan
        entry: gitleaks git --staged --redact --config .gitleaks.toml
        language: system
        pass_filenames: false
      - id: dir-docs
        name: directory docs lint
        entry: python3 scripts/docs/check_dir_docs.py
        language: system
        files: (^|/)(README|doc)\.md$
        pass_filenames: true
