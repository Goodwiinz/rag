# OpenTelemetry Collector Configuration
# Comprehensive telemetry data collection and routing

receivers:
  # OTLP gRPC receiver for application telemetry
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size: 4194304  # 4MB
        tls:
          insecure: true
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:3000"
            - "http://localhost:3001"
            - "http://localhost:8000"
          allowed_headers:
            - "*"

  # Prometheus metrics receiver
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']
        - job_name: 'prometheus'
          static_configs:
            - targets: ['prometheus:9090']
        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']
        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']
        - job_name: 'jaeger'
          static_configs:
            - targets: ['jaeger:14269']
        - job_name: 'redis'
          static_configs:
            - targets: ['redis:6379']

  # Jaeger receiver for existing traces
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832

  # Filelog receiver for system logs
  filelog:
    include:
      - /var/log/*.log
      - /var/log/**/*.log
    start_at: beginning
    include_file_name: true
    include_file_path: true
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout: '%Y-%m-%dT%H:%M:%S.%fZ'
      - type: move
        from: attributes.message
        to: body
      - type: move
        from: attributes.level
        to: severity

  # Docker metrics receiver
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    metrics:
      docker.container.cpu.usage.total:
        enabled: true
      docker.container.memory.usage:
        enabled: true
      docker.container.network.io.usage.tx_bytes:
        enabled: true
      docker.container.network.io.usage.rx_bytes:
        enabled: true
      docker.container.block.io.usage.total:
        enabled: true

  # Host metrics receiver
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.utilization:
            enabled: true
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
        metrics:
          system.load.1m:
            enabled: true
          system.load.5m:
            enabled: true
          system.load.15m:
            enabled: true
      network:
        metrics:
          system.network.bytes:
            enabled: true
          system.network.packets:
            enabled: true
      processes:
        metrics:
          system.processes.count:
            enabled: true

processors:
  # Batch processor for better performance
  batch:
    timeout: 1s
    send_batch_size: 8192

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource detection and enrichment
  resourcedetection:
    detectors:
      - env
      - system
      - docker
    override: false

  # Resource enrichment
  resource:
    attributes:
      - key: service.name
        value: "knowledge-graph-analytics"
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert
      - key: environment
        value: "production"
        action: upsert

  # Transform processor for data manipulation
  transform:
    # Add trace context to logs
    trace_statements:
      - context: span
        statements:
          - set(attributes["trace.id"], trace_id)
          - set(attributes["span.id"], span_id)

  # Attributes processor for cleanup
  attributes:
    actions:
      - key: service_instance_id
        action: hash
      - key: k8s.pod.name
        action: extract_regex
        regex: "^(.*)-\\w+$"
      - key: http.url
        action: redact
        pattern: "(.*?//).*?(/.*)$"
        replacement: "$1*****$2"

  # Filter processor for data selection
  filter:
    # Remove debug logs in production
    metrics:
      include:
        match_type: regexp
        metric_names: [".*"]
        exclude:
          match_type: strict
          metric_names: ["debug.*", "test.*"]

  # Span processor for trace manipulation
  span:
    name:
      # Remove sensitive information from span names
      from_attributes: ["http.route"]
      to_attributes:
        rules:
          - extract: "^/api/(.*)/(.*)$"
          - replace: {pattern: "\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b", replacement: "*****"}

  # Metrics transform
  metricstransform:
    transforms:
      - include: ".*duration.*"
        action: update
        new_name: "${1}_ms"
      - include: ".*size.*"
        action: update
        new_name: "${1}_bytes"

  # Cumulative to delta processor for histograms
  cumulativetodelta:
    max_staleness: 180s

  # Aggregation for metrics
  aggregation:
    # Aggregation rules for better performance
    output_timeseries: 100
    bounds: [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000]
    aggregation_temporality: delta

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Pprof extension for debugging
  pprof:
    endpoint: 0.0.0.0:1777

  # Zpages extension for debugging
  zpages:
    endpoint: 0.0.0.0:55679

  # Ballast extension for memory management
  ballast:
    size_mib: 64

exporters:
  # Jaeger exporter for traces
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # Prometheus exporter for metrics
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "otel"
    const_labels:
      environment: "production"
      service: "knowledge-graph-analytics"
    send_timestamps: true
    metric_expiration: 180m
    enable_open_metrics: true

  # Loki exporter for logs
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    tenant_id: "knowledge-graph"
    format: "json"
    labels:
      service: "otel-collector"
      environment: "production"

  # OTLP exporter for backup/fallback
  otlphttp/elastic:
    endpoint: "http://elasticsearch:8200"
    tls:
      insecure: true

  # OTLP exporter for testing/debugging
  otlp:
    endpoint: "http://localhost:4318"
    tls:
      insecure: true

service:
  extensions:
    - health_check
    - pprof
    - zpages
    - ballast

  pipelines:
    # Traces pipeline
    traces:
      receivers:
        - otlp
        - jaeger
      processors:
        - memory_limiter
        - batch
        - resourcedetection
        - resource
        - transform
        - span
      exporters:
        - jaeger

    # Metrics pipeline
    metrics:
      receivers:
        - otlp
        - prometheus
        - docker_stats
        - hostmetrics
      processors:
        - memory_limiter
        - batch
        - resourcedetection
        - resource
        - transform
        - metricstransform
        - aggregation
      exporters:
        - prometheus

    # Logs pipeline
    logs:
      receivers:
        - otlp
        - filelog
      processors:
        - memory_limiter
        - batch
        - resourcedetection
        - resource
        - transform
        - attributes
      exporters:
        - loki

  # Telemetry configuration for the collector itself
  telemetry:
    logs:
      level: "info"
    metrics:
      address: 0.0.0.0:8888
    traces:
      # Enable collector's own traces
      enabled: true
      sample: 1.0