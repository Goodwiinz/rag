# Logstash pipeline for RAG System logs
input {
  beats {
    port => 5044
  }

  # TCP input for application logs
  tcp {
    port => 5000
    codec => json
  }

  # File input for container logs
  file {
    path => "/app/logs/*.log"
    start_position => "beginning"
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Parse structured logs from application
  if [parsed] {
    mutate {
      rename => {
        "parsed" => "rag_log"
      }
    }
  }

  # Extract timestamp
  if [rag_log][timestamp] {
    date {
      match => [ "[rag_log][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Add environment and service information
  mutate {
    add_field => {
      "environment" => "production"
      "service" => "rag-system"
      "log_source" => "application"
    }
  }

  # Parse different log types
  if [rag_log][level] {
    mutate {
      add_field => { "log_level" => "%{[rag_log][level]}" }
    }
  }

  # Extract performance metrics
  if [rag_log][duration] {
    mutate {
      convert => { "[rag_log][duration]" => "float" }
      add_field => { "performance_duration" => "%{[rag_log][duration]}" }
    }
  }

  # Extract user information
  if [rag_log][user_id] {
    mutate {
      add_field => { "user_identifier" => "%{[rag_log][user_id]}" }
    }
  }

  # Extract tenant information
  if [rag_log][tenant_id] {
    mutate {
      add_field => { "tenant_identifier" => "%{[rag_log][tenant_id]}" }
    }
  }

  # Extract correlation information
  if [rag_log][correlation_id] {
    mutate {
      add_field => { "correlation_identifier" => "%{[rag_log][correlation_id]}" }
    }
  }

  # Parse security events
  if [rag_log][event_type] == "SECURITY_EVENT" {
    mutate {
      add_field => { "log_category" => "security" }
    }
  }

  # Parse performance events
  if [rag_log][event_type] == "PERFORMANCE" {
    mutate {
      add_field => { "log_category" => "performance" }
    }
  }

  # Parse business events
  if [rag_log][event_type] == "BUSINESS_EVENT" {
    mutate {
      add_field => { "log_category" => "business" }
    }
  }

  # Parse error logs
  if [rag_log][level] == "ERROR" {
    mutate {
      add_field => { "log_category" => "error" }
    }
  }

  # Extract HTTP request information
  if [rag_log][method] {
    mutate {
      add_field => {
        "http_method" => "%{[rag_log][method]}"
        "request_type" => "http"
      }
    }
  }

  # Extract API endpoints
  if [rag_log][path] {
    mutate {
      add_field => { "api_endpoint" => "%{[rag_log][path]}" }
    }
  }

  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }

  # Add geo information based on IP (if available)
  if [rag_log][client_ip] {
    geoip {
      source => "[rag_log][client_ip]"
      target => "geoip"
    }
  }

  # Add user agent parsing (if available)
  if [rag_log][user_agent] {
    useragent {
      source => "[rag_log][user_agent]"
      target => "user_agent_parsed"
    }
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "rag-system-logs-%{+YYYY.MM.dd}"
    template_name => "rag-system"
    template_pattern => "rag-system-*"
    template => {
      "index_patterns" => ["rag-system-*"],
      "settings" => {
        "number_of_shards" => 1,
        "number_of_replicas" => 1,
        "index.refresh_interval" => "5s"
      },
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" },
          "log_level" => { "type" => "keyword" },
          "log_category" => { "type" => "keyword" },
          "service" => { "type" => "keyword" },
          "environment" => { "type" => "keyword" },
          "user_identifier" => { "type" => "keyword" },
          "tenant_identifier" => { "type" => "keyword" },
          "correlation_identifier" => { "type" => "keyword" },
          "http_method" => { "type" => "keyword" },
          "api_endpoint" => { "type" => "keyword" },
          "performance_duration" => { "type" => "float" },
          "rag_log" => {
            "properties" => {
              "trace_id" => { "type" => "keyword" },
              "span_id" => { "type" => "keyword" },
              "error_type" => { "type" => "keyword" },
              "operation" => { "type" => "keyword" }
            }
          },
          "geoip" => {
            "properties" => {
              "location" => { "type" => "geo_point" },
              "country_name" => { "type" => "keyword" },
              "city_name" => { "type" => "keyword" }
            }
          }
        }
      }
    }
  }

  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}