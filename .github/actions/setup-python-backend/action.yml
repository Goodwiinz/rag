name: Setup Python Backend
description: Set up Python, restore pip cache, and install backend dependencies

inputs:
  python-version:
    description: Python version to install
    required: false
    default: '3.11'
  install-test-deps:
    description: Also install test dependencies (pytest, etc.)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install backend dependencies
      shell: bash
      run: pip install --build-constraint backend/constraints-ci.txt -r backend/requirements.txt

    - name: Install test dependencies
      if: inputs.install-test-deps == 'true'
      shell: bash
      run: pip install pytest pytest-asyncio pytest-cov pytest-xdist
