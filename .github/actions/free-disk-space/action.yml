name: Free Disk Space
description: Remove unused tools to free CI runner disk space

runs:
  using: composite
  steps:
    - name: Remove unused tools
      shell: bash
      run: |
        echo "Disk before cleanup:"
        df -h /
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /opt/hostedtoolcache/PyPy || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /opt/hostedtoolcache/go || true
        sudo rm -rf /opt/hostedtoolcache/Ruby || true
        sudo rm -rf /usr/share/swift || true
        sudo rm -rf /var/lib/snapd || true
        sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk || true
        docker system prune -af --volumes 2>/dev/null || true
        echo "Disk after cleanup:"
        df -h /
