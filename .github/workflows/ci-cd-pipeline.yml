name: CI/CD Pipeline - Document Upload & Processing

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # === Code Quality & Security ===
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements-test.txt

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint Python code
      run: |
        echo "Running Python linting checks..."
        flake8 backend/ --max-line-length=100 --ignore=E203,W503
        
        echo "Checking black formatting..."
        black --check backend/
        if [ $? -ne 0 ]; then
          echo "::error::Code is not formatted with black. Run: black backend/"
          exit 1
        fi
        
        echo "Checking isort imports..."
        isort --check-only backend/
        if [ $? -ne 0 ]; then
          echo "::error::Imports are not sorted. Run: isort backend/"
          exit 1
        fi
        
        echo "All linting checks passed!"

    - name: Lint TypeScript code
      working-directory: ./frontend
      run: |
        npm run lint
        npm run type-check

    - name: Run Python security scanning
      run: |
        pip install bandit safety
        
        echo "Running Bandit security scanner..."
        bandit -r backend/ -f json -o bandit-report.json
        
        echo "Running Safety vulnerability check..."
        safety check --json --output safety-report.json
        
        # Check for high/critical vulnerabilities in safety report
        if [ -f safety-report.json ]; then
          if jq -e '.vulnerabilities[] | select(.severity == "high" or .severity == "critical")' safety-report.json >/dev/null 2>&1; then
            echo "::error::High or Critical vulnerabilities found in dependencies!"
            jq '.vulnerabilities[] | select(.severity == "high" or .severity == "critical")' safety-report.json
            exit 1
          fi
        fi
        
        # Check for high severity issues in bandit report
        if [ -f bandit-report.json ]; then
          high_severity=$(jq '[.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")] | length' bandit-report.json)
          if [ "$high_severity" -gt 0 ]; then
            echo "::error::Found $high_severity high/critical severity security issues!"
            jq '.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")' bandit-report.json
            exit 1
          fi
        fi
        
        echo "Security scans passed!"

    - name: Run Node.js security audit
      working-directory: ./frontend
      run: npm audit --audit-level moderate

    - name: Generate version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "release" ]]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "version=$(git describe --tags --always --dirty)" >> $GITHUB_OUTPUT
        fi

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # === Testing ===
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_multimodal_rag
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      neo4j:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/neo4jpassword
          NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
        options: >-
          --health-cmd "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 7474:7474
          - 7687:7687

      qdrant:
        image: qdrant/qdrant:v1.7.0
        ports:
          - 6333:6333

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements-test.txt

    - name: Wait for services
      run: |
        echo "Waiting for services to be ready..."
        
        # Function to check service readiness with proper validation
        check_service() {
          local service=$1
          local host=$2
          local port=$3
          local max_attempts=60
          local attempt=0
          
          echo "Checking $service at $host:$port..."
          while [ $attempt -lt $max_attempts ]; do
            if nc -z $host $port 2>/dev/null; then
              echo "$service port is open, verifying service health..."
              
              # Additional health checks for specific services
              case $service in
                "PostgreSQL")
                  if PGPASSWORD=postgres psql -h localhost -U postgres -d test_multimodal_rag -c "SELECT 1" >/dev/null 2>&1; then
                    echo "$service is healthy!"
                    return 0
                  fi
                  ;;
                "Redis")
                  if redis-cli -h localhost ping | grep -q PONG; then
                    echo "$service is healthy!"
                    return 0
                  fi
                  ;;
                "Neo4j")
                  if cypher-shell -a bolt://localhost:7687 -u neo4j -p neo4jpassword "RETURN 1" >/dev/null 2>&1; then
                    echo "$service is healthy!"
                    return 0
                  fi
                  ;;
                "Qdrant")
                  if curl -f -s http://localhost:6333/health >/dev/null 2>&1; then
                    echo "$service is healthy!"
                    return 0
                  fi
                  ;;
              esac
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts for $service..."
            sleep 5
          done
          echo "ERROR: $service failed to become ready within 300 seconds"
          return 1
        }
        
        # Install required tools for health checks
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client redis-tools curl netcat
        
        # Check PostgreSQL
        check_service "PostgreSQL" "localhost" "5432" || exit 1
        
        # Check Redis
        check_service "Redis" "localhost" "6379" || exit 1
        
        # Check Neo4j
        check_service "Neo4j" "localhost" "7687" || exit 1
        
        # Check Qdrant
        check_service "Qdrant" "localhost" "6333" || exit 1
        
        echo "All services are ready and healthy!"

    - name: Run unit tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_multimodal_rag
        REDIS_URL: redis://localhost:6379
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: neo4jpassword
        QDRANT_URL: http://localhost:6333
        SECRET_KEY: test-secret-key
        ENVIRONMENT: testing
      run: |
        cd backend
        python -m pytest tests/unit/ -v \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=80
        
        if [ $? -ne 0 ]; then
          echo "::error::Tests failed or coverage is below 80%"
          exit 1
        fi

    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_multimodal_rag
        REDIS_URL: redis://localhost:6379
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: neo4jpassword
        QDRANT_URL: http://localhost:6333
        SECRET_KEY: test-secret-key
        ENVIRONMENT: testing
      run: |
        cd backend
        python -m pytest tests/integration/ -v \
          --cov=src \
          --cov-append \
          --cov-report=xml \
          --cov-fail-under=80
        
        if [ $? -ne 0 ]; then
          echo "::error::Integration tests failed or coverage is below 80%"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: |
          backend/htmlcov/
          backend/test-results.xml

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run unit tests
      working-directory: ./frontend
      run: npm run test:unit -- --coverage --watchAll=false

    - name: Run component tests
      working-directory: ./frontend
      run: npm run test:component -- --coverage --watchAll=false

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: frontend-test-results
        path: frontend/coverage/

  # === Build ===
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ needs.code-quality.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # === Security Scanning ===
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name != 'pull_request'

    steps:
    - name: Run Trivy vulnerability scanner on backend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build-images.outputs.backend-image }}
        format: 'sarif'
        output: 'trivy-backend-results.sarif'

    - name: Run Trivy vulnerability scanner on frontend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build-images.outputs.frontend-image }}
        format: 'sarif'
        output: 'trivy-frontend-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-backend-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab (frontend)
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-frontend-results.sarif'

  # === Deploy to Staging ===
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure SSH access
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
          cd ${{ secrets.STAGING_DEPLOY_PATH }}
          
          # Pull latest images (feed password via stdin)
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker-compose pull backend frontend
          
          # Capture current DB migration revision before upgrade
          CURRENT_REVISION=$(docker-compose run --rm backend alembic current 2>&1 | grep -oP '^[a-f0-9]+' | head -n 1)
          echo "Current DB revision: ${CURRENT_REVISION:-none}"
          
          # Run database migrations
          if ! docker-compose run --rm backend alembic upgrade head; then
            echo "Migration failed, rolling back to revision: ${CURRENT_REVISION:-base}"
            if [ -n "$CURRENT_REVISION" ]; then
              docker-compose run --rm backend alembic downgrade "$CURRENT_REVISION" || {
                echo "Rollback to $CURRENT_REVISION failed, attempting restore from backup..."
                # Trigger backup restore path here
                exit 1
              }
            else
              echo "No previous revision found, cannot rollback"
              exit 1
            fi
            exit 1
          fi
          
          # Start services
          docker-compose up -d backend frontend
          
          # Wait for services to be healthy
          for i in {1..30}; do
            if docker-compose ps | grep -q "Up (healthy)"; then
              echo "Services are healthy"
              break
            fi
            sleep 5
          done
        EOF

    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        max_retries=3
        retry_count=0
        
        while [ $retry_count -lt $max_retries ]; do
          # Health check
          if curl -f -s ${{ secrets.STAGING_API_URL }}/health > /dev/null; then
            echo "Health check passed"
            
            # Basic API test
            response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_API_URL }}/api/v1/status)
            if [ "$response" = "200" ]; then
              echo "Smoke tests passed"
              exit 0
            fi
          fi
          
          retry_count=$((retry_count + 1))
          echo "Attempt $retry_count failed, retrying..."
          sleep 10
        done
        
        echo "Smoke tests failed after $max_retries attempts"
        exit 1

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Deployment failed, rolling back..."
        ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
          cd ${{ secrets.STAGING_DEPLOY_PATH }}
          docker-compose down
          
          # Attempt to retrieve saved revision from deployment step or get current
          SAVED_REVISION=$(docker-compose run --rm backend alembic current 2>&1 | grep -oP '^[a-f0-9]+' | head -n 1)
          
          if [ -n "$SAVED_REVISION" ]; then
            echo "Rolling back to revision: $SAVED_REVISION"
            docker-compose run --rm backend alembic downgrade "$SAVED_REVISION" || {
              echo "Rollback failed, attempting restore from backup..."
              # Add backup restore commands here
              exit 1
            }
          else
            echo "No revision to rollback to, attempting restore from backup..."
            # Add backup restore commands here
            exit 1
          fi
          
          # Restart with previous version
          docker-compose up -d
        EOF

  # === Deploy to Production ===
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    if: github.event_name == 'release'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Add production deployment logic here

    - name: Run production smoke tests
      run: |
        echo "Running production smoke tests..."
        # Add production smoke test commands here