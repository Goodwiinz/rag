name: Secret Scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: >
          gitleaks git . --redact --config .gitleaks.toml --verbose
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan pushed commits
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="-1"
          else
            LOG_OPTS="${{ github.event.before }}..${{ github.sha }}"
          fi
          gitleaks git . --redact --config .gitleaks.toml --verbose --log-opts="$LOG_OPTS"

      - name: Scan current commit
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks git . --redact --config .gitleaks.toml --verbose --log-opts="-1"
