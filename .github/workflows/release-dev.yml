name: Release Dev
run-name: Release dev from Test Pipeline ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Test Pipeline"]
    types: [completed]
    branches: [develop]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-dev
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize Exact-SHA Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      current: ${{ steps.prebuild.outputs.current }}
      source_sha: ${{ steps.producer.outputs.source_sha }}
      test_run_id: ${{ steps.producer.outputs.test_run_id }}
      test_run_attempt: ${{ steps.producer.outputs.test_run_attempt }}
      test_run_url: ${{ steps.producer.outputs.test_run_url }}

    steps:
      - name: Verify producer run and Release Gate
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          TEST_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [[ ! "$EVENT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Producer supplied an invalid source SHA"
            exit 1
          fi
          if [[ ! "$TEST_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Producer supplied an invalid workflow run ID"
            exit 1
          fi
          if [[ ! "$TEST_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Producer supplied an invalid workflow run attempt"
            exit 1
          fi

          IFS=$'\t' read -r RUN_EVENT RUN_BRANCH RUN_SHA RUN_CONCLUSION RUN_REPOSITORY RUN_ATTEMPT RUN_URL < <(
            gh api "repos/$REPOSITORY/actions/runs/$TEST_RUN_ID" \
              --jq '[.event, .head_branch, .head_sha, .conclusion, .head_repository.full_name, .run_attempt, .html_url] | @tsv'
          )

          if [ "$RUN_EVENT" != "push" ] || [ "$RUN_BRANCH" != "develop" ]; then
            echo "::error::Run $TEST_RUN_ID was not a push to develop"
            exit 1
          fi
          if [ "$RUN_SHA" != "$EVENT_SOURCE_SHA" ]; then
            echo "::error::Producer API SHA $RUN_SHA does not match event SHA $EVENT_SOURCE_SHA"
            exit 1
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::Test Pipeline conclusion is $RUN_CONCLUSION, not success"
            exit 1
          fi
          if [ "$RUN_REPOSITORY" != "$REPOSITORY" ]; then
            echo "::error::Producer repository $RUN_REPOSITORY does not match $REPOSITORY"
            exit 1
          fi
          if [ "$RUN_ATTEMPT" != "$TEST_RUN_ATTEMPT" ]; then
            echo "::error::Producer API attempt $RUN_ATTEMPT does not match event attempt $TEST_RUN_ATTEMPT"
            exit 1
          fi

          mapfile -t RELEASE_GATES < <(
            gh api --paginate \
              "repos/$REPOSITORY/actions/runs/$TEST_RUN_ID/attempts/$TEST_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Release Gate") | [.status, .conclusion, .head_sha] | @tsv'
          )

          if [ "${#RELEASE_GATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Release Gate job, found ${#RELEASE_GATES[@]}"
            exit 1
          fi

          IFS=$'\t' read -r GATE_STATUS GATE_CONCLUSION GATE_SHA <<< "${RELEASE_GATES[0]}"
          if [ "$GATE_STATUS" != "completed" ] || [ "$GATE_CONCLUSION" != "success" ]; then
            echo "::error::Release Gate is $GATE_STATUS/$GATE_CONCLUSION, not completed/success"
            exit 1
          fi
          if [ "$GATE_SHA" != "$RUN_SHA" ]; then
            echo "::error::Release Gate SHA $GATE_SHA does not match producer SHA $RUN_SHA"
            exit 1
          fi

          echo "source_sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "test_run_id=$TEST_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "test_run_attempt=$TEST_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "test_run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Checkout tested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.producer.outputs.source_sha }}
          fetch-depth: 1

      - name: Re-fetch develop before build
        id: prebuild
        env:
          SOURCE_SHA: ${{ steps.producer.outputs.source_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $SOURCE_SHA"
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/develop:refs/remotes/origin/develop"
          LATEST_DEVELOP_SHA="$(git rev-parse refs/remotes/origin/develop)"
          if [ "$LATEST_DEVELOP_SHA" != "$SOURCE_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Dev Release Superseded Before Build"
              echo
              echo "Tested source \`$SOURCE_SHA\` was superseded by \`$LATEST_DEVELOP_SHA\`."
              echo "No image was built."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build Exact-SHA-Tagged Image
    needs: authorize
    if: needs.authorize.outputs.current == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docker-build.yml
    with:
      source_sha: ${{ needs.authorize.outputs.source_sha }}
    secrets:
      DO_REGISTRY_TOKEN: ${{ secrets.DO_REGISTRY_TOKEN }}
      DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
      DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}

  validate-release:
    name: Validate Immutable Dev Release
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      current: ${{ steps.final-head.outputs.current }}
      latest_develop_sha: ${{ steps.final-head.outputs.latest_develop_sha }}

    steps:
      # This is the only job that executes source-controlled validation code.
      # It has no write credential, and checkout does not persist its read token.
      - name: Checkout tested source for read-only validation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install verified yq
        env:
          YQ_SHA256: 0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598
          YQ_VERSION: v4.44.6
        run: |
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o "$RUNNER_TEMP/yq"
          echo "$YQ_SHA256  $RUNNER_TEMP/yq" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v3.0.0
        with:
          version: "3.13.0"

      - name: Validate release inputs and Helm rendering
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $SOURCE_SHA"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Reusable build returned an invalid digest: $DIGEST"
            exit 1
          fi
          if [ "$IMAGE_TAG" != "registry.digitalocean.com/ragsystemregistry/backend:$SOURCE_SHA" ]; then
            echo "::error::Reusable build tag does not match the tested source SHA"
            exit 1
          fi

          VALUES_FILE="infrastructure/helm/knowledge-graph-analytics/values-dev.yaml"
          SOURCE_SHA="$SOURCE_SHA" DIGEST="$DIGEST" yq -i '
            .backend.image.tag = strenv(SOURCE_SHA) |
            .backend.image.digest = strenv(DIGEST) |
            .backend.image.sourceSha = strenv(SOURCE_SHA)
          ' "$VALUES_FILE"

          CHART="infrastructure/helm/knowledge-graph-analytics"
          helm lint "$CHART" -f "$CHART/values.yaml" -f "$VALUES_FILE"
          helm template nous-dev "$CHART" \
            -f "$CHART/values.yaml" -f "$VALUES_FILE" >/dev/null
          bash "$CHART/tests/backend_image_digest_render_test.sh"

      - name: Re-fetch develop after validation
        id: final-head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          LATEST_DEVELOP_SHA="$(
            gh api "repos/$REPOSITORY/git/ref/heads/develop" --jq '.object.sha'
          )"
          echo "latest_develop_sha=$LATEST_DEVELOP_SHA" >> "$GITHUB_OUTPUT"
          if [ "$LATEST_DEVELOP_SHA" != "$SOURCE_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Dev Release Superseded After Build"
              echo
              echo "Tested source \`$SOURCE_SHA\` was superseded by \`$LATEST_DEVELOP_SHA\`."
              echo "The image remains unused; no release credential was minted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"

  promote:
    name: Promote Immutable Dev Digest
    needs: [authorize, build, validate-release]
    if: always() && needs.authorize.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # This fresh job does not execute source-controlled scripts. It prepares a
      # bounded two-file commit before the write credential is minted.
      - name: Checkout tested source for release commit
        if: needs.validate-release.outputs.current == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install verified yq
        if: needs.validate-release.outputs.current == 'true'
        env:
          YQ_SHA256: 0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598
          YQ_VERSION: v4.44.6
        run: |
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o "$RUNNER_TEMP/yq"
          echo "$YQ_SHA256  $RUNNER_TEMP/yq" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Prepare bounded release commit
        id: promotion
        if: needs.validate-release.outputs.current == 'true'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          TEST_RUN_ID: ${{ needs.authorize.outputs.test_run_id }}
          TEST_RUN_ATTEMPT: ${{ needs.authorize.outputs.test_run_attempt }}
          TEST_RUN_URL: ${{ needs.authorize.outputs.test_run_url }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $SOURCE_SHA"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Reusable build returned an invalid digest: $DIGEST"
            exit 1
          fi
          if [ "$IMAGE_TAG" != "registry.digitalocean.com/ragsystemregistry/backend:$SOURCE_SHA" ]; then
            echo "::error::Reusable build tag does not match the tested source SHA"
            exit 1
          fi

          LATEST_DEVELOP_SHA="$(
            gh api "repos/$REPOSITORY/git/ref/heads/develop" --jq '.object.sha'
          )"
          echo "latest_develop_sha=$LATEST_DEVELOP_SHA" >> "$GITHUB_OUTPUT"
          if [ "$LATEST_DEVELOP_SHA" != "$SOURCE_SHA" ]; then
            echo "promotion_status=superseded" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t DEPLOY_REFS < <(
            gh api --paginate \
              "repos/$REPOSITORY/git/matching-refs/heads/deploy/dev?per_page=100" \
              --jq '.[] | select(.ref == "refs/heads/deploy/dev") | .object.sha'
          )
          if [ "${#DEPLOY_REFS[@]}" -gt 1 ]; then
            echo "::error::deploy/dev resolved to more than one exact ref"
            exit 1
          fi
          EXPECTED_DEPLOY_SHA="${DEPLOY_REFS[0]-}"
          if [ -n "$EXPECTED_DEPLOY_SHA" ] && [[ ! "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy/dev resolved to an invalid commit identity"
            exit 1
          fi

          git switch --force-create deploy/dev "$SOURCE_SHA"

          VALUES_FILE="infrastructure/helm/knowledge-graph-analytics/values-dev.yaml"
          RELEASE_FILE="infrastructure/helm/knowledge-graph-analytics/release-dev.json"
          PROMOTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          SOURCE_SHA="$SOURCE_SHA" DIGEST="$DIGEST" yq -i '
            .backend.image.tag = strenv(SOURCE_SHA) |
            .backend.image.digest = strenv(DIGEST) |
            .backend.image.sourceSha = strenv(SOURCE_SHA)
          ' "$VALUES_FILE"

          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg test_run_id "$TEST_RUN_ID" \
            --arg test_run_attempt "$TEST_RUN_ATTEMPT" \
            --arg test_run_url "$TEST_RUN_URL" \
            --arg image_tag "$IMAGE_TAG" \
            --arg digest "$DIGEST" \
            --arg promoted_at "$PROMOTED_AT" \
            '{source_sha: $source_sha, test_run_id: $test_run_id, test_run_attempt: $test_run_attempt, test_run_url: $test_run_url, image_tag: $image_tag, digest: $digest, promoted_at: $promoted_at}' \
            > "$RELEASE_FILE"

          mapfile -t CHANGED_FILES < <(
            { git diff --name-only "$SOURCE_SHA"; git ls-files --others --exclude-standard; } | sort -u
          )
          if [ "${#CHANGED_FILES[@]}" -ne 2 ] || \
             ! printf '%s\n' "${CHANGED_FILES[@]}" | grep -Fxq "$VALUES_FILE" || \
             ! printf '%s\n' "${CHANGED_FILES[@]}" | grep -Fxq "$RELEASE_FILE"; then
            echo "::error::Release commit attempted to change files outside the dev manifest and metadata"
            printf 'Changed: %s\n' "${CHANGED_FILES[@]}"
            exit 1
          fi

          git config user.name "nous-release[bot]"
          git config user.email "nous-release[bot]@users.noreply.github.com"
          git add "$VALUES_FILE" "$RELEASE_FILE"
          git -c commit.gpgsign=false -c core.hooksPath=/dev/null \
            commit -m "chore(release): promote dev ${SOURCE_SHA:0:12} [skip ci]"

          echo "expected_deploy_sha=$EXPECTED_DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "promotion_status=ready" >> "$GITHUB_OUTPUT"

      - name: Recheck develop before minting a write token
        id: last-head
        if: steps.promotion.outputs.promotion_status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          LATEST_DEVELOP_SHA="$(
            gh api "repos/$REPOSITORY/git/ref/heads/develop" --jq '.object.sha'
          )"
          echo "latest_develop_sha=$LATEST_DEVELOP_SHA" >> "$GITHUB_OUTPUT"
          if [ "$LATEST_DEVELOP_SHA" != "$SOURCE_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Mint dedicated release App token
        id: app-token
        if: steps.last-head.outputs.current == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.DEV_RELEASE_APP_ID }}
          private-key: ${{ secrets.DEV_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push only the prepared deploy/dev commit
        id: push
        if: steps.last-head.outputs.current == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_DEPLOY_SHA: ${{ steps.promotion.outputs.expected_deploy_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::The release App did not return a token"
            exit 1
          fi
          AUTH_HEADER="$(
            printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n'
          )"
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            push \
            "--force-with-lease=refs/heads/deploy/dev:${EXPECTED_DEPLOY_SHA}" \
            "https://github.com/$REPOSITORY.git" \
            HEAD:refs/heads/deploy/dev
          echo "promotion_status=promoted" >> "$GITHUB_OUTPUT"

      - name: Record release evidence
        id: evidence
        if: always()
        env:
          CURRENT: ${{ needs.validate-release.outputs.current }}
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          LAST_HEAD_CURRENT: ${{ steps.last-head.outputs.current }}
          LATEST_DEVELOP_SHA: ${{ steps.last-head.outputs.latest_develop_sha || steps.promotion.outputs.latest_develop_sha || needs.validate-release.outputs.latest_develop_sha }}
          PROMOTION_OUTCOME: ${{ steps.promotion.outcome }}
          PROMOTION_STATUS: ${{ steps.push.outputs.promotion_status || steps.promotion.outputs.promotion_status }}
          RELEASE_COMMIT: ${{ steps.promotion.outputs.release_commit }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          TEST_RUN_ID: ${{ needs.authorize.outputs.test_run_id }}
          TEST_RUN_ATTEMPT: ${{ needs.authorize.outputs.test_run_attempt }}
          TEST_RUN_URL: ${{ needs.authorize.outputs.test_run_url }}
        run: |
          if [ "$CURRENT" = "false" ] || [ "$PROMOTION_STATUS" = "superseded" ] || \
             { [ "$PROMOTION_STATUS" = "ready" ] && [ "$LAST_HEAD_CURRENT" = "false" ]; }; then
            STATUS="superseded"
          elif [ "$PROMOTION_OUTCOME" = "success" ] && [ "$PROMOTION_STATUS" = "promoted" ]; then
            STATUS="promoted"
          else
            STATUS="failed"
          fi

          jq -n \
            --arg status "$STATUS" \
            --arg source_sha "$SOURCE_SHA" \
            --arg test_run_id "$TEST_RUN_ID" \
            --arg test_run_attempt "$TEST_RUN_ATTEMPT" \
            --arg test_run_url "$TEST_RUN_URL" \
            --arg image_tag "$IMAGE_TAG" \
            --arg digest "$DIGEST" \
            --arg latest_develop_sha "$LATEST_DEVELOP_SHA" \
            --arg release_commit "$RELEASE_COMMIT" \
            '{status: $status, source_sha: $source_sha, test_run_id: $test_run_id, test_run_attempt: $test_run_attempt, test_run_url: $test_run_url, image_tag: $image_tag, digest: $digest, latest_develop_sha: $latest_develop_sha, release_commit: $release_commit}' \
            > release-evidence.json

          {
            echo "## Dev Release Evidence"
            echo
            echo "- Status: \`$STATUS\`"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Test run: [\`$TEST_RUN_ID\`]($TEST_RUN_URL), attempt \`$TEST_RUN_ATTEMPT\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Latest develop SHA at final check: \`$LATEST_DEVELOP_SHA\`"
            echo "- deploy/dev release commit: \`${RELEASE_COMMIT:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: dev-release-${{ needs.authorize.outputs.source_sha }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
