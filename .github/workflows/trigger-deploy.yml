name: Deploy Trigger.dev Tasks

on:
  push:
    branches: [main]
    paths:
      - "src/trigger/**"
      - "trigger.config.ts"
      - "package.json"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          # Pin to the root workspace lockfile — without this, setup-node globs
          # **/pnpm-lock.yaml and an unrelated frontend lockfile change busts
          # this deploy job's cache (it installs only from the root lockfile).
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Fetch Trigger.dev secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: "https://app.infisical.com"
          project-slug: "nous-platform"
          env-slug: "dev"
          secret-path: "/trigger"
          export-type: "env"

      - run: pnpm dlx trigger.dev@4.4.6 deploy
