name: CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    types: [closed]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      feature_flag:
        description: 'Feature flag to enable'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: multimodal-rag-system

jobs:
  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    environment: staging
    outputs:
      deployment-status: ${{ steps.deploy.outputs.status }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Kustomize
      uses: imjasonh/setup-kustomize@v1

    - name: Configure kubeconfig for staging
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_STAGING }}

    - name: Deploy to Staging
      id: deploy
      run: |
        # Set environment-specific configurations
        export NAMESPACE="multimodal-rag-staging"
        export IMAGE_TAG="${{ github.sha }}"
        export DEPLOYMENT_STRATEGY="rolling-update"

        # Apply feature flag if provided
        if [ -n "${{ inputs.feature_flag }}" ]; then
          echo "Deploying with feature flag: ${{ inputs.feature_flag }}"
          kustomize build kubernetes/overlays/staging | \
          kubectl apply -n $NAMESPACE -f - --wait --timeout=300s

          # Enable feature flag
          kubectl patch configmap feature-flags -n $NAMESPACE \
            --type='merge' -p '{"data":{"${{ inputs.feature_flag }}":"true"}}'
        else
          kustomize build kubernetes/overlays/staging | \
          kubectl apply -n $NAMESPACE -f - --wait --timeout=300s
        fi

        # Verify deployment
        kubectl rollout status deployment/backend -n $NAMESPACE --timeout=300s
        kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=300s

        # Run post-deployment tests
        kubectl exec deployment/backend -n $NAMESPACE -- \
          curl -f http://localhost:8000/health || exit 1

        kubectl exec deployment/frontend -n $NAMESPACE -- \
          curl -f http://localhost:3000 || exit 1

        # Output deployment status
        echo "deployment-status=success" >> $GITHUB_OUTPUT

    - name: Run smoke tests
      run: |
        export NAMESPACE="multimodal-rag-staging"

        # Wait for services to be ready
        kubectl wait --for=condition=ready pod -l app=backend -n $NAMESPACE --timeout=300s
        kubectl wait --for=condition=ready pod -l app=frontend -n $NAMESPACE --timeout=300s

        # Run basic health checks
        kubectl exec deployment/backend -n $NAMESPACE -- \
          curl -f http://localhost:8000/health

        kubectl exec deployment/frontend -n $NAMESPACE -- \
          curl -f http://localhost:3000

    - name: Notify Slack
      if: always()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: '#deployments'
        SLACK_USERNAME: 'GitHub Actions'
        SLACK_ICON_EMOJI: ':rocket:'
      with:
        status: ${{ job.status }}
        fields: |
          repo=${{ github.repository }}
          commit=${{ github.sha }}
          url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Approve Production Deployment
  approve-production:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    needs: deploy-staging
    outputs:
      approved: ${{ steps.approve.outputs.approved }}
    steps:
    - name: Wait for approval
      id: approve
      uses: actions/github-script@v7
      with:
        script: |
          // Check if approval is needed based on workflow input
          if (github.event.inputs.environment !== 'production') {
            core.setOutput('approved', 'false');
            core.setFailed('Production deployment requires explicit approval');
            return;
          }

          core.setOutput('approved', 'true');
          core.info('Production deployment approved');

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && needs.approve-production.outputs.approved == 'true'
    environment: production
    needs: [approve-production, deploy-staging]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Kustomize
      uses: imjasonh/setup-kustomize@v1

    - name: Configure kubeconfig for production
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Backup Production State
      run: |
        export NAMESPACE="multimodal-rag-system"
        export TIMESTAMP=$(date +%Y%m%d_%H%M%S)

        # Create backup of current state
        kubectl get all -n $NAMESPACE --export -o yaml > backup_${TIMESTAMP}.yaml

        # Store backup as artifact
        echo "backup_${TIMESTAMP}.yaml" > backup_filename.txt

    - name: Deploy to Production
      run: |
        # Set environment-specific configurations
        export NAMESPACE="multimodal-rag-system"
        export IMAGE_TAG="${{ github.sha }}"
        export DEPLOYMENT_STRATEGY="blue-green"

        # Apply feature flag if provided
        if [ -n "${{ inputs.feature_flag }}" ]; then
          echo "Deploying with feature flag: ${{ inputs.feature_flag }}"
          kustomize build kubernetes/overlays/production | \
          kubectl apply -n $NAMESPACE -f - --wait --timeout=300s

          # Enable feature flag
          kubectl patch configmap feature-flags -n $NAMESPACE \
            --type='merge' -p '{"data":{"${{ inputs.feature_flag }}":"true"}}'
        else
          kustomize build kubernetes/overlays/production | \
          kubectl apply -n $NAMESPACE -f - --wait --timeout=300s
        fi

        # Verify deployment
        kubectl rollout status deployment/backend -n $NAMESPACE --timeout=300s
        kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=300s

        # Run post-deployment tests
        kubectl exec deployment/backend -n $NAMESPACE -- \
          curl -f http://localhost:8000/health || exit 1

        kubectl exec deployment/frontend -n $NAMESPACE -- \
          curl -f http://localhost:3000 || exit 1

    - name: Run production health checks
      run: |
        export NAMESPACE="multimodal-rag-system"

        # Wait for services to be ready
        kubectl wait --for=condition=ready pod -l app=backend -n $NAMESPACE --timeout=300s
        kubectl wait --for=condition=ready pod -l app=frontend -n $NAMESPACE --timeout=300s

        # Run comprehensive health checks
        kubectl exec deployment/backend -n $NAMESPACE -- \
          curl -f http://localhost:8000/health

        kubectl exec deployment/frontend -n $NAMESPACE -- \
          curl -f http://localhost:3000

        # Test WebSocket connectivity
        kubectl exec deployment/backend -n $NAMESPACE -- \
          curl -f http://localhost:8001/ws/health

    - name: Canary Deployment
      if: success()
      run: |
        export NAMESPACE="multimodal-rag-system"
        export CANARY_PERCENTAGE=10

        # Deploy canary version
        kubectl apply -f kubernetes/canary/canary-deployment.yaml -n $NAMESPACE

        # Wait for canary pods to be ready
        kubectl wait --for=condition=ready pod -l app=backend,version=canary -n $NAMESPACE --timeout=300s

        # Test canary health
        kubectl exec deployment/backend-canary -n $NAMESPACE -- \
          curl -f http://localhost:8000/health

    - name: Update production status
      if: success()
      run: |
        # Update production status
        kubectl patch configmap production-status -n multimodal-rag-system \
          --type='merge' -p '{"data":{"status":"healthy","last_deploy":"'${{ github.sha }}'","timestamp":"'$(date -Iseconds)'"}}'

    - name: Notify Slack
      if: always()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: '#deployments'
        SLACK_USERNAME: 'GitHub Actions'
        SLACK_ICON_EMOJI: ':rocket:'
      with:
        status: ${{ job.status }}
        fields: |
          repo=${{ github.repository }}
          commit=${{ github.sha }}
          url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Rollback on failure
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-production.result == 'failure' || needs.deploy-staging.result == 'failure')
    needs: [deploy-staging, deploy-production]
    steps:
    - name: Configure kubeconfig
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Perform rollback
      run: |
        export NAMESPACE="multimodal-rag-system"

        # Get previous deployment
        PREVIOUS_SHA=$(kubectl get configmap production-status -n $NAMESPACE -o jsonpath='{.data.last_rollback}' 2>/dev/null || echo "")

        if [ -n "$PREVIOUS_SHA" ]; then
          echo "Rolling back to previous version: $PREVIOUS_SHA"
          # Rollback to previous version
          kubectl rollout undo deployment/backend -n $NAMESPACE --to-revision=$(kubectl get deployment/backend -n $NAMESPACE -o jsonpath='{.spec.rollbackTo.revision}' 2>/dev/null || "0")
          kubectl rollout undo deployment/frontend -n $NAMESPACE --to-revision=$(kubectl get deployment/frontend -n $NAMESPACE -o jsonpath='{.spec.rollbackTo.revision}' 2>/dev/null || "0")
        else
          echo "Scaling down services due to no previous version found"
          # Scale down to zero
          kubectl scale deployment/backend --replicas=0 -n $NAMESPACE
          kubectl scale deployment/frontend --replicas=0 -n $NAMESPACE
        fi

        # Wait for rollback completion
        kubectl rollout status deployment/backend -n $NAMESPACE --timeout=300s
        kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=300s

    - name: Notify Slack about rollback
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: '#deployments'
        SLACK_USERNAME: 'GitHub Actions'
        SLACK_ICON_EMOJI: ':warning:'
      with:
        status: ${{ job.status }}
        fields: |
          repo=${{ github.repository }}
          commit=${{ github.sha }}
          url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}