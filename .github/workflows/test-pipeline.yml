name: Test Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ==========================================================================
  # Code Quality Checks (Fast - Run First)
  # ==========================================================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Depot OIDC authentication
    steps:
      - uses: actions/checkout@v4

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Build lint image with Depot
        uses: depot/build-push-action@v1
        with:
          project: ${{ secrets.DEPOT_PROJECT_ID }}
          context: .
          file: backend/docker/Dockerfile.lint
          load: true
          tags: rag-lint:ci

      - name: Run Ruff (linting)
        run: docker run --rm rag-lint:ci ruff check backend/src --output-format=github

      - name: Run Black (formatting check)
        run: docker run --rm rag-lint:ci black --check backend/src
        continue-on-error: true  # Allow failures during gradual adoption

      - name: Run isort (import sorting)
        run: docker run --rm rag-lint:ci isort --check-only backend/src
        continue-on-error: true  # Allow failures during gradual adoption

      - name: Run MyPy (type checking)
        run: docker run --rm rag-lint:ci mypy backend/src --ignore-missing-imports
        continue-on-error: true  # Allow failures during gradual adoption

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run linting
        run: npm run lint
        # Lint errors now block CI (Phase 2.1 - AI-assisted dev improvements)

  # ==========================================================================
  # Unit Tests (Fast - No External Dependencies)
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov pytest-xdist
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "unit or not (integration or e2e or slow)" \
            --cov=backend/src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=15 \
            -n auto \
            -v
        # Note: Coverage threshold lowered to 8% after excluding integration tests from norecursedirs
        # to prevent Qdrant connection errors during unit test collection (GOO-151)
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///:memory:"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unit
          name: unit-tests

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit (Python security)
        run: bandit -r backend/src -ll -ii -x tests
        # Security scans now block CI (Phase 2.3 - AI-assisted dev improvements)

      - name: Run Safety (dependency vulnerabilities)
        run: safety check -r backend/requirements.txt
        continue-on-error: true  # Allow failures for unmaintained packages (TODO: address these)

  # ==========================================================================
  # Frontend Tests
  # ==========================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-tests

  # ==========================================================================
  # Integration Tests (Require Services)
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # Don't block workflow if integration tests fail/timeout
    needs: [unit-tests, frontend-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install -r backend/requirements.txt

      - name: Run integration tests
        run: |
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "integration" \
            --cov=backend/src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v || exit_code=$?; if [ "$exit_code" = "5" ]; then echo "No integration tests found - skipping"; exit 0; else exit $exit_code; fi
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: integration
          name: integration-tests

  # ==========================================================================
  # Resilience Tests
  # ==========================================================================
  resilience-tests:
    name: Resilience Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install -r backend/requirements.txt

      - name: Run resilience tests
        run: |
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "resilience" \
            --cov=backend/src/core \
            --cov-report=xml \
            -v || exit_code=$?; if [ "$exit_code" = "5" ]; then echo "No resilience tests found - skipping"; exit 0; else exit $exit_code; fi
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///:memory:"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: resilience
          name: resilience-tests

  # ==========================================================================
  # API Contract Tests
  # ==========================================================================
  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio schemathesis
          pip install -r backend/requirements.txt

      - name: Run contract tests
        run: |
          pytest backend/tests/api_contract/ \
            -c backend/pytest.ini \
            -v
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
        continue-on-error: true  # Allow failures during development

  # ==========================================================================
  # E2E Tests (PRs to main only - Phase 3.1)
  # ==========================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (smoke only)
        run: npx playwright test --grep=@smoke --project=chromium
        continue-on-error: true  # E2E tests are informational during initial rollout
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================================================
  # Performance Tests (Main Branch Only)
  # ==========================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-benchmark locust
          pip install -r backend/requirements.txt

      - name: Run performance tests
        run: |
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "slow or scalability" \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            -v
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"

      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json

  # ==========================================================================
  # Test Summary
  # ==========================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, resilience-tests, frontend-tests, security-scan, api-contract-tests]
    if: always()
    env:
      UNIT_RESULT: ${{ needs.unit-tests.result }}
      INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
      RESILIENCE_RESULT: ${{ needs.resilience-tests.result }}
      FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
      SECURITY_RESULT: ${{ needs.security-scan.result }}
      CONTRACT_RESULT: ${{ needs.api-contract-tests.result }}
      GH_WORKFLOW: ${{ github.workflow }}
      GH_REF: ${{ github.ref_name }}
      GH_SHA: ${{ github.sha }}
    steps:
      - name: Generate test results summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY

          # Unit Tests
          if [ "$UNIT_RESULT" == "success" ]; then
            echo "| Unit Tests | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$UNIT_RESULT" == "skipped" ]; then
            echo "| Unit Tests | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | :x: $UNIT_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          # Integration Tests
          if [ "$INTEGRATION_RESULT" == "success" ]; then
            echo "| Integration Tests | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$INTEGRATION_RESULT" == "skipped" ]; then
            echo "| Integration Tests | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Integration Tests | :x: $INTEGRATION_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          # Resilience Tests
          if [ "$RESILIENCE_RESULT" == "success" ]; then
            echo "| Resilience Tests | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESILIENCE_RESULT" == "skipped" ]; then
            echo "| Resilience Tests | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Resilience Tests | :x: $RESILIENCE_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          # Frontend Tests
          if [ "$FRONTEND_RESULT" == "success" ]; then
            echo "| Frontend Tests | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$FRONTEND_RESULT" == "skipped" ]; then
            echo "| Frontend Tests | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend Tests | :x: $FRONTEND_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          # Security Scan
          if [ "$SECURITY_RESULT" == "success" ]; then
            echo "| Security Scan | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$SECURITY_RESULT" == "skipped" ]; then
            echo "| Security Scan | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Scan | :x: $SECURITY_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          # API Contract Tests
          if [ "$CONTRACT_RESULT" == "success" ]; then
            echo "| API Contract Tests | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$CONTRACT_RESULT" == "skipped" ]; then
            echo "| API Contract Tests | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| API Contract Tests | :x: $CONTRACT_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** \`$GH_WORKFLOW\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`$GH_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$GH_SHA\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical tests failed
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          # Only fail on truly critical tests (unit, frontend, security)
          # Integration tests have continue-on-error so they don't block
          if [ "$UNIT_RESULT" == "failure" ] || \
             [ "$FRONTEND_RESULT" == "failure" ] || \
             [ "$SECURITY_RESULT" == "failure" ]; then
            echo "One or more critical test suites failed!"
            exit 1
          fi
