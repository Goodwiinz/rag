name: Test Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DOCKER_BUILDKIT: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash

jobs:
  # ==========================================================================
  # Code Quality Checks (Fast - Run First)
  # ==========================================================================
  lint-backend:
    name: Lint Backend
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build lint image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: backend/docker/Dockerfile.lint
          load: true
          tags: rag-lint:ci
          cache-from: type=gha,scope=lint-backend
          cache-to: type=gha,mode=max,scope=lint-backend

      - name: Run Ruff (linting)
        run: docker run --rm rag-lint:ci ruff check backend/src --output-format=github

      - name: Run Black (formatting check)
        run: docker run --rm rag-lint:ci black --check backend/src
        continue-on-error: true  # Allow failures during gradual adoption

      - name: Run isort (import sorting)
        run: docker run --rm rag-lint:ci isort --check-only backend/src
        continue-on-error: true  # Allow failures during gradual adoption

      - name: Run MyPy (type checking)
        run: docker run --rm rag-lint:ci mypy backend/src --ignore-missing-imports
        continue-on-error: true  # Allow failures during gradual adoption

  lint-frontend:
    name: Lint Frontend
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run type check
        run: npm run type-check

      - name: Run linting
        run: npm run lint
        continue-on-error: true  # Allow warnings during gradual adoption

  # ==========================================================================
  # Unit Tests (Fast - No External Dependencies)
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    continue-on-error: true  # TODO: remove once 145 pre-existing test failures are fixed
    needs: lint-backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-test-deps: 'true'

      - name: Run unit tests
        run: |
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "unit or not (integration or e2e or slow)" \
            --cov=backend/src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=8 \
            -n auto \
            -v
        # Note: Coverage threshold set to 70% for unit tests
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///:memory:"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@1f60566a86da84c4b4b64c17662a90de97fbb8d7 # v5.4.2
        with:
          files: coverage.xml
          flags: unit
          name: unit-tests

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    needs: lint-backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-test-deps: 'false'

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit (Python security)
        run: bandit -r backend/src -ll -ii -x tests
        continue-on-error: true  # Allow failures while security issues are addressed

      - name: Run Safety (dependency vulnerabilities)
        run: safety check -r backend/requirements.txt
        continue-on-error: true  # Allow failures for unmaintained packages

  # ==========================================================================
  # Frontend Tests
  # ==========================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    continue-on-error: true  # TODO: remove once 15 pre-existing test failures are fixed
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Upload coverage
        uses: codecov/codecov-action@1f60566a86da84c4b4b64c17662a90de97fbb8d7 # v5.4.2
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-tests

  # ==========================================================================
  # Integration Tests (Require Services)
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    continue-on-error: true  # Don't block workflow if integration tests fail/timeout
    needs: [unit-tests, frontend-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-test-deps: 'false'

      - name: Run integration tests
        run: |
          set +e
          pytest backend/tests/integration/ \
            -c backend/pytest.ini \
            -m "integration" \
            --cov=backend/src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
          exit_code=$?
          set -e

          if [ "$exit_code" = "5" ]; then
            echo "No integration tests found - skipping"
            exit 0
          fi

          exit "$exit_code"
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/test_db"
          REDIS_URL: "redis://localhost:${{ job.services.redis.ports['6379'] }}/0"

      - name: Upload coverage
        uses: codecov/codecov-action@1f60566a86da84c4b4b64c17662a90de97fbb8d7 # v5.4.2
        with:
          files: coverage.xml
          flags: integration
          name: integration-tests

  # ==========================================================================
  # Resilience Tests
  # ==========================================================================
  resilience-tests:
    name: Resilience Tests
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    continue-on-error: true  # Non-critical in PR checks; don't block merges
    needs: unit-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-test-deps: 'true'

      - name: Run resilience tests
        run: |
          set +e
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "resilience" \
            --cov=backend/src/core \
            --cov-report=xml \
            -v
          exit_code=$?
          set -e

          if [ "$exit_code" = "5" ]; then
            echo "No resilience tests found - skipping"
            exit 0
          fi

          exit "$exit_code"
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///:memory:"

      - name: Upload coverage
        uses: codecov/codecov-action@1f60566a86da84c4b4b64c17662a90de97fbb8d7 # v5.4.2
        with:
          files: coverage.xml
          flags: resilience
          name: resilience-tests

  # ==========================================================================
  # API Contract Tests
  # ==========================================================================
  api-contract-tests:
    name: API Contract Tests
    runs-on: [self-hosted, linux]
    continue-on-error: true  # Non-critical in PR checks; don't block merges
    needs: [unit-tests, frontend-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-test-deps: 'false'

      - name: Install schemathesis
        run: pip install schemathesis

      - name: Run contract tests
        run: |
          pytest backend/tests/api_contract/ \
            -c backend/pytest.ini \
            -v
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/test_db"
        continue-on-error: true  # Allow failures during development

  # ==========================================================================
  # E2E Tests (Full System)
  # ==========================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    continue-on-error: true  # Non-critical in PR checks; don't block merges
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build backend image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: backend/docker/Dockerfile.prod
          load: true
          tags: rag-backend:test
          build-args: |
            PYTHON_VERSION=3.11
            TORCH_CPU_ONLY=true
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,mode=max,scope=e2e-backend

      - name: Build frontend image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: frontend/Dockerfile.prod
          load: true
          tags: rag-frontend:test
          cache-from: type=gha,scope=e2e-frontend
          cache-to: type=gha,mode=max,scope=e2e-frontend

      - name: Start infrastructure services
        run: |
          docker compose -p rag_system -f docker-compose.ci.yml up -d postgres redis

          # Wait for infrastructure to be healthy
          echo "Waiting for infrastructure services..."
          timeout 60 bash -c 'until docker compose -p rag_system -f docker-compose.ci.yml ps | grep -E "(healthy)" | wc -l | grep -q "2"; do sleep 3; done'

      - name: Start application services
        run: |
          # Start backend with pre-built image
          docker run -d --name backend-e2e \
            --network rag_system_ci-network \
            --network-alias backend \
            -p 8000:8000 \
            -e DATABASE_URL=postgresql://test:test@postgres:5432/test_db \
            -e REDIS_URL=redis://redis:6379/0 \
            -e ENVIRONMENT=testing \
            -e SECRET_KEY=ci-test-secret-key-32-characters! \
            -e JWT_SECRET_KEY=ci-test-jwt-secret-key-32chars! \
            -e CORS_ORIGINS=http://localhost:3000,http://frontend:3000 \
            -e ENABLE_AI_PROCESSING=false \
            rag-backend:test

          # Start frontend with pre-built image
          docker run -d --name frontend-e2e \
            --network rag_system_ci-network \
            --network-alias frontend \
            -p 3000:3000 \
            -e BACKEND_URL=http://backend-e2e:8000 \
            -e NEXT_PUBLIC_API_URL=http://localhost:8000 \
            rag-frontend:test

          # Wait for services to be ready
          echo "Waiting for application services..."
          for attempt in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy on attempt $attempt"
              break
            fi
            sleep 3
          done

          for attempt in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is healthy on attempt $attempt"
              break
            fi
            sleep 3
          done

      - name: Verify services are accessible
        run: |
          echo "Checking backend health..."
          curl -f http://localhost:8000/health || exit 1

          echo "Checking frontend..."
          curl -f http://localhost:3000 || exit 1

      - name: Run E2E Tests
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Determine which tests to run based on event type
          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "Running smoke tests for PR..."
            docker compose -p rag_system -f docker-compose.ci.yml --profile smoke run --rm --no-deps smoke-tests
          else
            echo "Running full E2E tests..."
            docker compose -p rag_system -f docker-compose.ci.yml --profile e2e run --rm --no-deps e2e-tests
          fi

      - name: Upload E2E test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-test-results
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker logs backend-e2e --tail=100 2>&1 || true
          echo ""
          echo "=== Frontend Logs ==="
          docker logs frontend-e2e --tail=100 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker stop backend-e2e frontend-e2e 2>/dev/null || true
          docker rm backend-e2e frontend-e2e 2>/dev/null || true
          docker compose -p rag_system -f docker-compose.ci.yml down -v --remove-orphans

  # ==========================================================================
  # Performance Tests (Main Branch Only)
  # ==========================================================================
  performance-tests:
    name: Performance Tests
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    continue-on-error: true  # Non-critical in PR checks; don't block merges
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432/tcp

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-test-deps: 'true'

      - name: Install performance test tools
        run: pip install pytest-benchmark locust

      - name: Run performance tests
        run: |
          pytest backend/tests/ \
            -c backend/pytest.ini \
            -m "slow or scalability" \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            -v
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/test_db"

      - name: Store benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: benchmark.json

  # ==========================================================================
  # Test Summary
  # ==========================================================================
  test-summary:
    name: Test Summary
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    needs: [unit-tests, integration-tests, resilience-tests, frontend-tests, security-scan, api-contract-tests]
    if: always()
    env:
      UNIT_RESULT: ${{ needs.unit-tests.result }}
      INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
      RESILIENCE_RESULT: ${{ needs.resilience-tests.result }}
      FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
      SECURITY_RESULT: ${{ needs.security-scan.result }}
      CONTRACT_RESULT: ${{ needs.api-contract-tests.result }}
      GH_WORKFLOW: ${{ github.workflow }}
      GH_REF: ${{ github.ref_name }}
      GH_SHA: ${{ github.sha }}
    steps:
      - name: Generate test results summary
        run: |
          {
            echo "## Test Results Summary"
            echo ""
            echo "| Test Suite | Status |"
            echo "|------------|--------|"

            # Unit Tests
            if [ "$UNIT_RESULT" = "success" ]; then
              echo "| Unit Tests | :white_check_mark: Passed |"
            elif [ "$UNIT_RESULT" = "skipped" ]; then
              echo "| Unit Tests | :fast_forward: Skipped |"
            else
              echo "| Unit Tests | :x: $UNIT_RESULT |"
            fi

            # Integration Tests
            if [ "$INTEGRATION_RESULT" = "success" ]; then
              echo "| Integration Tests | :white_check_mark: Passed |"
            elif [ "$INTEGRATION_RESULT" = "skipped" ]; then
              echo "| Integration Tests | :fast_forward: Skipped |"
            else
              echo "| Integration Tests | :x: $INTEGRATION_RESULT |"
            fi

            # Resilience Tests
            if [ "$RESILIENCE_RESULT" = "success" ]; then
              echo "| Resilience Tests | :white_check_mark: Passed |"
            elif [ "$RESILIENCE_RESULT" = "skipped" ]; then
              echo "| Resilience Tests | :fast_forward: Skipped |"
            else
              echo "| Resilience Tests | :x: $RESILIENCE_RESULT |"
            fi

            # Frontend Tests
            if [ "$FRONTEND_RESULT" = "success" ]; then
              echo "| Frontend Tests | :white_check_mark: Passed |"
            elif [ "$FRONTEND_RESULT" = "skipped" ]; then
              echo "| Frontend Tests | :fast_forward: Skipped |"
            else
              echo "| Frontend Tests | :x: $FRONTEND_RESULT |"
            fi

            # Security Scan
            if [ "$SECURITY_RESULT" = "success" ]; then
              echo "| Security Scan | :white_check_mark: Passed |"
            elif [ "$SECURITY_RESULT" = "skipped" ]; then
              echo "| Security Scan | :fast_forward: Skipped |"
            else
              echo "| Security Scan | :x: $SECURITY_RESULT |"
            fi

            # API Contract Tests
            if [ "$CONTRACT_RESULT" = "success" ]; then
              echo "| API Contract Tests | :white_check_mark: Passed |"
            elif [ "$CONTRACT_RESULT" = "skipped" ]; then
              echo "| API Contract Tests | :fast_forward: Skipped |"
            else
              echo "| API Contract Tests | :x: $CONTRACT_RESULT |"
            fi

            echo ""
            echo "**Workflow:** \`$GH_WORKFLOW\`"
            echo "**Branch:** \`$GH_REF\`"
            echo "**Commit:** \`$GH_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if critical tests failed
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          # Only fail on truly critical tests (unit, frontend, security)
          # Integration tests have continue-on-error so they don't block
          if [ "$UNIT_RESULT" == "failure" ] || \
             [ "$FRONTEND_RESULT" == "failure" ] || \
             [ "$SECURITY_RESULT" == "failure" ]; then
            echo "One or more critical test suites failed!"
            exit 1
          fi
