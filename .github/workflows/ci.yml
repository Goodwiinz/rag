name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/_temp/tools

jobs:
  lint:
    name: Lint & Format Check
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          # Create virtual environment to avoid PEP 668 restrictions
          python3 -m venv venv
          source venv/bin/activate
          python --version
          pip install --upgrade pip
          pip install flake8 black isort mypy
          if [ -f backend/requirements.dev.txt ]; then
            pip install -r backend/requirements.dev.txt
          fi
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/venv" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

      - name: Run flake8
        working-directory: backend
        run: |
          source $GITHUB_WORKSPACE/venv/bin/activate
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check black formatting
        working-directory: backend
        run: |
          source $GITHUB_WORKSPACE/venv/bin/activate
          black --check src tests || echo "::warning::Code is not formatted with black"

      - name: Check isort
        working-directory: backend
        run: |
          source $GITHUB_WORKSPACE/venv/bin/activate
          isort --check-only src tests || echo "::warning::Imports are not sorted"

  test:
    name: Run Tests
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          # Create virtual environment to avoid PEP 668 restrictions
          python3 -m venv venv
          source venv/bin/activate
          python --version
          pip install --upgrade pip
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/venv" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          brew install postgresql redis ffmpeg

      - name: Start PostgreSQL
        run: |
          brew services start postgresql
          # Create test database
          createdb testdb || true
          # Create test user
          createuser testuser || true
          psql -d testdb -c "ALTER USER testuser WITH PASSWORD 'testpass';" || true

      - name: Start Redis
        run: |
          brew services start redis

      - name: Install Python dependencies
        run: |
          source $GITHUB_WORKSPACE/venv/bin/activate
          pip install pytest pytest-cov pytest-asyncio
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          if [ -f backend/requirements.dev.txt ]; then
            pip install -r backend/requirements.dev.txt
          fi

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
        run: |
          source $GITHUB_WORKSPACE/venv/bin/activate
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Cleanup services
        if: always()
        run: |
          brew services stop postgresql || true
          brew services stop redis || true

  docker-build:
    name: Docker Build Test
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: rag-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          tags: rag-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          # Create virtual environment to avoid PEP 668 restrictions
          python3 -m venv venv
          source venv/bin/activate
          python --version
          pip install --upgrade pip
          pip install safety bandit
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/venv" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

      - name: Run safety check
        working-directory: backend
        run: |
          source $GITHUB_WORKSPACE/venv/bin/activate
          safety check --file requirements.txt --output text || true

      - name: Run bandit security scan
        working-directory: backend
        run: |
          source $GITHUB_WORKSPACE/venv/bin/activate
          bandit -r src -f json -o bandit-report.json || true
          bandit -r src -f screen

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: backend/bandit-report.json
