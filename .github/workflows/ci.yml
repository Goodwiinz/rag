name: CI/CD Pipeline

# ============================================================================
# WHEN THIS RUNS
# ============================================================================
# - On push to main or develop branches
# - On pull requests to main or develop
# - Manually via GitHub Actions UI (workflow_dispatch)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# ============================================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================================
# These are available to all jobs in this workflow
env:
  PYTHON_VERSION: '3.11'  # Python version to use across all jobs
  AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/_temp/tools  # /// Can be ignored - legacy setting

# ============================================================================
# JOBS - Each runs independently in parallel unless specified
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # JOB 1: LINTING & CODE QUALITY
  # --------------------------------------------------------------------------
  # Purpose: Check code formatting and style issues
  # Runs on: GitHub-hosted Ubuntu runner (free)
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python with pip caching for faster builds
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'  # Automatically caches pip packages

      # Step 3: Install linting tools
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
          # Install dev dependencies if they exist
          if [ -f backend/requirements.dev.txt ]; then
            pip install -r backend/requirements.dev.txt
          fi

      # Step 4: Check for critical Python errors
      # E9: Runtime errors, F63: Invalid syntax, F7: Syntax errors, F82: Undefined names
      - name: Run flake8
        working-directory: backend
        run: |
          # Critical errors - will fail the build
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style warnings - won't fail, just shows statistics
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 5: Check if code is formatted with black (Python formatter)
      # NOTE: Currently only warns, doesn't fail - see ci-improved.yml for strict version
      - name: Check black formatting
        working-directory: backend
        run: black --check src tests || echo "::warning::Code is not formatted with black"

      # Step 6: Check if imports are sorted properly
      # NOTE: Currently only warns, doesn't fail
      - name: Check isort
        working-directory: backend
        run: isort --check-only src tests || echo "::warning::Imports are not sorted"

  # --------------------------------------------------------------------------
  # JOB 2: AUTOMATED TESTING
  # --------------------------------------------------------------------------
  # Purpose: Run unit tests with code coverage
  # Dependencies: PostgreSQL and Redis (as Docker containers)
  # Runs on: GitHub-hosted Ubuntu runner
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # SERVICES - These run as Docker containers alongside the job
    # -------------------------------------------------------------------------
    # These are automatically started before steps and cleaned up after
    services:
      # PostgreSQL database service for testing
      postgres:
        image: postgres:14  # PostgreSQL version 14
        env:
          POSTGRES_USER: testuser      # Test database user
          POSTGRES_PASSWORD: testpass  # Test database password
          POSTGRES_DB: testdb          # Test database name
        options: >-
          --health-cmd pg_isready              # Command to check if DB is ready
          --health-interval 10s                # Check every 10 seconds
          --health-timeout 5s                  # Timeout after 5 seconds
          --health-retries 5                   # Retry 5 times before failing
        ports:
          - 5432:5432  # Map container port 5432 to host port 5432

      # Redis cache service for testing
      redis:
        image: redis:7  # Redis version 7
        options: >-
          --health-cmd "redis-cli ping"  # Command to check if Redis is ready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379  # Map container port 6379 to host port 6379

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python with pip caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'  # Caches pip packages for faster subsequent runs

      # Step 3: Install system-level dependencies
      # ffmpeg: For video/audio processing
      # tesseract-ocr: For OCR (Optical Character Recognition)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr

      # Step 4: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install testing frameworks
          pip install pytest pytest-cov pytest-asyncio
          # Install project dependencies
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          # Install dev dependencies (includes additional test utilities)
          if [ -f backend/requirements.dev.txt ]; then
            pip install -r backend/requirements.dev.txt
          fi

      # Step 5: Run tests with coverage measurement
      - name: Run tests with coverage
        working-directory: backend  # Run from backend directory
        env:
          # Test environment variables
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci  # Fake secret key for testing
          ALGORITHM: HS256                     # JWT algorithm
        run: |
          pytest tests/ \
            -v \                              # Verbose output
            --cov=src \                       # Measure coverage of src directory
            --cov-report=xml \                # Generate XML report for Codecov
            --cov-report=term-missing         # Show missing lines in terminal

      # Step 6: Upload coverage to Codecov (optional)
      # /// This step is optional - only needed if you use Codecov.io
      # /// You can remove this if you don't have a Codecov account
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml   # Path to coverage report
          flags: unittests               # Tag for this upload
          name: codecov-umbrella         # Name for this upload
          fail_ci_if_error: false        # Don't fail if upload fails

  # --------------------------------------------------------------------------
  # JOB 3: DOCKER BUILD VALIDATION
  # --------------------------------------------------------------------------
  # /// This job is OPTIONAL if you don't use Docker for deployment
  # /// See DOCKER_OR_NOT.md to decide if you need this
  # Purpose: Verify Docker images can be built successfully
  # Doesn't push images, just validates the build process
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (advanced Docker builder)
      # Enables features like multi-platform builds and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build the backend API Docker image
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend              # Build context directory
          file: ./backend/Dockerfile      # Dockerfile location
          push: false                     # Don't push to registry (just test build)
          tags: rag-backend:test          # Tag for the built image
          cache-from: type=gha            # Use GitHub Actions cache to speed up builds
          cache-to: type=gha,mode=max     # Save build cache for next run

      # Step 4: Build the worker (Celery) Docker image
      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          tags: rag-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # JOB 4: SECURITY SCANNING
  # --------------------------------------------------------------------------
  # Purpose: Check for security vulnerabilities in dependencies and code
  # Runs: safety (dependency vulnerabilities) and bandit (code security issues)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Step 3: Install security scanning tools
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit  # safety: dependency checker, bandit: code scanner

      # Step 4: Check for known vulnerabilities in dependencies
      # || true means don't fail the build if vulnerabilities found (just warn)
      # NOTE: For production, remove '|| true' to fail on vulnerabilities
      - name: Run safety check
        working-directory: backend
        run: safety check --file requirements.txt --output text || true

      # Step 5: Scan Python code for security issues
      - name: Run bandit security scan
        working-directory: backend
        run: |
          # Generate JSON report (|| true means don't fail on issues)
          bandit -r src -f json -o bandit-report.json || true
          # Show results on screen
          bandit -r src -f screen

      # Step 6: Upload security report as artifact
      # /// This is optional - only useful if you want to download/review reports
      # /// You can remove this if you don't need to save reports
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if previous steps failed
        with:
          name: bandit-security-report
          path: backend/bandit-report.json

# ============================================================================
# SUMMARY
# ============================================================================
# This CI/CD pipeline runs 4 jobs in parallel:
#
# 1. lint          - Code quality checks (required)
# 2. test          - Unit tests with coverage (required)
# 3. docker-build  - Docker build validation (/// optional if not using Docker)
# 4. security-scan - Security vulnerability checks (recommended)
#
# To make this stricter (fail on formatting issues), use ci-improved.yml instead
# To skip Docker, use ci-no-docker.yml instead
# ============================================================================
