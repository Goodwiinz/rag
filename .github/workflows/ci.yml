name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: multimodal-rag-system

jobs:
  # Code Quality Check
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort bandit safety mypy

    - name: Run Ruff linter
      run: ruff check backend/ --output-format=github || true

    - name: Run Black formatter check
      run: black --check --diff backend/ || true

    - name: Run isort import sorter check
      run: isort --check-only --diff backend/ || true

    - name: Run Bandit security scan
      run: bandit -r backend/ -f json -o bandit-report.json || true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

    - name: Run Safety security check
      run: safety check --json --output safety-report.json || true

    - name: Upload Safety report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: safety-report
        path: safety-report.json

    - name: Run MyPy type checking
      run: mypy backend/src/ --ignore-missing-imports --non-interactive || true

  # Frontend Quality Check
  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run ESLint
      run: |
        cd frontend
        npm run lint || true

    - name: Run TypeScript checking
      run: |
        cd frontend
        npm run type-check || true

  # Build and Test Backend
  build-test-backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    needs: [code-quality, frontend-quality]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multimodal_rag_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      neo4j:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/neo4jpassword
          NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 7474:7474
          - 7687:7687

      qdrant:
        image: qdrant/qdrant:v1.7.0
        options: >-
          --health-cmd "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
        ports:
          - 6333:6333

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt

    - name: Wait for services
      run: |
        python -c "
        import time
        import psycopg2
        import redis
        import neo4j

        # Wait for PostgreSQL
        while True:
            try:
                conn = psycopg2.connect(
                    host='localhost',
                    port=5432,
                    user='postgres',
                    password='postgres',
                    database='multimodal_rag_test'
                )
                conn.close()
                break
            except:
                time.sleep(2)

        # Wait for Redis
        while True:
            try:
                r = redis.Redis(host='localhost', port=6379, decode_responses=True)
                r.ping()
                break
            except:
                time.sleep(2)

        # Wait for Neo4j
        while True:
            try:
                driver = neo4j.driver('bolt://localhost:7687',
                                    auth=('neo4j', 'neo4jpassword'))
                driver.verify_connectivity()
                driver.close()
                break
            except:
                time.sleep(2)

        # Wait for Qdrant
        import requests
        while True:
            try:
                requests.get('http://localhost:6333/')
                break
            except:
                time.sleep(2)

        print('All services are ready')
        "

    - name: Run database migrations
      run: |
        cd backend
        python -c \"from alembic.config import Config; from alembic.command import upgrade; upgrade(Config('alembic.ini'), 'head')\" || true

    - name: Run unit tests
      run: |
        cd backend
        pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing || true

    - name: Run integration tests
      run: |
        cd backend
        pytest tests/integration/ -v --cov=src --cov-report=xml --cov-report=term-missing || true

    - name: Run component tests
      run: |
        cd backend
        pytest tests/component/ -v --cov=src --cov-report=xml --cov-report=term-missing || true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage
        path: backend/coverage.xml

    - name: Run RAG evaluation benchmarks
      run: |
        cd backend
        python -m src.evaluation.deepeval_runner || true

  # Build Docker Images
  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-test-backend]
    outputs:
      backend-image-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-image-digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build backend image
      id: build-backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile.websocket.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          WS_PORT=8001
          WS_HOST=0.0.0.0
          ENVIRONMENT=production
        platforms: linux/amd64,linux/arm64

    - name: Build frontend image
      id: build-frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Test WebSocket Connection
  test-websocket:
    name: Test WebSocket Connection
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install WebSocket testing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-websocket websockets || true

    - name: Run WebSocket integration tests
      run: |
        python -m pytest tests/websocket/ -v || true