name: Workflow Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin actionlint

      - name: Run actionlint
        env:
          SHELLCHECK_OPTS: "-e SC2086 -e SC2129"
        # Whole tree, always. The previous diff-only mode let breakage in
        # unchanged workflows (e.g. from a renamed composite action) ride
        # through untouched PRs.
        run: actionlint

      - name: Validate composite actions
        # actionlint only checks workflow files; composite action.yml files
        # were previously unvalidated entirely. Parse them and assert the
        # minimal contract (name + runs).
        run: |
          shopt -s nullglob
          status=0
          for f in .github/actions/*/action.yml .github/actions/*/action.yaml; do
            echo "Validating $f"
            python3 - "$f" <<'EOF' || status=1
          import sys, yaml
          d = yaml.safe_load(open(sys.argv[1]))
          assert isinstance(d, dict) and "runs" in d and "name" in d, "missing name/runs"
          EOF
          done
          exit "$status"
