name: GitOps Image Update

on:
  # Triggered after Docker images are built successfully
  workflow_run:
    workflows: ["Docker Build"]
    types:
      - completed
    branches:
      - main
      - develop

  # Manual trigger for promoting to production
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - promote-to-production
          - update-staging
      image_tag:
        description: "Image tag to deploy"
        required: true
        type: string

concurrency:
  group: gitops-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Auto-update staging image tags on develop
  # ─────────────────────────────────────────────
  update-staging:
    name: Update Staging Image Tags
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.action == 'update-staging')
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${COMMIT_SHA:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Update staging values
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VALUES_FILE="infrastructure/helm/knowledge-graph-analytics/values-staging.yaml"

          # Update backend image tag
          sed -i "s|^\(\s*tag:\s*\)\".*\"|\1\"$TAG\"|" "$VALUES_FILE"

          echo "Updated $VALUES_FILE with tag: $TAG"
          grep -A1 "repository:" "$VALUES_FILE" | head -8

      - name: Commit and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add infrastructure/helm/knowledge-graph-analytics/values-staging.yaml

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(gitops): update staging images to $TAG"
          git push origin develop

  # ─────────────────────────────────────────────
  # Promote staging tag to production (manual)
  # ─────────────────────────────────────────────
  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'promote-to-production'
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update production values
        env:
          TAG: ${{ github.event.inputs.image_tag }}
        run: |
          VALUES_FILE="infrastructure/helm/knowledge-graph-analytics/values-production.yaml"

          # Update image tags for both backend and frontend
          sed -i "s|^\(\s*tag:\s*\)\".*\"|\1\"$TAG\"|" "$VALUES_FILE"

          echo "Updated $VALUES_FILE with tag: $TAG"
          grep -A1 "repository:" "$VALUES_FILE" | head -8

      - name: Commit and push
        env:
          TAG: ${{ github.event.inputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add infrastructure/helm/knowledge-graph-analytics/values-production.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(gitops): promote $TAG to production"
          git push origin main

      - name: Notify — sync required
        env:
          TAG: ${{ github.event.inputs.image_tag }}
        run: |
          echo "## Production Image Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag \`$TAG\` committed to \`values-production.yaml\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next step:** Open ArgoCD and sync \`nous-production\` manually." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "argocd app sync nous-production" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
