name: Docker Build

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - "docker-bake.hcl"
      - ".github/workflows/docker-build.yml"

  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/ragsystemregistry
  SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com
  SPACES_BUCKET: rag-system-storage
  SPACES_REGION: nyc3

jobs:
  version:
    name: Generate Version Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Generate version
        id: version
        env:
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN: ${{ github.run_number }}
        run: |
          SHORT_SHA="${GH_SHA:0:7}"
          DATE="$(date -u +%Y%m%d)"
          VERSION="${GH_REF}-${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

  build-backend:
    name: Build Backend Image
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    needs: version

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to DO Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: backend/docker/Dockerfile.prod
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/backend:latest
            ${{ env.REGISTRY }}/backend:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
          build-args: |
            PYTHON_VERSION=3.11
            TORCH_CPU_ONLY=true
          cache-from: type=s3,bucket=${{ env.SPACES_BUCKET }},region=${{ env.SPACES_REGION }},endpoint_url=${{ env.SPACES_ENDPOINT }},prefix=buildcache/backend/
          cache-to: type=s3,bucket=${{ env.SPACES_BUCKET }},region=${{ env.SPACES_REGION }},endpoint_url=${{ env.SPACES_ENDPOINT }},prefix=buildcache/backend/,mode=max
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}

      # Trivy scan temporarily disabled: upstream aquasecurity/trivy-action@v0.28.0
      # depends on aquasecurity/setup-trivy@v0.2.1 which was removed from GitHub,
      # breaking action resolution at "Set up job". Re-enable with a fresh pin.

  build-frontend:
    name: Build Frontend Image
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    needs: version

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to DO Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: frontend/Dockerfile.prod
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/frontend:latest
            ${{ env.REGISTRY }}/frontend:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          # NEXT_PUBLIC_* are baked into the client bundle by Next.js at build
          # time — they're public-by-design, so build-args (not a secret mount)
          # is the correct channel. The Dockerfile reads them via matching ARGs.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            BACKEND_URL=http://nous-dev-knowledge-graph-analytics-backend.rag-dev.svc.cluster.local:80
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=s3,bucket=${{ env.SPACES_BUCKET }},region=${{ env.SPACES_REGION }},endpoint_url=${{ env.SPACES_ENDPOINT }},prefix=buildcache/frontend/
          cache-to: type=s3,bucket=${{ env.SPACES_BUCKET }},region=${{ env.SPACES_REGION }},endpoint_url=${{ env.SPACES_ENDPOINT }},prefix=buildcache/frontend/,mode=max
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}

      # Trivy scan temporarily disabled: see backend build for context.

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [version, build-backend, build-frontend]
    if: always()
    env:
      BACKEND_RESULT: ${{ needs.build-backend.result }}
      FRONTEND_RESULT: ${{ needs.build-frontend.result }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_REF: ${{ github.ref_name }}
      GH_SHA: ${{ github.sha }}
    steps:
      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY

          if [ "$BACKEND_RESULT" == "success" ]; then
            echo "| Backend | :white_check_mark: Pushed | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Backend | :x: $BACKEND_RESULT | - |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FRONTEND_RESULT" == "success" ]; then
            echo "| Frontend | :white_check_mark: Pushed | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend | :x: $FRONTEND_RESULT | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** registry.digitalocean.com/ragsystemregistry" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** $GH_REF" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** $GH_SHA" >> $GITHUB_STEP_SUMMARY
          echo "**Cache:** DO Spaces \`${{ env.SPACES_BUCKET }}\` (NYC3)" >> $GITHUB_STEP_SUMMARY
