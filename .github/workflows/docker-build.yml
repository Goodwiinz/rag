name: Docker Build

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - "docker-bake.hcl"
      - ".github/workflows/docker-build.yml"

  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/ragsystemregistry

jobs:
  version:
    name: Generate Version Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Generate version
        id: version
        env:
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN: ${{ github.run_number }}
        run: |
          SHORT_SHA="${GH_SHA:0:7}"
          DATE="$(date -u +%Y%m%d)"
          VERSION="${GH_REF}-${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DO Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/Dockerfile.prod
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/backend:latest
            ${{ env.REGISTRY }}/backend:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
          build-args: |
            PYTHON_VERSION=3.11
            TORCH_CPU_ONLY=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DO Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.prod
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/frontend:latest
            ${{ env.REGISTRY }}/frontend:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_WS_URL=
            BACKEND_URL=http://nous-dev-knowledge-graph-analytics-backend.rag-dev.svc.cluster.local:80
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [version, build-backend, build-frontend]
    if: always()
    env:
      BACKEND_RESULT: ${{ needs.build-backend.result }}
      FRONTEND_RESULT: ${{ needs.build-frontend.result }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_REF: ${{ github.ref_name }}
      GH_SHA: ${{ github.sha }}
    steps:
      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY

          if [ "$BACKEND_RESULT" == "success" ]; then
            echo "| Backend | :white_check_mark: Pushed | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Backend | :x: $BACKEND_RESULT | - |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FRONTEND_RESULT" == "success" ]; then
            echo "| Frontend | :white_check_mark: Pushed | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend | :x: $FRONTEND_RESULT | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** registry.digitalocean.com/ragsystemregistry" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** $GH_REF" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** $GH_SHA" >> $GITHUB_STEP_SUMMARY
