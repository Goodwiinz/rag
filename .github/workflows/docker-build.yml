name: Docker Build

on:
  # Trigger after test-pipeline succeeds on main/develop
  workflow_run:
    workflows: ["Test Pipeline"]
    types:
      - completed
    branches:
      - main
      - develop

  # Direct triggers for path changes
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - "docker-bake.hcl"
      - ".github/workflows/docker-build.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - "docker-bake.hcl"

  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry"
        type: boolean
        default: false

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # Skip build if triggered by failed test-pipeline
  check-tests:
    name: Check Test Results
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check if we should build
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # If triggered by workflow_run, check if tests passed
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            if [ "$WORKFLOW_CONCLUSION" != "success" ]; then
              echo "Test pipeline did not succeed, skipping build"
              echo "should_build=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "should_build=true" >> $GITHUB_OUTPUT

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: check-tests
    if: needs.check-tests.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For workflow_run, checkout the SHA from the triggering workflow
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=3.11
          cache-from: type=gha
          cache-to: type=gha,mode=min

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: check-tests
    if: needs.check-tests.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  build-all-services:
    name: Build All Services (Bake)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all services with Docker Bake
        uses: docker/bake-action@v4
        with:
          files: docker-bake.hcl
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min

  # Test images after build (on PRs)
  test-images:
    name: Test Built Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'pull_request'

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load backend for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/docker/Dockerfile.prod
          load: true
          tags: backend:test
          cache-from: type=gha

      - name: Build and load frontend for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile.prod
          load: true
          tags: frontend:test
          cache-from: type=gha

      - name: Test backend container starts
        run: |
          docker run -d --name backend-test -p 8000:8000 \
            -e ENVIRONMENT=testing \
            -e DATABASE_URL=sqlite:///:memory: \
            -e SECRET_KEY=test-secret-key-32-characters!! \
            -e JWT_SECRET_KEY=test-jwt-secret-key-32chars!! \
            backend:test

          # Wait for container to be ready
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Backend failed to start"
              docker logs backend-test
              exit 1
            fi
            sleep 2
          done

          docker logs backend-test
          docker stop backend-test

      - name: Test frontend container starts
        run: |
          docker run -d --name frontend-test -p 3000:3000 \
            -e NEXT_PUBLIC_API_URL=http://localhost:8000 \
            frontend:test

          # Wait for container to be ready
          echo "Waiting for frontend to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Frontend is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Frontend failed to start"
              docker logs frontend-test
              exit 1
            fi
            sleep 2
          done

          docker logs frontend-test
          docker stop frontend-test

  # Build summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-all-services]
    if: always() && github.event_name != 'pull_request'
    env:
      BACKEND_RESULT: ${{ needs.build-backend.result }}
      FRONTEND_RESULT: ${{ needs.build-frontend.result }}
      BAKE_RESULT: ${{ needs.build-all-services.result }}
      GH_REF: ${{ github.ref_name }}
      GH_SHA: ${{ github.sha }}
    steps:
      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "$BACKEND_RESULT" == "success" ]; then
            echo "| Backend | :white_check_mark: Built |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BACKEND_RESULT" == "skipped" ]; then
            echo "| Backend | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Backend | :x: $BACKEND_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FRONTEND_RESULT" == "success" ]; then
            echo "| Frontend | :white_check_mark: Built |" >> $GITHUB_STEP_SUMMARY
          elif [ "$FRONTEND_RESULT" == "skipped" ]; then
            echo "| Frontend | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend | :x: $FRONTEND_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BAKE_RESULT" == "success" ]; then
            echo "| All Services (Bake) | :white_check_mark: Built |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BAKE_RESULT" == "skipped" ]; then
            echo "| All Services (Bake) | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| All Services (Bake) | :x: $BAKE_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`$GH_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$GH_SHA\`" >> $GITHUB_STEP_SUMMARY
