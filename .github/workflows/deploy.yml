name: Deploy to DigitalOcean Kubernetes

on:
  # Auto-deploy after successful Docker build on main
  workflow_run:
    workflows: ["Docker Build"]
    types:
      - completed
    branches:
      - main

  # Manual deploy with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag to deploy (default: latest commit SHA)"
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false  # Don't cancel ongoing deploys

env:
  REGISTRY: ghcr.io
  HELM_CHART_PATH: infrastructure/helm/knowledge-graph-analytics
  CLUSTER_NAME: rag-cluster  # Update with your cluster name

jobs:
  # Gate: Only deploy if Docker build succeeded
  check-build:
    name: Check Build Status
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      image_tag: ${{ steps.check.outputs.image_tag }}
    steps:
      - name: Check if we should deploy
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            if [ "$WORKFLOW_CONCLUSION" != "success" ]; then
              echo "Docker build did not succeed, skipping deploy"
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # Determine image tag
          if [ -n "$INPUT_TAG" ]; then
            echo "image_tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${COMMIT_SHA:0:7}" >> $GITHUB_OUTPUT
          fi
          
          echo "should_deploy=true" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: check-build
    if: |
      needs.check-build.outputs.should_deploy == 'true' && 
      (github.event.inputs.environment == 'staging' || github.event_name == 'workflow_run')
    environment:
      name: staging
      url: https://staging.yourdomain.com
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.13.0"

      - name: Log in to Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ needs.check-build.outputs.image_tag }}
        run: |
          helm upgrade --install rag-staging ${{ env.HELM_CHART_PATH }} \
            --namespace rag-staging \
            --create-namespace \
            --set global.environment=staging \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ github.repository }}/frontend \
            --set frontend.image.tag=$IMAGE_TAG \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ github.repository }}/backend \
            --set backend.image.tag=$IMAGE_TAG \
            --set frontend.replicaCount=1 \
            --set backend.replicaCount=1 \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/rag-staging-backend -n rag-staging --timeout=5m
          kubectl rollout status deployment/rag-staging-frontend -n rag-staging --timeout=5m

      - name: Run smoke tests
        run: |
          # Get staging ingress URL
          STAGING_URL=$(kubectl get ingress -n rag-staging -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || echo "")
          
          if [ -n "$STAGING_URL" ]; then
            echo "Running smoke tests against https://$STAGING_URL"
            curl -sf "https://$STAGING_URL/api/health" || echo "Health check pending..."
          else
            echo "No ingress found, checking service directly..."
            kubectl port-forward svc/rag-staging-backend 8000:8000 -n rag-staging &
            sleep 5
            curl -sf http://localhost:8000/health || echo "Health check pending..."
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [check-build, deploy-staging]
    if: |
      needs.check-build.outputs.should_deploy == 'true' && 
      github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://yourdomain.com
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.13.0"

      - name: Create backup before deploy
        run: |
          echo "Creating pre-deploy backup..."
          kubectl get all -n rag-production -o yaml > pre-deploy-backup.yaml || true
          
      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ needs.check-build.outputs.image_tag }}
        run: |
          helm upgrade --install rag-production ${{ env.HELM_CHART_PATH }} \
            --namespace rag-production \
            --create-namespace \
            --set global.environment=production \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ github.repository }}/frontend \
            --set frontend.image.tag=$IMAGE_TAG \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ github.repository }}/backend \
            --set backend.image.tag=$IMAGE_TAG \
            --set frontend.replicaCount=3 \
            --set backend.replicaCount=3 \
            --set backend.autoscaling.enabled=true \
            --set backend.autoscaling.minReplicas=3 \
            --set backend.autoscaling.maxReplicas=10 \
            --wait \
            --timeout 15m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/rag-production-backend -n rag-production --timeout=10m
          kubectl rollout status deployment/rag-production-frontend -n rag-production --timeout=10m

      - name: Run production health checks
        run: |
          PROD_URL=$(kubectl get ingress -n rag-production -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || echo "")
          
          if [ -n "$PROD_URL" ]; then
            echo "Running health checks against https://$PROD_URL"
            
            # Health endpoint
            curl -sf "https://$PROD_URL/api/health" || exit 1
            
            # Ready endpoint
            curl -sf "https://$PROD_URL/api/ready" || echo "Ready check not implemented"
            
            echo "Production deployment verified!"
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.run_id }}
          path: pre-deploy-backup.yaml
          retention-days: 7

  # Rollback job (manual trigger only)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.event.inputs.environment == 'production'
    needs: deploy-production
    environment: production
    
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Rollback Helm release
        run: |
          echo "Rolling back production deployment..."
          helm rollback rag-production -n rag-production
          
          kubectl rollout status deployment/rag-production-backend -n rag-production --timeout=5m
          kubectl rollout status deployment/rag-production-frontend -n rag-production --timeout=5m
          
          echo "Rollback complete!"

  # Deploy summary
  deploy-summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    env:
      STAGING_RESULT: ${{ needs.deploy-staging.result }}
      PROD_RESULT: ${{ needs.deploy-production.result }}
      IMAGE_TAG: ${{ needs.check-build.outputs.image_tag }}
    steps:
      - name: Generate summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "$STAGING_RESULT" == "success" ]; then
            echo "| Staging | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$STAGING_RESULT" == "skipped" ]; then
            echo "| Staging | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Staging | ❌ $STAGING_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$PROD_RESULT" == "success" ]; then
            echo "| Production | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$PROD_RESULT" == "skipped" ]; then
            echo "| Production | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Production | ❌ $PROD_RESULT |" >> $GITHUB_STEP_SUMMARY
          fi
