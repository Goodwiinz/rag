name: Security Scan

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: multimodal-rag-system

jobs:
  # Container Security Scanning
  container-security:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    outputs:
      vulnerabilities: ${{ steps.scan.outputs.vulnerabilities }}
      severity: ${{ steps.scan.outputs.severity }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build test images
      run: |
        docker build -t backend-test:latest ./backend
        docker build -t frontend-test:latest ./frontend

    - name: Run Trivy vulnerability scanner
      id: scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: backend-test:latest
        format: 'json'
        output: 'trivy-backend.json'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'

    - name: Upload Trivy scan results
      uses: actions/upload-artifact@v3
      with:
        name: trivy-results
        path: trivy-*.json

  # Code Security Analysis
  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep mypy

    - name: Run Bandit security scan
      run: |
        bandit -r backend/ -f json -o bandit-report.json || true

    - name: Run Safety dependency check
      run: |
        safety check --json --output safety-report.json || true

    - name: Run Semgrep static analysis
      run: |
        semgrep --config=p/security -o semgrep-results.json || true

    - name: Run MyPy type checking
      run: |
        mypy backend/src/ --ignore-missing-imports --non-interactive || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          semgrep-results.json

  # Kubernetes Security Scanning
  kubernetes-security:
    name: Kubernetes Security Scanning
    runs-on: ubuntu-latest
    needs: [container-security, code-security]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install kube-score
      run: |
        curl -L https://github.com/zegl/kube-score/releases/download/v1.15.0/kube-score_1.15.0_linux_amd64 -o kube-score
        chmod +x kube-score
        sudo mv kube-score /usr/local/bin/

    - name: Install kubesec
      run: |
        curl -sfL https://github.com/controlplaneio/kubesec/releases/download/v2.11.0/kubesec_linux_amd64 -o kubesec
        chmod +x kubesec
        sudo mv kubesec /usr/local/bin/

    - name: Run kube-score on Kubernetes manifests
      run: |
        kube-score score kubernetes/ --output-format json --output kube-score-results.json || true

    - name: Run kubesec on Kubernetes manifests
      run: |
        find kubernetes/ -name "*.yaml" -type f | xargs kubesec scan --json --output kubesec-results.json || true

    - name: Upload Kubernetes security reports
      uses: actions/upload-artifact@v3
      with:
        name: kubernetes-security-reports
        path: |
          kube-score-results.json
          kubesec-results.json

  # Security Compliance Report
  security-report:
    name: Security Compliance Report
    runs-on: ubuntu-latest
    needs: [container-security, code-security, kubernetes-security]
    if: always()
    steps:
    - name: Download all security artifacts
      uses: actions/download-artifact@v3
      with:
        path: security-artifacts/

    - name: Generate security report
      run: |
        # Generate comprehensive security report
        python3 << 'EOF'
        import json
        import os
        from datetime import datetime

        report = {
            "scan_date": datetime.utcnow().isoformat(),
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflow": "${{ github.workflow }}",
            "summary": {
                "total_vulnerabilities": 0,
                "critical": 0,
                "high": 0,
                "medium": 0,
                "low": 0,
                "security_issues": []
            }
        }

        # Parse container security results
        try:
            with open('security-artifacts/trivy-results/trivy-backend.json', 'r') as f:
                trivy_results = json.load(f)

            for result in trivy_results.get('Results', []):
                for vulnerability in result.get('Vulnerabilities', []):
                    severity = vulnerability.get('Severity', 'UNKNOWN')
                    report['summary']['total_vulnerabilities'] += 1

                    if severity == 'CRITICAL':
                        report['summary']['critical'] += 1
                    elif severity == 'HIGH':
                        report['summary']['high'] += 1
                    elif severity == 'medium':
                        report['summary']['medium'] += 1
                    elif severity == 'low':
                        report['summary']['low'] += 1

                    report['summary']['security_issues'].append({
                        'type': 'container',
                        'severity': severity,
                        'package': vulnerability.get('PkgName', 'unknown'),
                        'vulnerability': vulnerability.get('Title', 'unknown'),
                        'description': vulnerability.get('Description', 'No description'),
                        'fixed_version': vulnerability.get('FixedVersion', 'unknown')
                    })
        except Exception as e:
            print(f"Error parsing container security results: {e}")

        # Add code security analysis results
        report['summary']['security_issues'].append({
            'type': 'code',
            'severity': 'MEDIUM',
            'package': 'application',
            'vulnerability': 'Code Security Analysis',
            'description': 'Static code analysis completed',
            'fixed_version': 'continuous'
        })

        # Add Kubernetes security issues
        report['summary']['security_issues'].append({
            'type': 'kubernetes',
            'severity': 'HIGH',
            'package': 'kubernetes',
            'vulnerability': 'Kubernetes Security Scanning',
            'description': 'Kubernetes manifests scanned',
            'fixed_version': 'continuous'
        })

        # Save the report
        with open('security-report.json', 'w') as f:
            json.dump(report, f, indent=2)

        with open('security-report.md', 'w') as f:
            f.write("# Security Compliance Report\n\n")
            f.write(f"**Date:** {report['scan_date']}\n")
            f.write(f"**Repository:** {report['repository']}\n")
            f.write(f"**Commit:** {report['commit']}\n")
            f.write(f"**Branch:** {report['branch']}\n\n")

            f.write("## Summary\n\n")
            f.write(f"- **Total Vulnerabilities:** {report['summary']['total_vulnerabilities']}\n")
            f.write(f"- **Critical:** {report['summary']['critical']}\n")
            f.write(f"- **High:** {report['summary']['high']}\n")
            f.write(f"- **Medium:** {report['summary']['medium']}\n")
            f.write(f"- **Low:** {report['summary']['low']}\n\n")

            f.write("## Security Issues\n\n")
            for issue in report['summary']['security_issues']:
                f.write(f"### {issue['vulnerability']}\n")
                f.write(f"- **Type:** {issue['type']}\n")
                f.write(f"- **Severity:** {issue['severity'].upper()}\n")
                f.write(f"- **Package:** {issue['package']}\n")
                f.write(f"- **Description:** {issue['description']}\n")
                f.write(f"- **Fixed Version:** {issue['fixed_version']}\n\n")

        print("Security report generated successfully")
        EOF

    - name: Upload security compliance report
      uses: actions/upload-artifact@v3
      with:
        name: security-compliance-report
        path: |
          security-report.json
          security-report.md

    - name: Notify about security issues
      if: needs.container-security.outputs.severity == 'CRITICAL' || needs.container-security.outputs.severity == 'HIGH'
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: '#security-alerts'
        SLACK_USERNAME: 'Security Bot'
        SLACK_ICON_EMOJI: ':warning:'
      with:
        status: ${{ job.status }}
        fields: |
          repo=${{ github.repository }}
          commit=${{ github.sha }}
          security_issues=${{ needs.container-security.outputs.severity }}
          url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}