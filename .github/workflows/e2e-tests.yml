name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - accessibility
          - performance
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - development

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
  BASE_URL: ${{ vars.BASE_URL || 'http://localhost:3000' }}

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-install:
    name: Lint and Install Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate cache key
        id: cache-key
        run: echo "key=e2e-${{ hashFiles('frontend/package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting
        run: npm run lint
        continue-on-error: true  # Allow warnings during gradual adoption (matches test-pipeline.yml)

      - name: Type check
        run: npm run type-check

  install-playwright:
    name: Install Playwright Browsers
    runs-on: ubuntu-latest
    needs: lint-and-install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ needs.lint-and-install.outputs.cache-key }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps

  e2e-smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [lint-and-install, install-playwright]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        shard: [1, 2]
    env:
      CI: true
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ needs.lint-and-install.outputs.cache-key }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --grep="smoke" \
            --shard=${{ matrix.shard }}/2 \
            --reporter=json,html,junit \
            --output-dir=test-results/smoke

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            test-results/smoke/
          retention-days: 3

      - name: Upload smoke test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-screenshots-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: test-results/smoke/
          retention-days: 3

  e2e-regression-tests:
    name: E2E Regression Tests
    runs-on: ubuntu-latest
    needs: [lint-and-install, install-playwright, e2e-smoke-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    env:
      CI: true
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ needs.lint-and-install.outputs.cache-key }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run regression tests
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --grep="regression" \
            --shard=${{ matrix.shard }}/3 \
            --reporter=json,html,junit \
            --output-dir=test-results/regression

      - name: Upload regression test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-test-results-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            test-results/regression/
          retention-days: 7

      - name: Upload regression test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-screenshots-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: test-results/regression/
          retention-days: 7

  e2e-accessibility-tests:
    name: E2E Accessibility Tests
    runs-on: ubuntu-latest
    needs: [lint-and-install, install-playwright]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      CI: true
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ needs.lint-and-install.outputs.cache-key }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: |
          npx playwright test \
            --project=accessibility \
            --reporter=json,html,junit \
            --output-dir=test-results/accessibility

      - name: Process accessibility results
        run: |
          node scripts/process-accessibility-results.js test-results/accessibility/results.json

      - name: Upload accessibility test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-test-results
          path: |
            test-results/accessibility/
          retention-days: 7

      - name: Accessibility violation comment
        if: failure()
        run: |
          COUNT=$(node -e "
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('test-results/accessibility/results.json', 'utf8'));
              console.log(results.violations ? results.violations.length : 0);
            } catch (e) {
              console.log(0);
            }
          ")
          echo "VIOLATION_COUNT=$COUNT" >> $GITHUB_ENV

      - name: Create accessibility comment
        if: failure() && env.VIOLATION_COUNT != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const violationCount = process.env.VIOLATION_COUNT;
            const message = `## 🚨 Accessibility Violations Found\n\nFound ${violationCount} accessibility violations that need to be addressed.\n\nPlease review the test results and fix the violations before merging.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  e2e-performance-tests:
    name: E2E Performance Tests
    runs-on: ubuntu-latest
    needs: [lint-and-install, install-playwright]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      CI: true
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ needs.lint-and-install.outputs.cache-key }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run performance tests
        run: |
          npx playwright test \
            --project=performance \
            --reporter=json,html,junit \
            --output-dir=test-results/performance

      - name: Process performance results
        run: |
          node scripts/process-performance-results.js test-results/performance/results.json

      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: |
            test-results/performance/
          retention-days: 7

      - name: Performance regression check
        run: |
          node scripts/check-performance-regression.js test-results/performance/results.json

  test-report-summary:
    name: Test Report Summary
    runs-on: ubuntu-latest
    needs: [e2e-smoke-tests, e2e-regression-tests, e2e-accessibility-tests, e2e-performance-tests]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: all-test-results/

      - name: Generate test summary
        run: |
          node scripts/generate-test-summary.js all-test-results/

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-report
          path: test-summary.html
          retention-days: 30

      - name: Extract test metrics
        id: test-metrics
        run: |
          TOTAL=$(node -e "
            const fs = require('fs');
            try {
              const content = fs.readFileSync('test-summary.html', 'utf8');
              const match = content.match(/Total Tests: (\d+)/);
              console.log(match ? match[1] : '0');
            } catch (e) {
              console.log('0');
            }
          ")
          PASSED=$(node -e "
            const fs = require('fs');
            try {
              const content = fs.readFileSync('test-summary.html', 'utf8');
              const match = content.match(/Passed: (\d+)/);
              console.log(match ? match[1] : '0');
            } catch (e) {
              console.log('0');
            }
          ")
          FAILED=$(node -e "
            const fs = require('fs');
            try {
              const content = fs.readFileSync('test-summary.html', 'utf8');
              const match = content.match(/Failed: (\d+)/);
              console.log(match ? match[1] : '0');
            } catch (e) {
              console.log('0');
            }
          ")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Comment test summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const totalTests = '${{ steps.test-metrics.outputs.total }}';
            const passedTests = '${{ steps.test-metrics.outputs.passed }}';
            const failedTests = '${{ steps.test-metrics.outputs.failed }}';

            const comment = `## 📊 E2E Test Results Summary\n\n- **Total Tests**: ${totalTests}\n- **Passed**: ${passedTests} ✅\n- **Failed**: ${failedTests} ❌\n\n${failedTests > 0 ? 'Please review the failed tests and fix any issues before merging.' : 'All tests passed! 🎉'}\n\n[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [test-report-summary]
    if: always()
    steps:
      - name: Cleanup test artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            build-files
            smoke-test-results-*
            regression-test-results-*
            accessibility-test-results
            performance-test-results
          failOnError: false
