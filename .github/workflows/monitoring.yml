name: System Monitoring

on:
  schedule:
    # Run health checks every 15 minutes
    - cron: '*/15 * * * *'
    # Run performance tests twice daily
    - cron: '0 2,14 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install monitoring tools
      run: |
        sudo apt-get update
        sudo apt-get install -y curl jq

    - name: Check application health
      env:
        API_URL: ${{ secrets.STAGING_API_URL }}
      run: |
        echo "Checking API health"

        if [[ -n "$API_URL" ]]; then
          echo "API URL configured: checking health endpoint"

          # Create health check script
          cat > check_health.sh << 'EOF'
          #!/bin/bash
          API_URL="$1"

          response=$(curl -s -w "%{http_code}" --max-time 30 "${API_URL}/health" || echo "000")
          http_code="${response: -3}"

          if [[ "$http_code" == "200" ]]; then
            echo "✅ API is healthy (HTTP 200)"
            exit 0
          else
            echo "❌ API is unhealthy (HTTP $http_code)"
            exit 1
          fi
          EOF

          chmod +x check_health.sh
          ./check_health.sh "$API_URL"
        else
          echo "⚠️ No API URL configured - skipping health check"
        fi

    - name: Check database connectivity
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      run: |
        echo "Checking database connectivity"

        if [[ -n "$DATABASE_URL" ]]; then
          # Install psycopg2-binary
          python3 -m pip install --upgrade pip
          python3 -m pip install psycopg2-binary
          
          python3 -c "
import psycopg2
import os
from urllib.parse import urlparse

try:
    db_url = os.environ.get('DATABASE_URL')
    if db_url:
        parsed = urlparse(db_url)
        conn = psycopg2.connect(
            host=parsed.hostname,
            port=parsed.port or 5432,
            database=parsed.path[1:],
            user=parsed.username,
            password=parsed.password
        )
        conn.close()
        print('✅ Database connection successful')
    else:
        print('⚠️ No database URL configured')
except Exception as e:
    print(f'❌ Database connection failed: {e}')
    exit(1)
          "
        else
          echo "⚠️ No database URL configured - skipping database check"
        fi

    - name: Check Redis connectivity
      env:
        REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
      run: |
        echo "Checking Redis connectivity"

        if [[ -n "$REDIS_URL" ]]; then
          # Install redis package
          python3 -m pip install --upgrade pip
          python3 -m pip install redis
          
          python3 -c "
import redis
import os
from urllib.parse import urlparse

try:
    redis_url = os.environ.get('REDIS_URL')
    if redis_url:
        parsed = urlparse(redis_url)
        r = redis.Redis(
            host=parsed.hostname,
            port=parsed.port or 6379,
            password=parsed.password
        )
        r.ping()
        print('✅ Redis connection successful')
    else:
        print('⚠️ No Redis URL configured')
except Exception as e:
    print(f'❌ Redis connection failed: {e}')
    exit(1)
          "
        else
          echo "⚠️ No Redis URL configured - skipping Redis check"
        fi

  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    # Run on schedule or manual workflow dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up k6
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gpg
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6

    - name: Create performance test
      run: |
        cat > load-test.js << 'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export let options = {
          stages: [
            { duration: '1m', target: 5 },
            { duration: '2m', target: 5 },
            { duration: '1m', target: 0 },
          ],
          thresholds: {
            http_req_duration: ['p(95)<2000'],
            http_req_failed: ['rate<0.1'],
          },
        };

        export default function () {
          const API_URL = __ENV.API_URL || 'http://localhost:8000';

          // Fail fast if API_URL is not configured
          if (!API_URL || API_URL === 'http://localhost:8000') {
            throw new Error('API_URL must be configured via environment variable. Please set STAGING_API_URL secret.');
          }

          let response = http.get(`${API_URL}/health`);
          check(response, {
            'status is 200': (r) => r.status === 200,
            'response time < 2s': (r) => r.timings.duration < 2000,
          });

          sleep(1);
        }
        EOF

    - name: Run performance test
      env:
        API_URL: ${{ secrets.STAGING_API_URL }}
      run: |
        if [[ -n "$API_URL" ]]; then
          echo "Running performance test"
          k6 run --out json=results.json load-test.js || echo "Performance test completed with issues"
        else
          echo "Skipping performance test - no API URL configured"
        fi

    - name: Upload results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-results
        path: results.json

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [health-check, performance-test]
    if: failure()

    steps:
    - name: Prepare notification data
      run: |
        cat > notification.json << EOF
        {
          "run_id": "${{ github.run_id }}",
          "repository": "${{ github.repository }}",
          "health_check": "${{ needs.health-check.result }}",
          "performance_test": "${{ needs.performance-test.result }}",
          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        }
        EOF

    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: |
          🚨 System Monitoring Alert

          Health Check: ${{ needs.health-check.result }}
          Performance Test: ${{ needs.performance-test.result }}

          View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}