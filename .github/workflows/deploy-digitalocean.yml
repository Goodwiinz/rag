# =============================================================================
# GitHub Actions - Deploy to DigitalOcean DOKS
# =============================================================================
# Triggered after docker-build.yml completes successfully
# Deploys to DigitalOcean Kubernetes Service

name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Docker Build"]
    types:
      - completed
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
    options:
      - staging
      - production

permissions:
  contents: read

concurrency:
  group: deploy-do-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: rag-system-cluster
  NAMESPACE: rag-system
  REGISTRY: registry.digitalocean.com/ragsystemregistry

jobs:
  # ---------------------------------------------------------------------------
  # Check if previous workflow succeeded
  # ---------------------------------------------------------------------------
  check-trigger:
    name: Check Trigger
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check workflow trigger
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "$WORKFLOW_CONCLUSION" == "success" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Deploy to Staging
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: check-trigger
    if: |
      needs.check-trigger.outputs.should_deploy == 'true' &&
      (github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        env:
          CLUSTER: ${{ env.CLUSTER_NAME }}-staging
        run: |
          doctl kubernetes cluster kubeconfig save "$CLUSTER"

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78
        with:
          version: 'v3.14.0'

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Get image tags
        id: tags
        run: |
          # Use git SHA for image tags
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create/Update Kubernetes secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          K8S_NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          # Create namespace if not exists
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # Create app secrets (from GitHub secrets)
          kubectl create secret generic app-secrets \
            --namespace="$K8S_NAMESPACE" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        env:
          K8S_NAMESPACE: ${{ env.NAMESPACE }}
          IMAGE_TAG: ${{ steps.tags.outputs.tag }}
        run: |
          helm upgrade --install rag-system ./deployment/helm/rag-system \
            --namespace "$K8S_NAMESPACE" \
            --values ./infrastructure/digitalocean/helm/values-digitalocean.yaml \
            --set global.environment=staging \
            --set backend.image.tag="$IMAGE_TAG" \
            --set ui.image.tag="$IMAGE_TAG" \
            --set celeryWorker.image.tag="$IMAGE_TAG" \
            --set celeryBeat.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        env:
          K8S_NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          kubectl rollout status deployment/rag-backend -n "$K8S_NAMESPACE" --timeout=5m
          kubectl rollout status deployment/rag-frontend -n "$K8S_NAMESPACE" --timeout=5m

          echo "Deployment status:"
          kubectl get pods -n "$K8S_NAMESPACE"

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30

          # Get the ingress IP
          INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          # Health check
          curl -sf "http://${INGRESS_IP}/health" || echo "Health check endpoint not available yet"

  # ---------------------------------------------------------------------------
  # Deploy to Production
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: [check-trigger, deploy-staging]
    if: |
      always() &&
      needs.check-trigger.outputs.should_deploy == 'true' &&
      (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production') &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        env:
          CLUSTER: ${{ env.CLUSTER_NAME }}
        run: |
          doctl kubernetes cluster kubeconfig save "$CLUSTER"

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78
        with:
          version: 'v3.14.0'

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Get image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create/Update Kubernetes secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY_PROD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_PROD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          K8S_NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-secrets \
            --namespace="$K8S_NAMESPACE" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pre-deployment backup
        env:
          POSTGRES_CLUSTER_ID: ${{ secrets.POSTGRES_CLUSTER_ID }}
        run: |
          # Backup database before deployment
          doctl databases maintenance-window "$POSTGRES_CLUSTER_ID" --day sunday --hour 02:00 || true
          echo "Backup triggered for production database"

      - name: Deploy with Helm (Blue-Green)
        env:
          K8S_NAMESPACE: ${{ env.NAMESPACE }}
          IMAGE_TAG: ${{ steps.tags.outputs.tag }}
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
        run: |
          # Deploy with canary strategy
          helm upgrade --install rag-system ./deployment/helm/rag-system \
            --namespace "$K8S_NAMESPACE" \
            --values ./infrastructure/digitalocean/helm/values-digitalocean.yaml \
            --set global.environment=production \
            --set global.domain="$PRODUCTION_DOMAIN" \
            --set backend.image.tag="$IMAGE_TAG" \
            --set ui.image.tag="$IMAGE_TAG" \
            --set celeryWorker.image.tag="$IMAGE_TAG" \
            --set celeryBeat.image.tag="$IMAGE_TAG" \
            --set backend.replicas=3 \
            --set ui.replicas=3 \
            --set celeryWorker.replicas=3 \
            --wait \
            --timeout 15m

      - name: Verify deployment
        env:
          K8S_NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          kubectl rollout status deployment/rag-backend -n "$K8S_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/rag-frontend -n "$K8S_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/rag-celery-worker -n "$K8S_NAMESPACE" --timeout=10m

          echo "Production deployment status:"
          kubectl get pods -n "$K8S_NAMESPACE"
          kubectl get hpa -n "$K8S_NAMESPACE"

      - name: Production smoke tests
        env:
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
        run: |
          sleep 30

          # Test API health
          curl -sf "https://api.${PRODUCTION_DOMAIN}/health" || exit 1

          # Test frontend
          curl -sf "https://app.${PRODUCTION_DOMAIN}" || exit 1

          echo "Production smoke tests passed!"

      - name: Notify on success
        if: success()
        run: |
          echo "::notice::Production deployment successful!"

      - name: Rollback on failure
        if: failure()
        env:
          K8S_NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          echo "::error::Deployment failed, rolling back..."
          helm rollback rag-system -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/rag-backend -n "$K8S_NAMESPACE" --timeout=5m

  # ---------------------------------------------------------------------------
  # Post-Deployment Tasks
  # ---------------------------------------------------------------------------
  post-deploy:
    name: Post-Deployment Tasks
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Clean up old images
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Garbage collect registry
        run: |
          # Keep only last 10 image tags
          doctl registry garbage-collection start ragsystemregistry --force || true

      - name: Update deployment status
        env:
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
        run: |
          echo "Deployment pipeline completed!"
          echo "Staging: $STAGING_RESULT"
          echo "Production: $PRODUCTION_RESULT"
