name: Fast CI (GitHub-hosted)

# Fast, honest signal only. The former test-backend / test-frontend (npm+Jest)
# jobs were continue-on-error duplicates of Test Pipeline lanes that swallowed
# every failure ("|| echo") and always reported green — removed. Anything here
# must be able to fail.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. ubuntu-latest, ubuntu-22.04, or your larger runner label)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Fast)
    runs-on: ${{ github.event.inputs.runner || vars.FAST_CI_RUNNER || 'ubuntu-latest' }}
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # ruff installs with --user → lands in ~/.local (not PIP_CACHE_DIR), so
      # cache both: .pip-cache skips the PyPI download, ~/.local skips the
      # unpack. Keyed on requirements.dev.txt (where ruff is pinned) so the key
      # and the installed version stay in sync — no stale-linter poisoning.
      - name: Cache pip + ruff install
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ github.workspace }}/.pip-cache
            ~/.local
          key: ${{ runner.os }}-pip-ruff-${{ hashFiles('backend/requirements.dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ruff-

      - name: Setup Python
        run: |
          python3 --version
          pip3 install ruff==0.15.15 --quiet --user

      - name: Backend Lint (ruff)
        working-directory: backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ruff check src/ --output-format=concise

      # Blocks placeholder / empty directory docs (README.md / doc.md) from being
      # merged. See scripts/docs/README.md. Stdlib-only, nothing to install.
      - name: Directory docs lint
        run: python3 scripts/docs/check_dir_docs.py

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Frontend Lint (eslint)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend-vitest:
    name: Frontend Tests (Vitest)
    runs-on: ${{ github.event.inputs.runner || vars.FAST_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        working-directory: frontend
        run: pnpm test

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-junit
          path: frontend/coverage/junit-vitest.xml
          if-no-files-found: ignore

  summary:
    name: CI Summary
    runs-on: ${{ github.event.inputs.runner || vars.FAST_CI_RUNNER || 'ubuntu-latest' }}
    needs: [lint, test-frontend-vitest]
    if: always()
    env:
      RUNNER_LABEL: ${{ github.event.inputs.runner || vars.FAST_CI_RUNNER || 'ubuntu-latest' }}
      LINT_RESULT: ${{ needs.lint.result }}
      VITEST_RESULT: ${{ needs.test-frontend-vitest.result }}
    steps:
      - name: Summary
        run: |
          {
            echo "## Fast CI"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Lint | $LINT_RESULT |"
            echo "| Frontend Tests (Vitest) | $VITEST_RESULT |"
            echo ""
            echo "Runner: ${RUNNER_LABEL}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LINT_RESULT" != "success" ] || [ "$VITEST_RESULT" != "success" ]; then
            echo "Fast CI failed: lint=$LINT_RESULT vitest=$VITEST_RESULT"
            exit 1
          fi
