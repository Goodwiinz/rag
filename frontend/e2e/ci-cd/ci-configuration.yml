name: "🚀 E2E Test Suite"
description: "Comprehensive E2E tests for real-time document processing status updates"

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run comprehensive tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - critical
          - regression
          - accessibility
          - performance
      browser:
        description: 'Target browser'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      parallel:
        description: 'Parallel execution mode'
        required: false
        default: 'medium'
        type: choice
        options:
          - low
          - medium
          - high

env:
  NODE_ENV: test
  CI: true
  E2E_ARCHIVE_RESULTS: true

jobs:
  # Setup and Dependencies
  setup:
    name: "Setup Environment"
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      test-files-hash: ${{ steps.test-files.outputs.hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=e2e-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.{ts,tsx,js,jsx}') }}" >> $GITHUB_OUTPUT

      - name: Setup test files
        id: test-files
        run: |
          cd frontend
          mkdir -p test-data/files
          echo "Creating test files..." && \
          # Generate test files hash
          find test-data -type f -exec md5sum {} \; | md5sum | cut -d' ' -f1 >> $GITHUB_OUTPUT

  # Core E2E Tests
  e2e-core:
    name: "Core E2E Tests"
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 30
    outputs:
      results: ${{ steps.upload-results.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npm run test:e2e:install

      - name: Start services
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml up -d
          echo "Waiting for services to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Run E2E tests (shard ${{ matrix.shard }})
        run: |
          cd frontend
          npm run test:e2e -- --shard=${{ matrix.shard }} --reporter=json --reporter=html --reporter=junit

      - name: Upload test results
        id: upload-results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-core-results-shard-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-core-coverage-shard-${{ matrix.shard }}
          path: frontend/coverage/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml down

  # Critical Path Tests
  e2e-critical:
    name: "Critical Path Tests"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20
    strategy:
      fail-fast: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npm run test:e2e:install

      - name: Start services
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml up -d
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Run critical path tests
        run: |
          cd frontend
          npm run test:e2e -- --grep="@critical" --reporter=json --reporter=html

      - name: Upload critical results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-critical-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 3

      - name: Stop services
        if: always()
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml down

  # Accessibility Tests
  e2e-accessibility:
    name: "Accessibility Tests"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npm run test:e2e:install

      - name: Start services
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml up -d
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Run accessibility tests
        run: |
          cd frontend
          npm run test:e2e:accessibility

      - name: Generate accessibility report
        run: |
          cd frontend
          node scripts/process-accessibility-results.js

      - name: Upload accessibility results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-accessibility-results
          path: |
            frontend/test-results/
            frontend/accessibility-reports/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml down

  # Performance Tests
  e2e-performance:
    name: "Performance Tests"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npm run test:e2e:install

      - name: Start services
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml up -d
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Run performance tests
        run: |
          cd frontend
          npm run test:e2e:performance

      - name: Generate performance report
        run: |
          cd frontend
          node scripts/process-performance-results.js

      - name: Check for performance regressions
        run: |
          cd frontend
          node scripts/check-performance-regression.js

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-performance-results
          path: |
            frontend/test-results/
            frontend/performance-reports/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml down

  # Cross-Browser Tests
  e2e-cross-browser:
    name: "Cross-Browser Tests"
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npm run test:e2e:install

      - name: Start services
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml up -d
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Run ${{ matrix.browser }} tests (shard ${{ matrix.shard }})
        run: |
          cd frontend
          npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }} --reporter=json

      - name: Upload cross-browser results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-cross-browser-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 5

      - name: Stop services
        if: always()
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml down

  # Visual Regression Tests
  e2e-visual:
    name: "Visual Regression Tests"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit] # Firefox visual testing is experimental
        viewport: [desktop, mobile]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npm run test:e2e:install

      - name: Start services
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml up -d
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Run visual tests
        run: |
          cd frontend
          if [ "${{ matrix.viewport }}" = "mobile" ]; then
            npm run test:e2e:visual -- --project=${{ matrix.browser }} --viewport-name="Mobile Chrome"
          else
            npm run test:e2e:visual -- --project=${{ matrix.browser }} --viewport-name="Desktop Chrome"
          fi

      - name: Upload visual results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-visual-${{ matrix.browser }}-${{ matrix.viewport }}
          path: frontend/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml down

  # Mobile Responsiveness Tests
  e2e-mobile:
    name: "Mobile Responsiveness"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20
    strategy:
      matrix:
        device: ['iPhone 14', 'Pixel 5', 'iPad Pro']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npm run test:e2e:install

      - name: Start services
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml up -d
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Run mobile tests
        run: |
          cd frontend
          npm run test:e2e:mobile -- --device="${{ matrix.device }}"

      - name: Upload mobile results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-mobile-${{ matrix.device }}
          path: frontend/test-results/
          retention-days: 5

      - name: Stop services
        if: always()
        run: |
          cd ..
          docker-compose -f docker-compose.development.yml down

  # Test Results Summary
  test-summary:
    name: "Test Results Summary"
    runs-on: ubuntu-latest
    needs: [e2e-core, e2e-critical, e2e-accessibility, e2e-performance, e2e-cross-browser, e2e-visual, e2e-mobile]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate test summary
        run: |
          cd frontend
          node scripts/generate-test-summary.js

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-summary
          path: frontend/test-results/summary.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './frontend/test-results/summary.json';

            if (fs.existsSync(path)) {
              const summary = JSON.parse(fs.readFileSync(path, 'utf8'));

              const comment = `
              🧪 E2E Test Results Summary

              📊 **Overall Results:**
              - Total Tests: ${summary.total}
              - Passed: ${summary.passed} ✅
              - Failed: ${summary.failed} ❌
              - Duration: ${(summary.duration / 1000).toFixed(2)}s

              🔍 **Test Categories:**
              - Core Tests: ${summary.categories?.core || 'N/A'}
              - Critical Path: ${summary.categories?.critical || 'N/A'}
              - Accessibility: ${summary.categories?.accessibility || 'N/A'}
              - Performance: ${summary.categories?.performance || 'N/A'}
              - Cross-Browser: ${summary.categories?.crossBrowser || 'N/A'}
              - Visual: ${summary.categories?.visual || 'N/A'}
              - Mobile: ${summary.categories?.mobile || 'N/A'}

              ${summary.failed > 0 ? '❌ Some tests failed. Please review the detailed reports.' : '✅ All tests passed!'}
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Deployment Readiness Check
  deploy-readiness:
    name: "Deployment Readiness Check"
    runs-on: ubuntu-latest
    needs: [e2e-critical, e2e-accessibility]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Check test results
        id: check-results
        run: |
          cd frontend

          # Check if critical tests passed
          if [ ! -f "test-results/results.json" ]; then
            echo "No test results found"
            exit 1
          fi

          # Parse results and check for failures
          node -e "
            const results = JSON.parse(require('fs').readFileSync('test-results/results.json', 'utf8'));
            const failedTests = results.suites?.reduce((acc, suite) =>
              acc + suite.specs.filter(spec => !spec.ok).length, 0) || 0;

            if (failedTests > 0) {
              console.log(\`❌ \${failedTests} tests failed\`);
              process.exit(1);
            } else {
              console.log('✅ All tests passed');
            }
          "

      - name: Generate deployment report
        if: success()
        run: |
          echo "🚀 Deployment ready! All critical tests passed."
          echo "Build: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"