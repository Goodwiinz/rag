# =============================================================================
# Kubernetes Secrets Management for Knowledge Graph Analytics Dashboard
# =============================================================================
# This file contains the base secrets configuration. Sensitive values should
# be overridden using environment-specific secret files or external secret management

apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: database
type: Opaque
data:
  # Base64 encoded values - these should be overridden
  username: cmFndXNlcg==  # raguser
  password: ""  # SET_THIS_VALUE
  url: ""  # SET_THIS_VALUE: postgresql://raguser:password@postgres:5432/ragdb

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: cache
type: Opaque
data:
  password: ""  # SET_THIS_VALUE
  url: ""  # SET_THIS_VALUE: redis://:password@redis:6379/0

---
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: graph
type: Opaque
data:
  username: bmVvNGo=  # neo4j
  password: ""  # SET_THIS_VALUE

---
apiVersion: v1
kind: Secret
metadata:
  name: qdrant-credentials
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: vector-store
type: Opaque
data:
  api-key: ""  # SET_THIS_VALUE

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: backend
type: Opaque
data:
  secret-key: ""  # SET_THIS_VALUE (32+ character random string)
  jwt-secret: ""  # SET_THIS_VALUE (32+ character random string)
  encryption-key: ""  # SET_THIS_VALUE (32 character base64 string)

---
apiVersion: v1
kind: Secret
metadata:
  name: ai-credentials
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: ai-services
type: Opaque
data:
  openai-key: ""  # SET_THIS_VALUE (Base64 encoded)
  anthropic-key: ""  # SET_THIS_VALUE (Base64 encoded)

---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-credentials
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: monitoring
type: Opaque
data:
  grafana-admin-password: ""  # SET_THIS_VALUE (Base64 encoded)
  alertmanager-smtp-password: ""  # SET_THIS_VALUE (Base64 encoded)

---
apiVersion: v1
kind: Secret
metadata:
  name: ssl-certificates
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: ssl
type: kubernetes.io/tls
data:
  tls.crt: ""  # SET_THIS_VALUE (Base64 encoded certificate)
  tls.key: ""  # SET_THIS_VALUE (Base64 encoded private key)

---
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  namespace: knowledge-graph-analytics
  labels:
    app.kubernetes.io/name: knowledge-graph-analytics
    app.kubernetes.io/component: backup
type: Opaque
data:
  aws-access-key-id: ""  # SET_THIS_VALUE (Base64 encoded)
  aws-secret-access-key: ""  # SET_THIS_VALUE (Base64 encoded)
  backup-bucket: ""  # SET_THIS_VALUE (Base64 encoded bucket name)

---
# ExternalSecret for AWS Secrets Manager integration
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: knowledge-graph-analytics
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: production-secrets
  namespace: knowledge-graph-analytics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: external-production-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: knowledge-graph-analytics/production/database-password
    - secretKey: redis-password
      remoteRef:
        key: knowledge-graph-analytics/production/redis-password
    - secretKey: neo4j-password
      remoteRef:
        key: knowledge-graph-analytics/production/neo4j-password
    - secretKey: qdrant-api-key
      remoteRef:
        key: knowledge-graph-analytics/production/qdrant-api-key
    - secretKey: openai-api-key
      remoteRef:
        key: knowledge-graph-analytics/production/openai-api-key
    - secretKey: anthropic-api-key
      remoteRef:
        key: knowledge-graph-analytics/production/anthropic-api-key

---
# Service Account for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: knowledge-graph-analytics
  annotations:
    # IAM role for External Secrets Operator
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ExternalSecretsRole

---
# IAM Role for External Secrets Operator (should be created via Terraform)
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-secrets-role-config
  namespace: knowledge-graph-analytics
data:
  role-arn: ""  # SET_THIS_VALUE: arn:aws:iam::ACCOUNT_ID:role/ExternalSecretsRole