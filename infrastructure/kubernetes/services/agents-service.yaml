apiVersion: v1
kind: Service
metadata:
  name: rag-agents-service
  namespace: rag-system
  labels:
    app: rag-agents
    component: backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: rag-agents
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: rag-agents-headless
  namespace: rag-system
  labels:
    app: rag-agents
    component: backend
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
  selector:
    app: rag-agents
    component: backend