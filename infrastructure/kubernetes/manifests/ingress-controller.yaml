apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: rag-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "500"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/connection-proxy-header: "keep-alive"
    nginx.ingress.kubernetes.io/load-balance: "least_conn"
    nginx.ingress.kubernetes.io/healthcheck-interval: "10s"
    nginx.ingress.kubernetes.io/healthcheck-timeout: "5s"
    nginx.ingress.kubernetes.io/healthcheck-status-codes: "200-399"
    nginx.ingress.kubernetes.io/healthcheck-failure-threshold: "3"
    nginx.ingress.kubernetes.io/healthcheck-success-threshold: "1"
    nginx.ingress.kubernetes.io/upstream-max-fails: "3"
    nginx.ingress.kubernetes.io/upstream-fail-timeout: "30"
    nginx.ingress.kubernetes.io/service-critical-timeout: "300"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/service-backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/service-backend-name: "rag-backend"
    nginx.ingress.kubernetes.io/service-backend-port: "80"
  labels:
    app: rag-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.rag-system.example.com
    secretName: rag-api-tls
  - hosts:
    - ui.rag-system.example.com
    secretName: rag-ui-tls
  rules:
  - host: api.rag-system.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-api-server
            port:
              number: 80
      - path: /backend
        pathType: Prefix
        backend:
          service:
            name: rag-backend
            port:
              number: 80
      - path: /ingestion
        pathType: Prefix
        backend:
          service:
            name: rag-ingestion-service
            port:
              number: 80
  - host: ui.rag-system.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-ui
            port:
              number: 80
  - host: dashboard.rag-system.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
  additionalAnnotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "Cache-Control: no-cache, no-store, must-revalidate";
      more_set_headers "Pragma: no-cache";
      more_set_headers "Expires: 0";
      access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
      error_log /var/log/nginx/error.log warn;