apiVersion: v1
kind: Service
metadata:
  name: rag-api-server
  namespace: rag-system
  labels:
    app: rag-api-server
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    name: http
    protocol: TCP
  selector:
    app: rag-api-server
---