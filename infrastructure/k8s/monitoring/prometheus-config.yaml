# Prometheus Configuration for Knowledge Graph Analytics
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: knowledge-graph-analytics
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'production'
        environment: 'production'
        region: 'us-west-2'

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      # Kubernetes API Server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Frontend Application Metrics
      - job_name: 'frontend'
        static_configs:
          - targets: ['frontend-service:3000']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'frontend-1'

      # Backend Application Metrics
      - job_name: 'backend'
        static_configs:
          - targets: ['backend-service:8000']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'backend-1'

      # PostgreSQL Metrics
      - job_name: 'postgresql'
        static_configs:
          - targets: ['postgres-exporter:9187']
        scrape_interval: 30s
        scrape_timeout: 10s

      # Redis Metrics
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
        scrape_interval: 30s
        scrape_timeout: 10s

      # Neo4j Metrics
      - job_name: 'neo4j'
        static_configs:
          - targets: ['neo4j:2004']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s

      # Qdrant Metrics
      - job_name: 'qdrant'
        static_configs:
          - targets: ['qdrant:6333']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s

      # Kubernetes Nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes Pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

  alert-rules.yml: |
    groups:
      - name: knowledge-graph-analytics.rules
        rules:
          # Frontend Alert Rules
          - alert: FrontendDown
            expr: up{job="frontend"} == 0
            for: 1m
            labels:
              severity: critical
              service: frontend
            annotations:
              summary: "Frontend service is down"
              description: "Frontend service has been down for more than 1 minute"

          - alert: FrontendHighMemoryUsage
            expr: (container_memory_usage_bytes{name="frontend"} / container_spec_memory_limit_bytes{name="frontend"}) * 100 > 80
            for: 5m
            labels:
              severity: warning
              service: frontend
            annotations:
              summary: "Frontend high memory usage"
              description: "Frontend memory usage is above 80% for more than 5 minutes"

          - alert: FrontendHighCPUUsage
            expr: rate(container_cpu_usage_seconds_total{name="frontend"}[5m]) * 100 > 80
            for: 5m
            labels:
              severity: warning
              service: frontend
            annotations:
              summary: "Frontend high CPU usage"
              description: "Frontend CPU usage is above 80% for more than 5 minutes"

          # Backend Alert Rules
          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 1m
            labels:
              severity: critical
              service: backend
            annotations:
              summary: "Backend service is down"
              description: "Backend service has been down for more than 1 minute"

          - alert: BackendHighMemoryUsage
            expr: (container_memory_usage_bytes{name="backend"} / container_spec_memory_limit_bytes{name="backend"}) * 100 > 80
            for: 5m
            labels:
              severity: warning
              service: backend
            annotations:
              summary: "Backend high memory usage"
              description: "Backend memory usage is above 80% for more than 5 minutes"

          - alert: BackendHighCPUUsage
            expr: rate(container_cpu_usage_seconds_total{name="backend"}[5m]) * 100 > 80
            for: 5m
            labels:
              severity: warning
              service: backend
            annotations:
              summary: "Backend high CPU usage"
              description: "Backend CPU usage is above 80% for more than 5 minutes"

          - alert: BackendHighErrorRate
            expr: rate(http_requests_total{status=~"5..", job="backend"}[5m]) / rate(http_requests_total{job="backend"}[5m]) * 100 > 5
            for: 2m
            labels:
              severity: critical
              service: backend
            annotations:
              summary: "Backend high error rate"
              description: "Backend error rate is above 5% for more than 2 minutes"

          - alert: BackendHighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="backend"}[5m])) > 2
            for: 5m
            labels:
              severity: warning
              service: backend
            annotations:
              summary: "Backend high latency"
              description: "Backend 95th percentile latency is above 2 seconds for more than 5 minutes"

          # Database Alert Rules
          - alert: PostgreSQLDown
            expr: up{job="postgresql"} == 0
            for: 1m
            labels:
              severity: critical
              service: postgresql
            annotations:
              summary: "PostgreSQL is down"
              description: "PostgreSQL has been down for more than 1 minute"

          - alert: PostgreSQLHighConnections
            expr: pg_stat_database_numbackends{datname="ragdb"} > 80
            for: 5m
            labels:
              severity: warning
              service: postgresql
            annotations:
              summary: "PostgreSQL high connection count"
              description: "PostgreSQL connection count is above 80 for more than 5 minutes"

          - alert: RedisDown
            expr: up{job="redis"} == 0
            for: 1m
            labels:
              severity: critical
              service: redis
            annotations:
              summary: "Redis is down"
              description: "Redis has been down for more than 1 minute"

          - alert: RedisHighMemoryUsage
            expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
            for: 5m
            labels:
              severity: warning
              service: redis
            annotations:
              summary: "Redis high memory usage"
              description: "Redis memory usage is above 80% for more than 5 minutes"

          # Neo4j Alert Rules
          - alert: Neo4jDown
            expr: up{job="neo4j"} == 0
            for: 1m
            labels:
              severity: critical
              service: neo4j
            annotations:
              summary: "Neo4j is down"
              description: "Neo4j has been down for more than 1 minute"

          - alert: Neo4jHighMemoryUsage
            expr: neo4j_database_memory_usage_bytes / neo4j_database_memory_total_bytes * 100 > 80
            for: 5m
            labels:
              severity: warning
              service: neo4j
            annotations:
              summary: "Neo4j high memory usage"
              description: "Neo4j memory usage is above 80% for more than 5 minutes"

          # Qdrant Alert Rules
          - alert: QdrantDown
            expr: up{job="qdrant"} == 0
            for: 1m
            labels:
              severity: critical
              service: qdrant
            annotations:
              summary: "Qdrant is down"
              description: "Qdrant has been down for more than 1 minute"

          - alert: QdrantHighMemoryUsage
            expr: qdrant_memory_usage_bytes / qdrant_memory_limit_bytes * 100 > 80
            for: 5m
            labels:
              severity: warning
              service: qdrant
            annotations:
              summary: "Qdrant high memory usage"
              description: "Qdrant memory usage is above 80% for more than 5 minutes"

          # System Alert Rules
          - alert: HighPodRestartCount
            expr: kube_pod_container_status_restarts_total > 5
            for: 10m
            labels:
              severity: warning
              service: kubernetes
            annotations:
              summary: "High pod restart count"
              description: "Pod {{ $labels.pod }} has restarted more than 5 times in the last 10 minutes"

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
            for: 5m
            labels:
              severity: critical
              service: kubernetes
            annotations:
              summary: "Pod is crash looping"
              description: "Pod {{ $labels.pod }} is crash looping"

          - alert: KubernetesNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 10m
            labels:
              severity: critical
              service: kubernetes
            annotations:
              summary: "Kubernetes node not ready"
              description: "Node {{ $labels.node }} has been not ready for more than 10 minutes"

          - alert: DiskSpaceLow
            expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
            for: 5m
            labels:
              severity: critical
              service: kubernetes
            annotations:
              summary: "Low disk space"
              description: "Disk space is below 10% on {{ $labels.instance }}"