apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nous-production
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nous-platform
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Notifications — uncomment if argocd-notifications is installed
    # notifications.argoproj.io/subscribe.on-sync-succeeded.slack: nous-deploys
    # notifications.argoproj.io/subscribe.on-sync-failed.slack: nous-deploys
    # notifications.argoproj.io/subscribe.on-health-degraded.slack: nous-deploys
    argocd.argoproj.io/manifest-generate-paths: infrastructure/helm/knowledge-graph-analytics
spec:
  project: nous-platform

  source:
    repoURL: https://github.com/Goodwiinz/rag.git
    targetRevision: develop
    path: infrastructure/helm/knowledge-graph-analytics
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: rag-production

  # Manual sync: production requires explicit approval in ArgoCD UI/CLI
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    # No "automated" block — sync is manual

  # Ignore HPA-managed replica counts
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
