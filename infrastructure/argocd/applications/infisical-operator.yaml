apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-operator
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nous-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nous-platform

  source:
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts
    chart: secrets-operator
    targetRevision: 0.10.4
    helm:
      releaseName: infisical-operator
      values: |
        controllerManager:
          manager:
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
        scope: cluster

  destination:
    server: https://kubernetes.default.svc
    namespace: infisical-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
