apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nous-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: NOUS Multimodal Intelligence Platform

  # Only allow this Git repo as a source
  sourceRepos:
    - "https://github.com/Goodwiinz/rag.git"

  # Allow deploying to dev, staging, and production namespaces
  destinations:
    - server: https://kubernetes.default.svc
      namespace: rag-dev
    - server: https://kubernetes.default.svc
      namespace: rag-staging
    - server: https://kubernetes.default.svc
      namespace: rag-production
    - server: https://kubernetes.default.svc
      namespace: argocd

  # Allowed cluster-scoped resources
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  # Allowed namespace-scoped resources
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: policy
      kind: "*"
    - group: rbac.authorization.k8s.io
      kind: "*"
    - group: cert-manager.io
      kind: "*"

  # Orphaned resource monitoring
  orphanedResources:
    warn: true
