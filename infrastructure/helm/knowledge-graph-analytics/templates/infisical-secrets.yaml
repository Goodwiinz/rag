{{- /*
Infisical → K8s Secret sync.

For each entry under .Values.infisical.secrets, this creates one
InfisicalSecret CRD that pulls a folder from the Infisical project and
materializes it as a native K8s Secret with the same name the backend
already consumes via envFrom (see backend-deployment.yaml).

The operator owns the Secret lifecycle, ArgoCD ignores it (set in
ignoreDifferences on the parent Application).

Universal Auth credentials live in a single bootstrap Secret created
out-of-band — see infrastructure/kubernetes/infisical-bootstrap.md.
*/ -}}
{{- if .Values.infisical.enabled }}
{{- range $secretName, $folder := .Values.infisical.secrets }}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ printf "infisical-%s" $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "knowledge-graph-analytics.labels" $ | nindent 4 }}
    app.kubernetes.io/component: secret-sync
    infisical.com/managed-secret: {{ $secretName }}
spec:
  hostAPI: {{ $.Values.infisical.hostAPI | default "https://app.infisical.com/api" | quote }}
  resyncInterval: {{ $.Values.infisical.resyncInterval | default 60 }}
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{ required "infisical.projectSlug is required" $.Values.infisical.projectSlug | quote }}
        envSlug: {{ required "infisical.envSlug is required" $.Values.infisical.envSlug | quote }}
        secretsPath: {{ $folder | quote }}
        recursive: true
      credentialsRef:
        secretName: {{ $.Values.infisical.credentialsRef.name | default "infisical-universal-auth" }}
        secretNamespace: {{ $.Values.infisical.credentialsRef.namespace | default $.Release.Namespace }}
  managedKubeSecretReferences:
    - secretName: {{ $secretName }}
      secretNamespace: {{ $.Release.Namespace }}
      creationPolicy: Orphan
      template:
        includeAllSecrets: true
{{- end }}
{{- end }}
