{{- /*
KEDA queue-depth autoscaling for the celery-worker (audit P1.6 / finding X5).

SCAFFOLD, gated by .Values.keda.enabled — see docs/decisions/worker-autoscaling.md
for the rationale and install checklist.

When enabled, this renders a KEDA ScaledObject that scales the worker on the
depth of the Celery Redis lists (queues) directly — no Prometheus/metrics
adapter in the path. KEDA reconciles into its own HPA
(keda-hpa-<scaledobject>), so the plain CPU/memory worker HPA in
templates/hpa.yaml is suppressed while keda.enabled=true (mutual exclusion).

Connection split: host/port (address) and username are NON-SECRET and are
inlined into the trigger metadata from values (keda.redis.address /
keda.redis.username). Only the password is a secret — the TriggerAuthentication
references a single `password` key (keda.redis.passwordKey, default
REDIS_PASSWORD) from keda.redis.authSecretName (default `redis-credentials`).
So enabling KEDA needs exactly ONE new Infisical key: REDIS_PASSWORD.
DO Managed Valkey uses rediss:// (TLS) → enableTLS "true".
*/ -}}
{{- if and .Values.celeryWorker.enabled .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Release.Name }}-celery-worker-redis-auth
  labels:
    app.kubernetes.io/component: celery-worker
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.keda.redis.authSecretName }}
      key: {{ .Values.keda.redis.passwordKey | default "REDIS_PASSWORD" }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-celery-worker
  labels:
    app.kubernetes.io/component: celery-worker
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-celery-worker
  minReplicaCount: {{ .Values.keda.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount | default 3 }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 30 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 300 }}
  advanced:
    # Preserve the conservative scale-down of the plain worker HPA this
    # replaces: heavy indexing/LLM tasks are long-running, so avoid yanking a
    # worker mid-task when the queue briefly drains.
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.keda.scaleDownStabilizationSeconds | default 600 }}
  triggers:
    {{- range .Values.keda.triggers }}
    - type: redis
      metadata:
        address: {{ $.Values.keda.redis.address | quote }}
        {{- if $.Values.keda.redis.username }}
        username: {{ $.Values.keda.redis.username | quote }}
        {{- end }}
        listName: {{ .queue | quote }}
        listLength: {{ .listLength | default "10" | quote }}
        enableTLS: {{ $.Values.keda.redis.enableTLS | default "true" | quote }}
        databaseIndex: {{ $.Values.keda.redis.databaseIndex | default "0" | quote }}
      authenticationRef:
        name: {{ $.Release.Name }}-celery-worker-redis-auth
    {{- end }}
{{- end }}
