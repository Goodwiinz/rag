{{- if and .Values.qdrant.enabled (.Values.qdrant.backup).enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "knowledge-graph-analytics.fullname" . }}-qdrant-backup
  labels:
    app.kubernetes.io/component: qdrant-backup
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.qdrant.backup.schedule | default "0 3 * * 0" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: qdrant-backup
            {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: qdrant-backup
              image: curlimages/curl:8.5.0
              command:
                - /bin/sh
                - -c
                - |
                  QDRANT_URL="http://{{ include "knowledge-graph-analytics.fullname" . }}-qdrant:6333"
                  SNAPSHOT_NAME="backup-$(date +%Y%m%d-%H%M%S)"

                  echo "Creating Qdrant snapshot: ${SNAPSHOT_NAME}"

                  # Get all collections
                  COLLECTIONS=$(curl -s "${QDRANT_URL}/collections" | grep -o '"name":"[^"]*"' | cut -d'"' -f4)

                  for COLLECTION in $COLLECTIONS; do
                    echo "Snapshotting collection: ${COLLECTION}"
                    RESULT=$(curl -s -X POST "${QDRANT_URL}/collections/${COLLECTION}/snapshots")
                    echo "  Result: ${RESULT}"
                  done

                  echo "Qdrant backup complete"
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
{{- end }}
