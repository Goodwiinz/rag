{{- if .Values.neo4j.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "knowledge-graph-analytics.fullname" . }}-neo4j
  labels:
    app.kubernetes.io/component: neo4j
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "knowledge-graph-analytics.fullname" . }}-neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: neo4j
      {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: neo4j
        {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: neo4j
          image: "{{ .Values.neo4j.image.repository }}:{{ .Values.neo4j.image.tag }}"
          imagePullPolicy: {{ .Values.neo4j.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            - name: NEO4J_AUTH
              value: "neo4j/{{ .Values.neo4j.password }}"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_server_memory_heap_initial__size
              value: "{{ .Values.neo4j.resources.heapSize | default "256m" }}"
            - name: NEO4J_server_memory_heap_max__size
              value: "{{ .Values.neo4j.resources.heapSize | default "256m" }}"
            - name: NEO4J_server_memory_pagecache_size
              value: "{{ .Values.neo4j.resources.pagecacheSize | default "128m" }}"
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*"
            - name: NEO4J_server_default__advertised__address
              value: "{{ .Values.neo4j.advertisedAddress | default "localhost" }}"
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
          resources:
            {{- toYaml .Values.neo4j.resources.container | nindent 12 }}
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass | default "do-block-storage" }}
        resources:
          requests:
            storage: {{ .Values.neo4j.persistence.size | default "10Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-graph-analytics.fullname" . }}-neo4j
  labels:
    app.kubernetes.io/component: neo4j
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
  selector:
    app.kubernetes.io/component: neo4j
    {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 4 }}
{{- end }}
