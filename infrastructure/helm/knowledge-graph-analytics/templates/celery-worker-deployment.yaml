{{- if .Values.celeryWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-graph-analytics.fullname" . }}-celery-worker
  labels:
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celeryWorker.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        {{- include "knowledge-graph-analytics.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "knowledge-graph-analytics.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: celery-worker
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - celery
            - -A
            - src.tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
            - --prefetch-multiplier=1
            - --max-tasks-per-child=100
            - --max-memory-per-child=900000
            - -Q
            - celery,document_processing,high_priority,low_priority,entity_processing,graph_processing
          envFrom:
            {{- if .Values.backend.envFrom }}
            {{- toYaml .Values.backend.envFrom | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.backend.env }}
            {{- toYaml .Values.backend.env | nindent 12 }}
            {{- end }}
          resources:
            {{- if .Values.celeryWorker.resources }}
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
            {{- else }}
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
            {{- end }}
          # Targets the local worker only (-d celery@$HOSTNAME) instead of broadcasting to the
          # whole cluster — avoids false kills under CPU pressure when the control-plane
          # round-trip exceeds the probe timeout.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A src.tasks.celery_app inspect ping -d celery@$HOSTNAME --timeout={{ .Values.celeryWorker.livenessProbe.commandTimeout | default 60 }}
            initialDelaySeconds: {{ .Values.celeryWorker.livenessProbe.initialDelaySeconds | default 60 }}
            periodSeconds: {{ .Values.celeryWorker.livenessProbe.periodSeconds | default 180 }}
            timeoutSeconds: {{ .Values.celeryWorker.livenessProbe.timeoutSeconds | default 90 }}
            failureThreshold: {{ .Values.celeryWorker.livenessProbe.failureThreshold | default 10 }}
{{- end }}
