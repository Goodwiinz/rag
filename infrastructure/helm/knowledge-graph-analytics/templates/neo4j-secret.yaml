{{- if and .Values.neo4j.enabled .Values.neo4j.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge-graph-analytics.fullname" . }}-neo4j-credentials
  labels:
    app.kubernetes.io/component: neo4j
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEO4J_AUTH: "neo4j/{{ .Values.neo4j.password }}"
{{- end }}
