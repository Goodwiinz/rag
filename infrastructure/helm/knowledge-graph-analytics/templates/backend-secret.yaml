{{/*
  Backend secrets are managed externally as DO/k8s secrets:
  - database-credentials
  - app-secrets
  - spaces-credentials

  This template exists only to satisfy the checksum annotation
  in backend-deployment.yaml. No actual secrets are managed here.
*/}}
{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge-graph-analytics.fullname" . }}-backend-placeholder
  labels:
    {{- include "knowledge-graph-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
data: {}
{{- end }}
