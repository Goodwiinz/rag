# Dev values for NOUS Platform
# Auto-deployed by ArgoCD when develop branch changes
# Cluster: do-nyc3-rag-system-cluster
# Namespace: rag-dev

global:
  imageRegistry: "registry.digitalocean.com/ragsystemregistry"
  imagePullSecrets:
    - name: do-registry
  environment: "dev"
  storageClass: "do-block-storage"
commonLabels:
  app.kubernetes.io/name: knowledge-graph-analytics
  app.kubernetes.io/part-of: nous-platform
  environment: dev
# ──────────────────────────────────────────────
# Infisical secret sync — dev env
# ──────────────────────────────────────────────
infisical:
  enabled: true
  envSlug: "dev"
# ──────────────────────────────────────────────
# Frontend deployed via Vercel — no in-cluster manifests.
# Host: dev-app.gen-text.app (DNS points at Vercel).
# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: registry.digitalocean.com/ragsystemregistry/backend
    tag: "3d633c8"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    hosts:
      - host: dev-api.gen-text.app
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: rag-dev-api-tls
        hosts:
          - dev-api.gen-text.app
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 250m
      # Bumped from 512Mi: real RSS observed ~1.3Gi (gunicorn 2 forks + model
      # load). Under-requesting caused kubelet eviction (exit 137) under node
      # memory pressure on 6.5Gi-allocatable nodes.
      memory: 1500Mi
  autoscaling:
    enabled: false
  envFrom:
    - secretRef:
        name: database-credentials
    - secretRef:
        name: app-secrets
    - secretRef:
        name: spaces-credentials
    - secretRef:
        name: supabase-credentials
    - secretRef:
        name: redis-credentials
    # Optional: LangSmith tracing (LANGSMITH_API_KEY, LANGSMITH_PROJECT, ...).
    # Marked optional so the pod still starts if the secret is absent.
    - secretRef:
        name: langsmith-credentials
        optional: true
    # DigitalOcean Knowledge Base (DO_API_TOKEN, DO_KB_REGION, ...). Optional
    # so the pod still starts before the /do-kb folder is populated.
    - secretRef:
        name: do-kb-credentials
        optional: true
  env:
    - name: ENVIRONMENT
      value: "dev"
    - name: PYTHONPATH
      value: "/app"
    - name: LOG_LEVEL
      value: "DEBUG"
    - name: WORKERS
      value: "1"
    - name: TIMEOUT
      value: "300"
    # Cap glibc per-thread arenas to reduce RSS bloat (default 8*CPU on
    # multi-core). Combined with WORKERS=1, cuts steady-state memory ~30-40%.
    - name: MALLOC_ARENA_MAX
      value: "2"
    - name: CORS_ORIGINS
      value: "https://dev-app.gen-text.app,http://localhost:3000,http://127.0.0.1:3000"
    # CORS_ORIGIN_REGEX: defined in Infisical `/app` (env=dev) → synced into
    # the `app-secrets` K8s Secret, exposed via envFrom above. Set the regex
    # there to the project-specific Vercel slug (e.g.
    # ^https://nous-platform-[a-z0-9-]+\.vercel\.app$). Empty disables.
    # Database pool sizing: tuned for Supabase session-mode pooler limits
    # (Nano=15 connections). Reduce if switching to transaction-mode pooler.
    - name: DB_ASYNC_POOL_SIZE
      value: "3"
    - name: DB_ASYNC_MAX_OVERFLOW
      value: "2"
    - name: DB_SYNC_POOL_SIZE
      value: "1"
    - name: DB_SYNC_MAX_OVERFLOW
      value: "1"
    # Sentry: SENTRY_DSN comes from the `app-secrets` external secret via envFrom.
    # No-op if the key is absent.
    - name: SENTRY_ENVIRONMENT
      value: "dev"
    - name: SENTRY_TRACES_SAMPLE_RATE
      value: "1.0"
    - name: SENTRY_PROFILES_SAMPLE_RATE
      value: "0.0"
    - name: NEO4J_URI
      value: "bolt://nous-dev-knowledge-graph-analytics-neo4j:7687"
    # S3-Compatible Object Storage (DigitalOcean Spaces)
    - name: STORAGE_BACKEND
      value: "s3"
    - name: S3_ENDPOINT_URL
      value: "https://nyc3.digitaloceanspaces.com"
    - name: S3_BUCKET_NAME
      value: "rag-system-storage"
    - name: S3_REGION
      value: "nyc3"
    - name: S3_CDN_ENDPOINT
      value: "https://rag-system-storage.nyc3.cdn.digitaloceanspaces.com"
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: spaces-credentials
          key: S3_ACCESS_KEY
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: spaces-credentials
          key: S3_SECRET_KEY
    # Azure OpenAI (Chat / Agent)
    - name: AZURE_OPENAI_CHAT_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_ENDPOINT
    - name: AZURE_OPENAI_CHAT_API_KEY
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_API_KEY
    - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
    - name: AZURE_OPENAI_CHAT_API_VERSION
      valueFrom:
        secretKeyRef:
          name: azure-openai-credentials
          key: AZURE_OPENAI_CHAT_API_VERSION
  healthCheck:
    enabled: true
    path: /health
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 18
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    readinessInitialDelaySeconds: 5
    readinessPeriodSeconds: 10
    readinessTimeoutSeconds: 3
    readinessFailureThreshold: 2
  initContainers:
    waitForPostgres: true
    waitForRedis: false
    # Run `alembic upgrade heads` before starting the app. Prevents schema drift
    # like the chat_messages.tool_executions UndefinedColumnError seen in dev.
    runMigrations: true
    waitForNeo4j: false
    waitForQdrant: false
# ──────────────────────────────────────────────
# All databases are external (DO Managed)
# ──────────────────────────────────────────────
postgresql:
  enabled: false
redis:
  enabled: false
neo4j:
  enabled: true
  image:
    repository: neo4j
    tag: "5.26-community"
    pullPolicy: IfNotPresent
  # password: supply via --set neo4j.password=... at deploy time
  advertisedAddress: "dev-neo4j.gen-text.app"
  persistence:
    size: 5Gi
  resources:
    heapSize: "128m"
    pagecacheSize: "64m"
    container:
      limits:
        cpu: 300m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
qdrant:
  enabled: true
  persistence:
    size: 5Gi
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  config:
    service:
      api_key: ""
      http_port: 6333
      grpc_port: 6334
  backup:
    enabled: true
    schedule: "0 3 * * 0" # Weekly Sunday 3am
celeryWorker:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  livenessProbe:
    commandTimeout: 60
    initialDelaySeconds: 60
    periodSeconds: 180
    timeoutSeconds: 90
    failureThreshold: 10
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
celeryBeat:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 384Mi
prometheus:
  enabled: false
grafana:
  enabled: false
nginx-ingress-controller:
  enabled: false
monitoring:
  enabled: false
# ──────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
podSecurityPolicy:
  enabled: false
networkPolicy:
  enabled: false
podDisruptionBudget:
  enabled: true
  minAvailable: 1
serviceAccount:
  create: true
  annotations: {}
  name: ""
