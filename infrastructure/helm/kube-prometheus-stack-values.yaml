# kube-prometheus-stack resource limits — resolves DOKS clusterlint warnings
# Covers: grafana (+ sidecars + init), kube-prometheus-stack operator,
#          kube-state-metrics, node-exporter, config-reloader
#
# Apply with:
#   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring -f kube-prometheus-stack-values.yaml

# Prometheus Operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # config-reloader sidecar (also covers init-config-reloader)
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Grafana subchart
grafana:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  initChownData:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  # Grafana 7.3.x: sidecar.resources applies to ALL sidecars (sc-dashboard, sc-datasources)
  sidecar:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # NOTE: Grafana DOBS volume warning is acknowledged. Converting from
  # Deployment to StatefulSet requires PVC migration — handle separately.
  # See: https://docs.digitalocean.com/products/kubernetes/how-to/

# kube-state-metrics subchart
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Prometheus node-exporter subchart
prometheus-node-exporter:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 180Mi
